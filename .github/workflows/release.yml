name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic display version, for example 1.0.0
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  RELEASE_VERSION: ${{ inputs.version }}
  # MAUI maps ApplicationVersion to Android versionCode and iOS CFBundleVersion.
  # GitHub run numbers are monotonically increasing per workflow, so every store
  # submission gets a higher build number while the human version stays explicit.
  STORE_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: Signed Android AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-release-android-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-release-android-

      - name: Install MAUI Android workload
        run: dotnet workload install android --skip-sign-check

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/forge-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Publish signed Android App Bundle
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dotnet publish src/Forge.App/Forge.App.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormats=aab \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
            -p:ApplicationDisplayVersion="$RELEASE_VERSION" \
            -p:ApplicationVersion="$STORE_BUILD_NUMBER" \
            -o artifacts/android

      - name: Remove Android keystore
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-android-aab-${{ inputs.version }}-${{ github.run_number }}
          path: artifacts/android/**/*.aab
          if-no-files-found: error

      - name: Play Console upload TODO
        run: |
          echo "TODO: Upload the signed AAB to Google Play Console once API credentials and release track policy are configured." >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Signed iOS archive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-release-ios-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-release-ios-

      - name: Install MAUI iOS workload
        run: dotnet workload install ios --skip-sign-check

      - name: Import iOS signing assets
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/forge-distribution.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$profile_dir/forge.mobileprovision"
          keychain_path="$RUNNER_TEMP/forge-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"

          mkdir -p "$profile_dir"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/[ "]//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"

          echo "IOS_CERT_PATH=$cert_path" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$profile_path" >> "$GITHUB_ENV"
          echo "IOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Publish signed iOS IPA
        shell: bash
        env:
          IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          dotnet publish src/Forge.App/Forge.App.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:CodesignKey="$IOS_CODESIGN_KEY" \
            -p:CodesignProvision="$IOS_PROVISIONING_PROFILE_NAME" \
            -p:ApplicationDisplayVersion="$RELEASE_VERSION" \
            -p:ApplicationVersion="$STORE_BUILD_NUMBER" \
            -o artifacts/ios

      - name: Remove iOS signing assets
        if: always()
        shell: bash
        run: |
          rm -f "$IOS_CERT_PATH" "$IOS_PROFILE_PATH"
          if [ -n "${IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$IOS_KEYCHAIN_PATH" || true
          fi

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-ios-ipa-${{ inputs.version }}-${{ github.run_number }}
          path: artifacts/ios/**/*.ipa
          if-no-files-found: error

      - name: TestFlight upload TODO
        run: |
          echo "TODO: Upload the IPA to TestFlight once App Store Connect API credentials and release policy are configured." >> "$GITHUB_STEP_SUMMARY"
