name: CI

# Validates every pull request and every push to any branch.
#
# The jobs are split by cost. Core and backlog validation run on Linux in under a couple of
# minutes and catch the majority of mistakes; the platform builds are slower and only need to
# run once the cheap gates are green. Failing fast on the cheap jobs keeps the feedback loop
# tight while parallel feature work is landing.
#
# Feature branches are included deliberately. Restricting pushes to main meant CI never ran
# during long-lived branch work, and a .gitignore rule that excluded the entire application
# from the repository went unnoticed across four waves - a fresh clone could not build, and
# nothing reported it because nothing ever built a fresh clone.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backlog:
    name: Validate backlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-powershell-yaml-v1

      - name: Install powershell-yaml
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name powershell-yaml)) {
            Install-Module powershell-yaml -Scope CurrentUser -Force -AllowClobber
          }

      - name: Validate backlog YAML
        shell: pwsh
        run: ./tools/backlog-sync/Invoke-BacklogSync.ps1 -Validate

  core:
    name: Core libraries and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The inner layers target plain net10.0 and carry no MAUI dependency, so they build and
      # test on Linux with no workload installation. That is the point of the dependency rule:
      # the majority of the product logic is verifiable without an emulator or a Mac.
      - name: Restore
        run: |
          dotnet restore src/Forge.Domain/Forge.Domain.csproj
          dotnet restore src/Forge.Core/Forge.Core.csproj
          dotnet restore src/Forge.Infrastructure/Forge.Infrastructure.csproj
          dotnet restore tests/Forge.Domain.Tests/Forge.Domain.Tests.csproj
          dotnet restore tests/Forge.Core.Tests/Forge.Core.Tests.csproj
          dotnet restore tests/Forge.Infrastructure.Tests/Forge.Infrastructure.Tests.csproj

      - name: Format and analyzer gate
        run: |
          dotnet format src/Forge.Domain/Forge.Domain.csproj --verify-no-changes --no-restore --verbosity minimal
          dotnet format src/Forge.Core/Forge.Core.csproj --verify-no-changes --no-restore --verbosity minimal
          dotnet format src/Forge.Infrastructure/Forge.Infrastructure.csproj --verify-no-changes --no-restore --verbosity minimal
          dotnet format tests/Forge.Domain.Tests/Forge.Domain.Tests.csproj --verify-no-changes --no-restore --verbosity minimal
          dotnet format tests/Forge.Core.Tests/Forge.Core.Tests.csproj --verify-no-changes --no-restore --verbosity minimal
          dotnet format tests/Forge.Infrastructure.Tests/Forge.Infrastructure.Tests.csproj --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: |
          dotnet build tests/Forge.Domain.Tests/Forge.Domain.Tests.csproj --no-restore -c Release
          dotnet build tests/Forge.Core.Tests/Forge.Core.Tests.csproj --no-restore -c Release
          dotnet build tests/Forge.Infrastructure.Tests/Forge.Infrastructure.Tests.csproj --no-restore -c Release

      # A page that is routed but not registered for DI compiles, passes every unit test, and
      # then throws the first time a user navigates to it. Features are built in parallel by
      # different people, so this pairing is easy to get half-right. Cheap to check here.
      - name: Verify routed pages are registered for dependency injection
        shell: pwsh
        run: ./tools/ci/Test-RouteRegistrations.ps1

      # Resolving a repository and a unit of work separately gives each its own DbContext, so
      # the save commits an empty change tracker and the writes vanish with no error at all.
      # Nothing about that failure is visible in a build or a unit test, so guard the seam.
      - name: Verify database access goes through the data-session seam
        shell: pwsh
        run: ./tools/ci/Test-DataAccessPatterns.ps1

      - name: Test with coverlet coverage
        run: |
          dotnet test tests/Forge.Domain.Tests/Forge.Domain.Tests.csproj --no-build -c Release -- --results-directory artifacts/coverage/Domain --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          dotnet test tests/Forge.Core.Tests/Forge.Core.Tests.csproj --no-build -c Release -- --results-directory artifacts/coverage/Core --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          dotnet test tests/Forge.Infrastructure.Tests/Forge.Infrastructure.Tests.csproj --no-build -c Release -- --results-directory artifacts/coverage/Infrastructure --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      # The threshold is a ratchet, not an aspiration. It was set to 70% while CI never ran, and
      # the first real measurement came out at 26.52% - so 70% was never anything but a number in
      # a file. This floor is just under the measured value: it blocks regression today and
      # should be raised deliberately as Domain and Core tests grow.
      - name: Enforce domain logic coverage threshold
        shell: pwsh
        run: ./tools/ci/Test-CoverageThreshold.ps1 -CoverageRoot artifacts/coverage -ThresholdPercent 25 -PathFilters 'src/Forge.Domain','src/Forge.Core'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-coverage
          path: artifacts/coverage
          if-no-files-found: error

  android-size:
    name: Android size budget
    runs-on: ubuntu-latest
    needs: [core, backlog]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-size-android-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-size-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Build release AAB for size budget
        run: dotnet publish src/Forge.App/Forge.App.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=aab -p:ApplicationVersion=${{ github.run_number }} -o artifacts/android-size

      - name: Enforce 40 MB Android package budget
        shell: bash
        run: |
          set -euo pipefail
          package_path="$(find artifacts/android-size -name '*.aab' -print -quit)"
          if [ -z "$package_path" ]; then
            echo "No Android AAB was produced." >&2
            exit 1
          fi

          bytes="$(stat -c%s "$package_path")"
          mib="$(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }")"
          limit_bytes=$((40 * 1024 * 1024))

          {
            echo "## Android size budget"
            echo ""
            echo "| Artifact | Size | Budget |"
            echo "| --- | ---: | ---: |"
            echo "| $(basename "$package_path") | ${mib} MiB | 40.00 MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$bytes" -gt "$limit_bytes" ]; then
            echo "Android package is ${mib} MiB, exceeding the 40 MiB budget." >&2
            exit 1
          fi

      - name: Upload Android size artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-size-budget-aab
          path: artifacts/android-size/**/*.aab
          if-no-files-found: error

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: [core, backlog]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Build
        run: dotnet build src/Forge.App/Forge.App.csproj -f net10.0-android -c Release

  ios:
    name: iOS build
    runs-on: macos-latest
    needs: [core, backlog]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ios-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-ios-

      - name: Install MAUI iOS workload
        # macOS evaluates both target frameworks, so it needs the Android workload too. Restoring
        # from the project installs exactly what the project declares rather than a hand-kept list.
        run: dotnet workload restore src/Forge.App/Forge.App.csproj --skip-sign-check

      # No code signing here. This job proves the iOS head compiles; signed device builds and
      # TestFlight upload belong to the release workflow, where the signing secrets live.
      - name: Build
        run: dotnet build src/Forge.App/Forge.App.csproj -f net10.0-ios -c Release
