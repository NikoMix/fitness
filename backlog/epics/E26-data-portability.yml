key: E26
title: Data Portability, Backup and Restore
domain: data
wave: 4
summary: >-
  Forge has no cloud account and no server copy, so portability is a correctness requirement and a GDPR Article 20 obligation.
  This epic gives users encrypted backups, safe restore, open exports and competitor imports while making irreversible local
  data loss clear.
problem: >-
  Users can lose years of special-category fitness and nutrition data if a phone is lost, the app is uninstalled or a bad
  restore overwrites the active store. They also need practical ways to leave, audit or join Forge without re-entering their
  history.
outcome: >-
  Users can create and verify encrypted local backups, restore compatible archives with explicit overwrite consent, export
  selected or complete data in open formats, import common competitor files, and understand that Forge cannot recover unbacked
  data.
successMetrics:
- A complete encrypted backup of the 50,000 set fixture verifies in under 60 seconds.
- Restore rejects corrupt or incompatible archives before active database replacement in all negative tests.
- CSV export covers every user-created entity with stable headers validated by snapshots.
- Supported competitor import previews map at least 95 percent of valid rows in representative fixtures.
nonGoals:
- No automatic cloud sync, hosted backup service or remote account.
- No automatic upload to analytics, crash reporting or support systems.
- No desktop-only portability tools in waves 1 to 5.
risks:
- risk: Restore overwrites the only valid database with an incompatible archive.
  mitigation: Perform manifest, schema, checksum and decryptability preflight before safety copy and replacement.
  severity: critical
- risk: Exports omit data required for portability rights.
  mitigation: Drive coverage tests from the persistence model and fail when user-created tables lack an exporter.
  severity: high
- risk: Competitor export formats change without notice.
  mitigation: Use fixture-based adapters with preview and document unverified mappings as open questions.
  severity: medium
grounding:
- title: GDPR right to data portability
  url: https://gdpr.eu/article-20-right-to-data-portability/
  note: Explains the portability obligation behind open exports.
- title: .NET MAUI file picker
  url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-picker
  note: Used for user-chosen backup, restore and import files.
- title: .NET MAUI share files
  url: https://learn.microsoft.com/dotnet/maui/platform-integration/data/share
  note: Used to share exports only after explicit user action.
- title: RFC 4180 CSV format
  url: https://www.rfc-editor.org/rfc/rfc4180
  note: Defines interoperable CSV rules.
features:
- key: F26.01
  title: Create encrypted local backups
  wave: 4
  summary: >-
    Let users write complete encrypted backups to files they control, verify them and receive local-only risk reminders.
  outcome: >-
    A verified backup exists before risky device changes or uninstall.
  concerns: [security, privacy, offline]
  dependsOn: [E04]
  stories:
  - key: S26.01.01
    title: Create a full encrypted backup archive
    wave: 4
    size: l
    platforms: [android, ios]
    persona: enthusiast
    concerns: [security, privacy]
    userStory:
      asA: enthusiast user
      iWant: a complete encrypted backup file
      soThat: losing my phone does not mean losing Forge history
    requirements:
    - Backup includes database content, schema version, app version, catalogue manifests and checksums.
    - Archive encryption uses a backup-specific key or passphrase and never reuses the SQLCipher database key directly.
    - The user chooses the destination through the OS document flow and the 50,000 set fixture backs up in under 60 
      seconds.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: the database contains all core entity types
      when: backup completes
      then: the archive decrypts and contains every user-created table
    - id: AC2
      given: the 50,000 set fixture is backed up
      when: duration is measured
      then: backup and verification finish under 60 seconds
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
    - id: AC4
      given: the flow reaches its final destructive or sharing step
      when: the user has not given the explicit per-incident confirmation
      then: no database replacement, export share or import commit occurs
    implementation:
      notes: >-
        Implement BackupArchiveService in Infrastructure and expose it through Application. Stream data with manifest and
        checksums; app code only selects the destination.  Implement this through Application portability interfaces with
        Infrastructure services in src/Forge.Core/Portability/IBackupArchiveService.cs, src/Forge.Infrastructure/Portability/BackupArchiveService.cs;
        Forge.App should only own DevExpress review UI and the OS FilePicker or Share entry point. Treat GDPR Article 20 portability
        and Article 9 health data as design constraints: validate manifests, schema versions, checksums and user-selected
        categories before any commit. Stage imports and restores away from the active SQLCipher database, then commit transactionally
        after review. A careless implementation would trust competitor files, auto-share exports, or overwrite the sole local
        record without a verified safety copy.
      touches: [src/Forge.Core/Portability/IBackupArchiveService.cs, 
          src/Forge.Infrastructure/Portability/BackupArchiveService.cs]
      devexpress:
      - TextEdit
      - DXButton
      - DXProgressBar
      apis:
      - Microsoft.Maui.Storage.FilePicker
      - System.Security.Cryptography
    testing:
    - Round-trip backup creation and decryption test.
    - Malformed input fixture test proving the app reports errors without crashing.
    - No-write test proving cancellation or failed validation leaves the active database unchanged.
    grounding:
    - title: GDPR Article 20
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds the right to data portability for local user records.
    - title: .NET MAUI file picker
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-picker
      note: Grounds explicit user-selected backup, restore and import files.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
    - title: Cryptographic Services in .NET
      url: https://learn.microsoft.com/dotnet/standard/security/cryptographic-services
      note: Grounds checksums and encryption primitives.
  - key: S26.01.02
    title: Verify backup integrity before success
    wave: 4
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [security]
    userStory:
      asA: returner user
      iWant: Forge to verify a backup file before I trust it
      soThat: I do not uninstall with a corrupt only copy
    requirements:
    - The created archive is reopened and checksum-verified before success is shown.
    - Verification failure leaves the active database untouched.
    - Progress appears for verification taking longer than 1 second with stable error codes.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: one byte in the archive payload is modified
      when: verification runs
      then: verification fails and names the checksum section
    - id: AC2
      given: verification fails
      when: the user returns to Forge
      then: the active database checksum is unchanged
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
    - id: AC4
      given: the flow reaches its final destructive or sharing step
      when: the user has not given the explicit per-incident confirmation
      then: no database replacement, export share or import commit occurs
    implementation:
      notes: >-
        Treat verification as part of backup. The ViewModel must not show success until BackupVerifier has reopened the exact
        output file and checked manifest plus payload.  Implement this through Application portability interfaces with Infrastructure
        services in src/Forge.Infrastructure/Portability/BackupVerifier.cs; Forge.App should only own DevExpress review UI
        and the OS FilePicker or Share entry point. Treat GDPR Article 20 portability and Article 9 health data as design
        constraints: validate manifests, schema versions, checksums and user-selected categories before any commit. Stage
        imports and restores away from the active SQLCipher database, then commit transactionally after review. A careless
        implementation would trust competitor files, auto-share exports, or overwrite the sole local record without a verified
        safety copy.
      touches: [src/Forge.Infrastructure/Portability/BackupVerifier.cs]
      devexpress:
      - DXProgressBar
      - DXPopup
      apis:
      - System.Security.Cryptography.SHA256
    testing:
    - Corrupt manifest and payload verification tests.
    - Malformed input fixture test proving the app reports errors without crashing.
    - No-write test proving cancellation or failed validation leaves the active database unchanged.
    grounding:
    - title: GDPR Article 20
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds the right to data portability for local user records.
    - title: .NET MAUI file picker
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-picker
      note: Grounds explicit user-selected backup, restore and import files.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
    - title: Cryptographic Services in .NET
      url: https://learn.microsoft.com/dotnet/standard/security/cryptographic-services
      note: Grounds checksums and encryption primitives.
