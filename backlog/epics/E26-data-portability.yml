        src/Forge.App/Features/Settings/BackupReminderPage.xaml; Forge.App should only own DevExpress review UI and the OS
        FilePicker or Share entry point. Treat GDPR Article 20 portability and Article 9 health data as design constraints:
        validate manifests, schema versions, checksums and user-selected categories before any commit. Stage imports and restores
        away from the active SQLCipher database, then commit transactionally after review. A careless implementation would
