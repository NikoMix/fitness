    - Reminder choices are weekly, monthly or disabled.
    - Reminder copy states that Forge has no server copy.
    - Scheduling uses local notifications only and a successful backup suppresses reminders for 7 days.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: weekly reminders are enabled and no backup exists
