      then: only restore operations remain within 300 ms
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
    - id: AC4
      given: the flow reaches its final destructive or sharing step
      when: the user has not given the explicit per-incident confirmation
      then: no database replacement, export share or import commit occurs
    implementation:
