      touches: [src/Forge.Infrastructure/Notifications/BackupReminderScheduler.cs, 
          src/Forge.App/Features/Settings/BackupReminderPage.xaml]
      devexpress:
      - ComboBoxEdit
      - DXButton
      apis:
      - Plugin.LocalNotification
    testing:
    - Reminder cadence and suppression unit tests.
    - Malformed input fixture test proving the app reports errors without crashing.
    - No-write test proving cancellation or failed validation leaves the active database unchanged.
    grounding:
    - title: GDPR Article 20
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds the right to data portability for local user records.
    - title: .NET MAUI file picker
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-picker
      note: Grounds explicit user-selected backup, restore and import files.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
    - title: Cryptographic Services in .NET
      url: https://learn.microsoft.com/dotnet/standard/security/cryptographic-services
      note: Grounds checksums and encryption primitives.
- key: F26.02
  title: Restore backups with overwrite safety
  wave: 4
  summary: >-
    Validate archive compatibility and replace the active database atomically only after explicit user confirmation.
  outcome: >-
    Restore cannot silently damage the current local store.
  concerns: [security, privacy]
  dependsOn: [F26.01, E04]
  stories:
  - key: S26.02.01
    title: Preflight backup restore compatibility
    wave: 4
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [security]
    userStory:
      asA: returner user
      iWant: Forge to check a backup before restore
      soThat: valid current data is not replaced by an incompatible archive
    requirements:
    - Preflight validates signature, manifest version, schema version, app version range and checksums.
    - No active database file is modified during preflight.
    - Preview shows backup date, app version and record counts and the large fixture preflights under 10 seconds.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: a future unsupported schema backup is selected
      when: preflight runs
      then: restore is blocked and active database timestamp is unchanged
    - id: AC2
      given: a valid backup is selected
      when: preflight completes
      then: preview shows creation date, app version, workout count and meal count
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
    - id: AC4
      given: the flow reaches its final destructive or sharing step
      when: the user has not given the explicit per-incident confirmation
      then: no database replacement, export share or import commit occurs
    implementation:
      notes: >-
        Build RestorePreflightService to read metadata and checksums without opening or replacing the active database. Return
        typed results for UI decisions.  Implement this through Application portability interfaces with Infrastructure services
        in src/Forge.Core/Portability/IRestorePreflightService.cs, src/Forge.Infrastructure/Portability/RestorePreflightService.cs;
        Forge.App should only own DevExpress review UI and the OS FilePicker or Share entry point. Treat GDPR Article 20 portability
        and Article 9 health data as design constraints: validate manifests, schema versions, checksums and user-selected
        categories before any commit. Stage imports and restores away from the active SQLCipher database, then commit transactionally
        after review. A careless implementation would trust competitor files, auto-share exports, or overwrite the sole local
        record without a verified safety copy.
      touches: [src/Forge.Core/Portability/IRestorePreflightService.cs, 
          src/Forge.Infrastructure/Portability/RestorePreflightService.cs]
      devexpress:
      - DXCollectionView
      - DXButton
      apis:
      - Microsoft.Maui.Storage.FilePicker
      - System.Security.Cryptography.SHA256
    testing:
    - Negative preflight tests for future schema and corrupt checksum.
    - Malformed input fixture test proving the app reports errors without crashing.
    - No-write test proving cancellation or failed validation leaves the active database unchanged.
    grounding:
    - title: .NET MAUI file picker
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-picker
      note: Grounds explicit user-selected backup, restore and import files.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
    - title: Cryptographic Services in .NET
      url: https://learn.microsoft.com/dotnet/standard/security/cryptographic-services
      note: Grounds checksums and encryption primitives.
  - key: S26.02.02
    title: Require typed confirmation before restore overwrite
    wave: 4
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [privacy, a11y]
    userStory:
      asA: returner user
      iWant: a clear overwrite warning
      soThat: I do not accidentally replace my only local copy
    requirements:
    - Confirmation states that current local data will be replaced.
    - Final restore is disabled until the user types RESTORE exactly.
    - A pre-restore safety backup is created before replacement.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: a valid preflight result exists
      when: confirmation opens
      then: Restore remains disabled until RESTORE is typed
    - id: AC2
      given: final restore is confirmed
      when: replacement begins
      then: a safety backup of the current database is created first
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
    - id: AC4
      given: the flow reaches its final destructive or sharing step
      when: the user has not given the explicit per-incident confirmation
      then: no database replacement, export share or import commit occurs
    implementation:
      notes: >-
        Use DXPopup with TextEdit for typed confirmation, showing current local backup date and incoming archive date before
        E04 safety-copy service runs.  Implement this through Application portability interfaces with Infrastructure services
        in src/Forge.App/Features/Portability/RestoreConfirmationPopup.xaml; Forge.App should only own DevExpress review UI
        and the OS FilePicker or Share entry point. Treat GDPR Article 20 portability and Article 9 health data as design
        constraints: validate manifests, schema versions, checksums and user-selected categories before any commit. Stage
        imports and restores away from the active SQLCipher database, then commit transactionally after review. A careless
        implementation would trust competitor files, auto-share exports, or overwrite the sole local record without a verified
        safety copy.
      touches: [src/Forge.App/Features/Portability/RestoreConfirmationPopup.xaml]
      devexpress:
      - DXPopup
      - TextEdit
      - DXButton
      apis:
      - Microsoft.Maui.Accessibility.SemanticScreenReader
    testing:
    - UI tests for typed phrase and safety-copy ordering.
    - Malformed input fixture test proving the app reports errors without crashing.
    - No-write test proving cancellation or failed validation leaves the active database unchanged.
    grounding:
    - title: GDPR Article 9
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds treating health and fitness records as special-category data.
    - title: DevExpress MAUI Popup
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.DXPopup
      note: Grounds explicit confirmations and review dialogs.
    - title: .NET MAUI accessibility
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/accessibility
      note: Grounds accessible review and confirmation screens.
  - key: S26.02.03
    title: Replace the active database atomically
    wave: 4
    size: l
    platforms: [android, ios]
    persona: team
    concerns: [security, offline]
    userStory:
      asA: Forge team member
      iWant: restore file replacement to be journaled
      soThat: a process kill cannot leave Forge with no valid database
    requirements:
    - Restore extracts to staging before active replacement.
    - Database, WAL and SHM files are swapped as one operation group.
    - A restore journal records stage and startup reconciles interrupted restore.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: restore is killed after staging before swap
      when: the app restarts
      then: the original database opens and resume restore is offered
    - id: AC2
      given: restore is killed after swap before cleanup
      when: startup reconciliation runs
      then: the restored database opens and staging files are removed
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
    - id: AC4
      given: the flow reaches its final destructive or sharing step
      when: the user has not given the explicit per-incident confirmation
      then: no database replacement, export share or import commit occurs
    implementation:
      notes: >-
        Implement RestoreExecutor as a journaled state machine. Close active connections, stage files, swap database plus
        WAL and SHM, then run integrity_check.  Implement this through Application portability interfaces with Infrastructure
        services in src/Forge.Infrastructure/Portability/RestoreExecutor.cs, src/Forge.Infrastructure/Portability/RestoreJournal.cs;
        Forge.App should only own DevExpress review UI and the OS FilePicker or Share entry point. Treat GDPR Article 20 portability
        and Article 9 health data as design constraints: validate manifests, schema versions, checksums and user-selected
        categories before any commit. Stage imports and restores away from the active SQLCipher database, then commit transactionally
        after review. A careless implementation would trust competitor files, auto-share exports, or overwrite the sole local
        record without a verified safety copy.
      touches: [src/Forge.Infrastructure/Portability/RestoreExecutor.cs, 
          src/Forge.Infrastructure/Portability/RestoreJournal.cs]
      apis:
      - Microsoft.Maui.Storage.FileSystem
      - SQLite PRAGMA integrity_check
    testing:
    - Fault-injection tests at every restore stage.
    - Malformed input fixture test proving the app reports errors without crashing.
    - No-write test proving cancellation or failed validation leaves the active database unchanged.
    grounding:
    - title: .NET MAUI file picker
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-picker
      note: Grounds explicit user-selected backup, restore and import files.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
    - title: Cryptographic Services in .NET
      url: https://learn.microsoft.com/dotnet/standard/security/cryptographic-services
      note: Grounds checksums and encryption primitives.
- key: F26.03
  title: Export open data formats
  wave: 4
  summary: >-
    Produce CSV and JSON exports for complete portability and selective sharing, with reviewable contents.
  outcome: >-
    Users can inspect or share their records without proprietary lock-in.
  concerns: [privacy, offline]
  dependsOn: [E04]
  stories:
  - key: S26.03.01
    title: Export all user entities as CSV
    wave: 4
    size: l
    platforms: [android, ios]
    persona: enthusiast
    concerns: [privacy]
    userStory:
      asA: enthusiast user
      iWant: CSV files for each Forge entity
      soThat: I can analyse my data outside the app
    requirements:
    - CSV export creates one RFC 4180-compatible file per user-created entity type.
    - Headers are stable and covered by snapshot tests.
    - UTC timestamps, units and soft-delete markers are included and the large fixture exports in under 45 seconds.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: all entity types exist
      when: CSV export runs
      then: separate files for workouts, sets, meals, hydration, body metrics, achievements and overrides are present
    - id: AC2
      given: exported CSV files are parsed
      when: rows are validated
      then: every row has the same column count as its header
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
    - id: AC4
      given: the flow reaches its final destructive or sharing step
      when: the user has not given the explicit per-incident confirmation
      then: no database replacement, export share or import commit occurs
    implementation:
      notes: >-
        Export from explicit projections, stream each CSV into an archive, and use the share sheet only after review.  Implement
        this through Application portability interfaces with Infrastructure services in src/Forge.Infrastructure/Portability/CsvExportService.cs;
        Forge.App should only own DevExpress review UI and the OS FilePicker or Share entry point. Treat GDPR Article 20 portability
        and Article 9 health data as design constraints: validate manifests, schema versions, checksums and user-selected
        categories before any commit. Stage imports and restores away from the active SQLCipher database, then commit transactionally
        after review. A careless implementation would trust competitor files, auto-share exports, or overwrite the sole local
        record without a verified safety copy.
      touches: [src/Forge.Infrastructure/Portability/CsvExportService.cs]
      devexpress:
      - DXCollectionView
      - CheckEdit
      - DXButton
      apis:
      - System.IO.Compression.ZipArchive
    testing:
    - Header snapshot tests and CSV parser tests.
    - Malformed input fixture test proving the app reports errors without crashing.
    - No-write test proving cancellation or failed validation leaves the active database unchanged.
    grounding:
    - title: GDPR Article 20
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds the right to data portability for local user records.
    - title: RFC 4180 CSV format
      url: https://www.rfc-editor.org/rfc/rfc4180
      note: Grounds interoperable CSV quoting and row validation.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
  - key: S26.03.02
    title: Export a complete JSON archive
    wave: 4
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [privacy]
    userStory:
      asA: Forge team member
      iWant: a complete machine-readable JSON archive
      soThat: another tool can reconstruct relationships without guessing
    requirements:
    - JSON export includes schema version, timestamp, entities and relationship identifiers.
    - Export is deterministic except documented volatile metadata.
    - Generated JSON validates against a committed schema.
    - Malformed, corrupt, cancelled and unsupported-version inputs must return stable errors without crashing or 
      changing the active database.
    - Copy must state that Forge has no backend and uninstall without a verified backup is irreversible data loss.
    acceptanceCriteria:
    - id: AC1
      given: workout sets reference exercises
      when: JSON export runs
      then: each referenced exercise id exists in the same archive
    - id: AC2
      given: the committed schema is applied
      when: archive validates
      then: zero schema errors occur
    - id: AC3
      given: a malformed or truncated file is selected
      when: the operation runs
      then: Forge reports a stable validation error, does not crash and leaves the active database timestamp unchanged
