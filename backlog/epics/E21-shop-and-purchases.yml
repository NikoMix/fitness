    - The screen includes Restore purchases, Refresh store status, Terms, Privacy and support export actions.
    - Purchase history shows local purchase attempts and restored entitlements without exposing payment instrument data.
    - If the store is unavailable, the screen shows the last known entitlement state and a retry action.
    - Restore purchases is reachable within two taps from the Profile or Settings area.
