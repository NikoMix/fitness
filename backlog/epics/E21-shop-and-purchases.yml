  - key: S21.05.02
    title: Provide purchase support diagnostics without leaking payment data
    wave: 4
    size: s
    platforms: [android, ios]
    persona: team
    concerns: [privacy, security]
    userStory:
      asA: support-minded developer
      iWant: users to export purchase diagnostics safely
