      then: the last known entitlement state remains visible and a retryable error is shown
    - id: AC3
      given: the Profile tab is open
      when: the user navigates to commerce settings
      then: Restore purchases is reachable within two taps
    - id: AC4
      given: store services are unavailable
      when: the shop status screen opens
      then: it shows Unavailable, keeps Restore purchases visible and does not hide free features
    implementation:
      notes: >-
        Build ShopSettingsPage using dx:DXCollectionView for status, actions and history rows. Use dx:TabView only if purchase
        history and entitlement status need separate tabs after real content exists. Keep payment instrument details out entirely
        because Plugin.InAppBilling and the stores should own payment data. Keep the class in src/Forge.App/Features/Shop
