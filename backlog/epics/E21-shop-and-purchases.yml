      then: validation fails with a store-blocker error
    - id: AC2
      given: v1 catalogue configuration is inspected
      when: enabled products are listed
      then: no subscription product is enabled
    - id: AC3
      given: a future subscription product is enabled with all required disclosure metadata
      when: the paywall renders
      then: renewal, period, price, trial terms and cancellation instructions are visible before purchase
    - id: AC4
      given: a subscription SKU is enabled in configuration
      when: preflight validation runs
      then: the build fails unless price, renewal period, cancellation link and restore copy are present
