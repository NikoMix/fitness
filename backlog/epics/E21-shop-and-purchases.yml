    wave: 4
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [store-blocker]
    userStory:
      asA: release owner
      iWant: subscription compliance gates even though v1 recommends one-off purchase
      soThat: a future subscription cannot be enabled without required disclosures and management links
    requirements:
    - If any subscription product is enabled, the paywall must show billing period, renewal behaviour, price, free trial
      terms if present and cancellation instructions before purchase.
    - If any subscription product is enabled, the shop must show Manage subscription links for iOS and Android.
    - v1 configuration keeps subscription products disabled unless a separate approved decision changes the model.
