key: E21
title: Shop, In-App Purchases and Entitlements
domain: commerce
wave: 4
summary: >-
  Forge monetises with an honest local-only commerce model: a one-off Forge Pro unlock for durable
  premium features, with subscription infrastructure documented but not used unless Forge later
  adds ongoing server-backed value. The epic covers catalogue, paywall, purchases, restore,
  entitlements, offers, family sharing, cancellation links, localized prices, refunds, pending
  purchases and store-compliance disclosure.
problem: >-
  Users will pay only if value is clear and the purchase is trustworthy. Because Forge has no
  backend, it cannot perform server-side receipt validation or justify a subscription through cloud
  services in v1. The app must be transparent, keep the core training loop useful for free, and
  satisfy Apple and Google commerce rules that commonly block review.
outcome: >-
  Android and iOS users can buy or restore Forge Pro through platform billing, see localized prices
  and honest disclosures, retain access after reinstall through store restore, and understand the
  local-only entitlement trade-off without losing access to the core fitness loop.
successMetrics:
- 100% of purchase, restore and entitlement stories pass store-compliance review before release candidate submission.
- Purchase flow returns a final user-visible state for success, cancellation, pending, declined and refund cases.
- Restore purchases completes in under 10 seconds on a normal store sandbox connection.
- Free users can complete onboarding, create a plan, log workouts and log core nutrition without a blocking paywall.
nonGoals:
- No server-side receipt validation, account system or cross-device Forge account entitlement sync in v1.
- No consumable coins, loot boxes, paid streak freezes or random rewards.
- No external payment links or web checkout for digital features.
risks:
- risk: A subscription is added without enough recurring value, causing poor trust and avoidable App Review scrutiny.
  mitigation: Recommend a one-off Forge Pro unlock for v1 and gate any subscription SKU behind explicit future recurring
    value and disclosure checks.
  severity: high
- risk: Local entitlement storage can be tampered with on compromised devices.
  mitigation: Store entitlements in secure storage plus signed local records, explain the limitation, and avoid
    promising server-grade enforcement.
  severity: medium
- risk: Missing restore purchases, cancellation links or subscription disclosures causes App Store rejection.
  mitigation: Mark these stories as store-blockers and include automated and manual review checks before submission.
  severity: critical
dependsOn: [E01, E10, E14, E18]
grounding:
- title: Plugin.InAppBilling repository
  url: https://github.com/jamesmontemagno/InAppBillingPlugin
  note: Billing plugin selected by the architecture for Google Play Billing and StoreKit.
- title: Apple App Review Guideline 3.1.1 In-App Purchase
  url: https://developer.apple.com/app-store/review/guidelines/#in-app-purchase
  note: Requires digital features to use in-app purchase and includes restore expectations.
- title: Google Play Billing integration
  url: https://developer.android.com/google/play/billing/integrate
  note: Defines product query, purchase, acknowledgement and pending purchase handling.
- title: Apple auto-renewable subscription guidance
  url: https://developer.apple.com/app-store/subscriptions/
  note: Subscription disclosure and management expectations if subscription products are ever enabled.
- title: Google Play subscriptions policy
  url: https://support.google.com/googleplay/android-developer/answer/140504
  note: Disclosure, cancellation and subscription management policy for Play.

features:
- key: F21.01
  title: Define an honest Forge Pro monetisation model
  wave: 4
  summary: >-
    Establish a product catalogue and value presentation that fits a local-only app and avoids
    overclaiming recurring subscription value.
  outcome: >-
    Forge ships with a one-off Pro unlock recommendation, clear free-versus-paid boundaries and no hard-coded prices.
  stories:
  - key: S21.01.01
    title: Adopt a one-off Forge Pro unlock for v1 monetisation
    wave: 4
    size: s
    platforms: [android, ios]
    persona: team
    concerns: [store-blocker]
    userStory:
      asA: product owner
      iWant: a monetisation model that matches Forge's local-only value
      soThat: users are charged fairly and store review has a coherent explanation
    requirements:
    - The v1 catalogue contains one non-consumable Forge Pro unlock product per platform.
    - The product decision record states that subscriptions are not enabled in v1 because there is no backend, cloud
      sync or ongoing service cost.
    - The product decision record lists future conditions required before a subscription SKU may be enabled.
    - No consumable currency, random reward or paid streak-protection product exists.
    acceptanceCriteria:
    - id: AC1
      given: the commerce catalogue is inspected
      when: v1 products are listed
      then: exactly one non-consumable Forge Pro unlock is enabled per platform and no subscription SKU is enabled
    - id: AC2
      given: the monetisation decision record is opened
      when: the rationale is read
      then: it explicitly states that local-only v1 has weak recurring-value justification for a subscription
    - id: AC3
      given: the catalogue is searched
      when: product types are examined
      then: no consumable, loot box, paid freeze or artificial scarcity product exists
    - id: AC4
      given: Forge Pro is not purchased
      when: the user completes onboarding and logs a workout
      then: the workout, food and hydration core loop remains usable without payment
    implementation:
      notes: >-
        Add a versioned CommerceCatalogue definition in Forge.Domain and a short ADR under docs/adr capturing the one-off
        Forge Pro decision. The app should keep interfaces general enough for future subscription products, but v1 configuration
        must not expose or sell them. This aligns local-only architecture with user trust. Keep the class in src/Forge.App/Features/Shop
        with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView or DXPopup for the paywall,
        and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend trade-off: store ownership
        is queried locally, prices come from store metadata, and local receipts cannot prove server-grade validity. A careless
        implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Domain/Commerce/CommerceCatalogue.cs
      - docs/adr/ADR-0021-forge-pro-monetisation.md
      - src/Forge.App/Features/Shop/CommerceFeatureRegistration.cs
      apis:
      - Plugin.InAppBilling 10.0.0
      devexpress:
      - DXCollectionView
    testing:
    - Unit test asserting v1 catalogue exposes only the non-consumable Forge Pro product.
    - Review checklist item verifying no subscription SKU is enabled in store configuration for v1.

    grounding:
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
  - key: S21.01.02
    title: Present a paywall that explains value honestly
    wave: 4
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker]
    userStory:
      asA: Maya, considering Forge Pro
      iWant: to understand exactly what I get and what stays free
      soThat: I can decide without pressure or hidden terms
    requirements:
    - The paywall presents Forge Pro benefits, free features and one-off purchase nature in the first visible screen.
    - Price is displayed only from platform product metadata and never hard-coded.
    - The paywall includes Restore purchases and Terms and Privacy links.
    - The dismiss action is visible without scrolling.
    - The paywall avoids countdowns, fake scarcity and guilt-inducing copy.
    acceptanceCriteria:
    - id: AC1
      given: store product metadata returns a localized price of 4,99 €
      when: the paywall renders
      then: the displayed price is 4,99 € and no hard-coded fallback price is visible
    - id: AC2
      given: the paywall is displayed on a 6-inch phone
      when: the first viewport is inspected
      then: the one-off nature, Restore purchases and dismiss action are visible
    - id: AC3
      given: paywall copy resources are scanned
      when: countdown, last chance or fake scarcity terms are present
      then: the copy test fails
    - id: AC4
      given: store metadata cannot be loaded within 5 seconds
      when: the paywall opens
      then: purchase buttons are disabled and the UI explains that pricing is temporarily unavailable
    implementation:
      notes: >-
        Implement PaywallBottomSheet in Forge.App/Features/Shop using dx:BottomSheet over a ViewModel supplied by CommerceProductQuery.
        Product metadata must come from Plugin.InAppBilling localized price fields, with loading and unavailable states if
        the store cannot return products. Do not embed a price in production XAML or resources. Keep the class in src/Forge.App/Features/Shop
        with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView or DXPopup for the paywall,
        and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend trade-off: store ownership
        is queried locally, prices come from store metadata, and local receipts cannot prove server-grade validity. A careless
        implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.App/Features/Shop/PaywallBottomSheet.xaml
      - src/Forge.App/Features/Shop/PaywallViewModel.cs
      - src/Forge.Core/Commerce/CommerceProductQuery.cs
      - src/Forge.App/Resources/Strings/Commerce.resx
      devexpress:
      - dx:BottomSheet
      - dx:DXCollectionView
      apis:
      - Plugin.InAppBilling 10.0.0
    testing:
    - Unit test that price display uses mocked store metadata.
    - UI test that restore, dismiss and one-off disclosure are visible in the first viewport.

    grounding:
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
  - key: S21.01.03
    title: Gate paid features while preserving the free core loop
    wave: 4
    size: m
    platforms: [android, ios]
    persona: returner
    userStory:
      asA: Sam, using Forge for free
      iWant: the core training loop to remain usable
      soThat: I can trust the product before upgrading
    requirements:
    - Free users can complete onboarding, create at least one training plan, log workouts, log hydration and log core
      nutrition.
    - Paid gates may apply to advanced analytics, expanded historical insights, premium templates and cosmetic
      achievement card themes.
    - A paid gate never appears after the user starts an active workout set logging flow.
    - Every gate explains the free alternative and opens the paywall only after a user action.
    acceptanceCriteria:
    - id: AC1
      given: a free user with no entitlement
      when: they complete onboarding, create a plan and log a workout
      then: no blocking paywall prevents the flow
    - id: AC2
      given: a free user opens a premium template
      when: the gate appears
      then: the gate explains the free template alternative and includes Not now
    - id: AC3
      given: an active workout logging screen is open
      when: entitlement checks refresh
      then: no paywall overlays the set logging controls
    - id: AC4
      given: a paid feature is tapped by a free user
      when: the gate appears
      then: it offers Dismiss and Restore purchases and does not block returning to the free workflow
    implementation:
      notes: >-
        Add EntitlementGateService in Forge.Core that returns capability decisions with reason codes. Feature ViewModels
        should ask for capabilities before rendering premium actions, but active workout execution must treat gates as non-blocking.
        Use dx:DXPopup for small explanatory gates and dx:BottomSheet only when the user chooses the paywall. Keep the class
        in src/Forge.App/Features/Shop with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView
        or DXPopup for the paywall, and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend
        trade-off: store ownership is queried locally, prices come from store metadata, and local receipts cannot prove server-grade
        validity. A careless implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Core/Commerce/EntitlementGateService.cs
      - src/Forge.Domain/Commerce/ForgeCapability.cs
      - src/Forge.App/Features/Shop/EntitlementGatePopup.xaml
      devexpress:
      - dx:DXPopup
      - dx:BottomSheet
      apis:
      - Plugin.InAppBilling 10.0.0
    testing:
    - End-to-end UI test for free onboarding through workout logging.
    - Unit tests for each gated capability decision.

    grounding:
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
- key: F21.02
  title: Implement platform purchase and restore flows
  wave: 4
  summary: >-
    Use Plugin.InAppBilling to query products, buy Forge Pro, acknowledge purchases and restore
    entitlements across reinstall.
  outcome: >-
    Purchase and restore flows are reliable, user-visible and compliant on Android and iOS.
  concerns: [store-blocker]
  stories:
  - key: S21.02.01
    title: Query store products and display localized pricing
    wave: 4
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker, i18n]
    userStory:
      asA: Maya, viewing the shop
      iWant: prices in my store currency and language
      soThat: I know the real cost before buying
    requirements:
    - Product metadata is queried from Google Play Billing or StoreKit through Plugin.InAppBilling before showing a
      purchasable paywall.
    - Price, currency and trial or offer text use platform-localized product metadata.
    - If products cannot be loaded within 10 seconds, the paywall shows a retry state and disables purchase buttons.
    - No production YAML, XAML, C# resource or test fixture contains a hard-coded real price.
    acceptanceCriteria:
    - id: AC1
      given: the store returns product metadata with localized price £6.99
      when: the shop renders
      then: the displayed price is £6.99 from metadata
    - id: AC2
      given: product metadata fails to load for 10 seconds
      when: the paywall timeout elapses
      then: the purchase button is disabled and a retry action is visible
    - id: AC3
      given: production source files are scanned
      when: real currency price patterns are found outside mocks
      then: the validation test fails
    - id: AC4
      given: localized price metadata is missing from both stores
      when: the shop renders product details
      then: no hard-coded price is displayed and purchase is disabled until metadata loads
    implementation:
      notes: >-
        Implement BillingProductService in Forge.Infrastructure over Plugin.InAppBilling and return a ProductDisplayInfo DTO
        to Forge.Core. The paywall ViewModel should have Loading, Available and Unavailable states. Keep mocked localized
        prices only in tests so production cannot ship stale pricing that differs from the user's store. Keep the class in
        src/Forge.App/Features/Shop with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView
        or DXPopup for the paywall, and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend
        trade-off: store ownership is queried locally, prices come from store metadata, and local receipts cannot prove server-grade
        validity. A careless implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Infrastructure/Billing/BillingProductService.cs
      - src/Forge.Core/Commerce/ProductDisplayInfo.cs
      - tests/Forge.Core.Tests/Commerce/PriceDisplayTests.cs
      apis:
      - Plugin.InAppBilling 10.0.0
      devexpress:
      - DXCollectionView
    testing:
    - Unit tests for loading, available and unavailable paywall states.
    - Static test rejecting hard-coded production prices.

    grounding:
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
  - key: S21.02.02
    title: Complete Forge Pro purchase with acknowledgement and receipt capture
    wave: 4
    size: l
    platforms: [android, ios]
    persona: enthusiast
    concerns: [store-blocker]
    userStory:
      asA: Alex, buying Forge Pro
      iWant: the purchase to unlock features reliably
      soThat: I can use premium capabilities immediately after payment succeeds
    requirements:
    - Purchase flow uses Plugin.InAppBilling 10.0.0 for Google Play Billing and StoreKit.
    - Successful Google Play purchases are acknowledged according to Play Billing requirements.
    - Successful purchases store product id, transaction id where available, purchase time and platform in local
      entitlement records.
    - The UI shows success, user-cancelled and store-unavailable states distinctly.
    - Entitlement refresh completes within 2 seconds after a successful purchase callback.
    acceptanceCriteria:
    - id: AC1
      given: the store returns a successful Forge Pro purchase
      when: the purchase callback is processed
      then: the local entitlement is active within 2 seconds
    - id: AC2
      given: Google Play returns an unacknowledged successful purchase
      when: purchase processing completes
      then: the purchase is acknowledged and the acknowledgement result is logged locally
    - id: AC3
      given: the user cancels the purchase sheet
      when: control returns to Forge
      then: no entitlement is granted and the UI shows Purchase cancelled rather than an error
    - id: AC4
      given: a Google Play purchase succeeds
      when: Forge grants Pro access
      then: the purchase is acknowledged within 3 seconds after local entitlement persistence succeeds
    implementation:
      notes: >-
        Create PurchaseForgeProUseCase in Forge.Core and BillingPurchaseService in Forge.Infrastructure. The infrastructure
        service owns Plugin.InAppBilling calls and maps plugin responses to application result types. Grant entitlements only
        after the platform reports a purchased state and acknowledgement succeeds where required. Keep the class in src/Forge.App/Features/Shop
        with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView or DXPopup for the paywall,
        and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend trade-off: store ownership
        is queried locally, prices come from store metadata, and local receipts cannot prove server-grade validity. A careless
        implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Core/Commerce/PurchaseForgeProUseCase.cs
      - src/Forge.Infrastructure/Billing/BillingPurchaseService.cs
      - src/Forge.App/Features/Shop/PurchaseStatusPopup.xaml
      devexpress:
      - dx:DXPopup
      apis:
      - Plugin.InAppBilling 10.0.0
      - Google Play Billing acknowledgePurchase
      - StoreKit
    testing:
    - Unit tests for success, cancellation and unavailable purchase results.
    - Sandbox purchase test on Google Play internal testing and Apple StoreKit testing.

    grounding:
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
  - key: S21.02.03
    title: Restore purchases from the platform store
    wave: 4
    size: l
    platforms: [android, ios]
    persona: returner
    concerns: [store-blocker]
    userStory:
      asA: Sam, reinstalling Forge
      iWant: to restore my Forge Pro purchase
      soThat: I do not pay twice for the same non-consumable unlock
    requirements:
    - Restore purchases is visible from the paywall and shop settings without requiring a successful product load.
    - Restore queries owned non-consumable purchases from the platform store through Plugin.InAppBilling.
    - A restored Forge Pro purchase recreates local entitlement records after reinstall.
    - Restore success, no purchases found, store unavailable and user authentication required states are displayed
      distinctly.
    - Restore completes or times out with a retryable result within 10 seconds.
    acceptanceCriteria:
    - id: AC1
      given: Forge is reinstalled and the store account owns Forge Pro
      when: the user taps Restore purchases
      then: Forge Pro entitlement is active locally within 10 seconds
    - id: AC2
      given: the store account owns no Forge products
      when: restore completes
      then: the UI shows No purchases found and no entitlement is granted
    - id: AC3
      given: product metadata fails to load
      when: the paywall is shown
      then: Restore purchases remains visible and tappable
    - id: AC4
      given: an Apple reviewer opens the paywall
      when: they inspect purchase options
      then: Restore purchases is visible in the first viewport and can be activated without buying again
    implementation:
      notes: >-
        Implement RestorePurchasesUseCase separately from purchase so App Review can find and test it without buying. The
        restore path should call the billing service owned-purchases query, filter for Forge Pro and write the same entitlement
        projection as purchase success. Keep restore buttons in both PaywallBottomSheet and ShopSettingsPage. Keep the class
        in src/Forge.App/Features/Shop with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView
        or DXPopup for the paywall, and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend
        trade-off: store ownership is queried locally, prices come from store metadata, and local receipts cannot prove server-grade
        validity. A careless implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Core/Commerce/RestorePurchasesUseCase.cs
      - src/Forge.Infrastructure/Billing/BillingRestoreService.cs
      - src/Forge.App/Features/Shop/ShopSettingsPage.xaml
      - src/Forge.App/Features/Shop/PaywallBottomSheet.xaml
      devexpress:
      - dx:BottomSheet
      - dx:DXCollectionView
      apis:
      - Plugin.InAppBilling 10.0.0
    testing:
    - Store sandbox restore test after uninstall and reinstall on Android and iOS.
    - Unit tests for owned, none, unavailable and timeout restore results.

    grounding:
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
  - key: S21.02.04
    title: Handle pending purchases, declines, refunds and revocations
    wave: 4
    size: l
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker]
    userStory:
      asA: Maya, whose payment may not complete immediately
      iWant: Forge to explain purchase edge cases clearly
      soThat: I know whether I have access and what to do next
    requirements:
    - Pending purchases are shown as Pending and do not grant Forge Pro until the store reports purchased.
    - Payment declined and store error results show retry guidance without granting entitlement.
    - Refund or revocation detected during entitlement refresh removes local Forge Pro access and explains why.
    - Purchase state refresh runs on app start and when the shop opens.
    - Edge-case messages avoid blaming the user.
    acceptanceCriteria:
    - id: AC1
      given: Google Play returns a pending purchase
      when: purchase processing completes
      then: entitlement remains inactive and the shop shows Pending payment
    - id: AC2
      given: a previously owned product is no longer returned by the store during refresh
      when: entitlement refresh completes
      then: Forge Pro access is removed and a local message explains that the store no longer reports the purchase
    - id: AC3
      given: payment is declined
      when: control returns to Forge
      then: no entitlement is granted and the UI offers Retry without hostile copy
    - id: AC4
      given: a purchase enters Pending or Deferred state
      when: the user returns to the shop
      then: Forge shows Pending and does not grant Pro until the store reports ownership
    implementation:
      notes: >-
        Add EntitlementRefreshService that queries current store ownership and reconciles it with local entitlements. Pending
        purchases should be stored as PurchaseAttempt records, not active entitlements. Because the app is local-only, refund
        detection depends on the next store refresh rather than server notifications, and the UI must be honest. Keep the
        class in src/Forge.App/Features/Shop with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView
        or DXPopup for the paywall, and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend
        trade-off: store ownership is queried locally, prices come from store metadata, and local receipts cannot prove server-grade
        validity. A careless implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Core/Commerce/EntitlementRefreshService.cs
      - src/Forge.Domain/Commerce/PurchaseAttempt.cs
      - src/Forge.Infrastructure/Billing/BillingOwnershipService.cs
      apis:
      - Plugin.InAppBilling 10.0.0
      - Google Play Billing pending transactions
      - StoreKit transaction updates
      devexpress:
      - DXCollectionView
    testing:
    - Unit tests for pending, declined, refunded and revoked transitions.
    - Sandbox matrix for interrupted purchase and declined test payment methods where available.

    grounding:
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
- key: F21.03
  title: Store local entitlements with explicit tamper limits
  wave: 4
  summary: >-
    Persist Forge Pro access locally using secure storage and signed records while clearly
    documenting that server-grade validation is impossible in v1.
  outcome: >-
    Entitlements survive normal app restarts and restores, resist casual tampering and never
    overstate their security guarantees.
  concerns: [security, privacy]
  stories:
  - key: S21.03.01
    title: Persist Forge Pro entitlement locally with tamper resistance
    wave: 4
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [security]
    userStory:
      asA: developer maintaining commerce
      iWant: local entitlement storage with basic tamper resistance
      soThat: casual file edits do not trivially unlock paid features
    requirements:
    - Active entitlement records are stored in SQLCipher-backed SQLite and mirrored with a secure-storage key marker.
    - Entitlement records include product id, platform, purchase or restore source, granted time and last verified time.
    - A keyed local signature or MAC detects modified entitlement rows when the secure key is intact.
    - If tampering is detected, paid capabilities are disabled and restore is offered.
    - The implementation does not claim to prevent tampering on rooted or jailbroken devices.
    acceptanceCriteria:
    - id: AC1
      given: an entitlement row is modified outside Forge
      when: entitlement validation runs with the original secure key
      then: validation fails and paid capabilities are disabled
    - id: AC2
      given: the app is restarted normally after purchase
      when: entitlement validation runs
      then: Forge Pro remains active
    - id: AC3
      given: tampering is detected
      when: the shop opens
      then: Restore purchases is offered and no accusatory copy is shown
    - id: AC4
      given: local entitlement data is edited outside Forge
      when: the app starts
      then: tamper detection marks the entitlement Unverified and prompts Restore purchases rather than silently
        granting Pro
    implementation:
      notes: >-
        Store EntitlementEntity in the encrypted SQLite database and keep the signing key in platform secure storage using
        the same secure-storage posture as the SQLCipher key. Use HMAC over stable entitlement fields to catch casual DB edits.
        This is deliberately not DRM and cannot stop a compromised device. Keep the class in src/Forge.App/Features/Shop with
        Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView or DXPopup for the paywall,
        and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend trade-off: store ownership
        is queried locally, prices come from store metadata, and local receipts cannot prove server-grade validity. A careless
        implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Domain/Commerce/Entitlement.cs
      - src/Forge.Infrastructure/Billing/LocalEntitlementStore.cs
      - src/Forge.Infrastructure/Persistence/EntitlementEntity.cs
      apis:
      - Microsoft.Maui.Storage.SecureStorage
      - System.Security.Cryptography.HMACSHA256
      - SQLCipher
      devexpress:
      - DXCollectionView
    testing:
    - Unit test detecting modified entitlement data.
    - Integration test for entitlement surviving app restart.

