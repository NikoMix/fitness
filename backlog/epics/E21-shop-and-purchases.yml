        Keep the class in src/Forge.App/Features/Shop with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress
        DXCollectionView or DXPopup for the paywall, and SecureStorage for the local entitlement marker. The tricky part is
        accepting the no-backend trade-off: store ownership is queried locally, prices come from store metadata, and local
        receipts cannot prove server-grade validity. A careless implementation would hard-code prices, omit restore, or promise
        tamper-proof access.
      touches:
      - src/Forge.Core/Commerce/SubscriptionComplianceValidator.cs
      - src/Forge.App/Features/Shop/ShopSettingsPage.xaml
      - tests/Forge.Core.Tests/Commerce/SubscriptionComplianceTests.cs
      devexpress:
      - dx:DXCollectionView
      apis:
      - Plugin.InAppBilling 10.0.0
      - StoreKit subscription management
      - Google Play subscription center
    testing:
    - Unit tests for subscription SKU enabled without disclosures.
    - Manual review checklist for Apple and Google subscription disclosure if ever enabled.

    grounding:
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
