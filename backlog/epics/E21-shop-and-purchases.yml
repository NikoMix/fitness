- key: F21.04
  title: Support offers, family sharing and subscription compliance gates
  wave: 4
  summary: >-
    Handle platform offer metadata and sharing semantics honestly, and keep subscription
    compliance surfaces ready before any future recurring SKU is enabled.
  outcome: >-
    Promotional pricing and sharing are shown only when the platform reports them, and subscription
    disclosures cannot be bypassed if a subscription is introduced later.
  concerns: [store-blocker]
  stories:
  - key: S21.04.01
    title: Display introductory and promotional offers from store metadata
    wave: 4
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker]
    userStory:
      asA: Maya, seeing a launch offer
      iWant: offer terms shown exactly as the store provides them
      soThat: I understand whether the price is temporary and what happens next
    requirements:
    - Offer text is displayed only when platform product metadata includes an eligible introductory or promotional
      offer.
    - Offer eligibility is not inferred locally from install date or arbitrary timers.
    - Offer copy includes duration, price and post-offer price where platform metadata provides those fields.
    - If no offer metadata is returned, the paywall shows no offer badge.
    - Offers must not use fake countdowns or claim scarcity not provided by the store.
    acceptanceCriteria:
    - id: AC1
      given: store metadata includes an introductory offer
      when: the paywall renders
      then: the offer duration and localized offer price are displayed from metadata
    - id: AC2
      given: store metadata contains no offer
      when: the paywall renders
      then: no introductory offer or promotional badge is visible
    - id: AC3
      given: paywall resources include a fake countdown phrase
      when: commerce copy validation runs
      then: the test fails
    - id: AC4
      given: the store reports no introductory offer
      when: the paywall opens
      then: no introductory banner, countdown or fabricated discount is shown
    implementation:
      notes: >-
        Extend ProductDisplayInfo with optional OfferDisplayInfo populated only by the billing infrastructure adapter. The
        paywall uses dx:BottomSheet sections to show offer terms near the purchase button, but must hide the whole section
        when metadata is absent. This keeps Forge from manufacturing urgency and keeps price truth with the store. Keep the
        class in src/Forge.App/Features/Shop with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView
        or DXPopup for the paywall, and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend
        trade-off: store ownership is queried locally, prices come from store metadata, and local receipts cannot prove server-grade
        validity. A careless implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Core/Commerce/OfferDisplayInfo.cs
      - src/Forge.Infrastructure/Billing/BillingProductService.cs
      - src/Forge.App/Features/Shop/PaywallBottomSheet.xaml
      devexpress:
      - dx:BottomSheet
      apis:
      - Plugin.InAppBilling 10.0.0
      - StoreKit promotional offers
      - Google Play Billing ProductDetails
    testing:
    - Unit tests for offer present and offer absent product metadata.
    - Copy validation for fake scarcity and countdown terms.

    grounding:
    - title: Google Play Billing integration guide
      url: https://developer.android.com/google/play/billing/integrate
      note: Defines product queries, purchase flow, acknowledgement, pending purchases and entitlement updates for
        Android.
    - title: Apple App Review Guidelines
      url: https://developer.apple.com/app-store/review/guidelines/
      note: Includes in-app purchase review requirements, including restore purchase expectations for non-consumables.
  - key: S21.04.02
    title: Respect platform family sharing ownership
    wave: 4
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [store-blocker]
    userStory:
      asA: Sam, using a family purchase where the store supports it
      iWant: Forge to respect store-reported ownership
      soThat: access matches my platform account rights
    requirements:
    - Forge grants access for family-shared ownership only when the platform reports the Forge Pro product as owned.
    - The app does not ask users to identify family members or collect family account data.
    - Product and restore copy states that sharing availability is controlled by the App Store or Google Play account.
    - If the store does not report ownership, Forge does not grant access based on local claims.
    acceptanceCriteria:
    - id: AC1
      given: the platform store reports Forge Pro as owned through family sharing
      when: entitlement refresh runs
      then: Forge Pro access is granted locally with source StoreOwnership
    - id: AC2
      given: a user says a family member purchased Forge Pro but the store reports no ownership
      when: restore completes
      then: no entitlement is granted and the UI directs the user to platform account settings
    - id: AC3
      given: restore copy is inspected
      when: family sharing is mentioned
      then: the copy says availability is controlled by the platform store
    - id: AC4
      given: family sharing ownership is not reported by the platform store
      when: entitlements are evaluated
      then: Forge does not claim family access and shows normal restore guidance
    implementation:
      notes: >-
        Treat family sharing as a store ownership source, not a separate Forge concept. The billing adapter should not distinguish
        family members unless the platform exposes a safe ownership state, and Forge should never collect Apple ID, Google
        account or family data. Render explanatory copy in ShopSettingsPage with dx:DXCollectionView settings rows. Keep the
        class in src/Forge.App/Features/Shop with Plugin.InAppBilling wrapped by Forge.Core services, DevExpress DXCollectionView
        or DXPopup for the paywall, and SecureStorage for the local entitlement marker. The tricky part is accepting the no-backend
        trade-off: store ownership is queried locally, prices come from store metadata, and local receipts cannot prove server-grade
        validity. A careless implementation would hard-code prices, omit restore, or promise tamper-proof access.
      touches:
      - src/Forge.Core/Commerce/EntitlementRefreshService.cs
      - src/Forge.Domain/Commerce/EntitlementSource.cs
      - src/Forge.App/Features/Shop/ShopSettingsPage.xaml
      devexpress:
      - dx:DXCollectionView
      apis:
      - Plugin.InAppBilling 10.0.0
    testing:
    - Unit tests mapping store-owned family purchase to entitlement source.
    - Copy review test for platform-controlled sharing wording.

    grounding:
