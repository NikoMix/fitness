        not only English. Keep ownership in Forge.App/docs/legal with product-claims-checklist and route user-visible
        copy through shared LegalLinks or resource strings. Use DevExpress DXCollectionView for the review surface
        and Microsoft.Maui.Storage.Preferences only through abstractions so tests can prove offline behavior. The
        tricky part is matching local-only reality to store and GDPR evidence. A careless implementation would leave
        keys, caches, preferences or exported temp files behind, or assert a legal conclusion without counsel review.
      touches:
