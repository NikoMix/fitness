- key: F25.04
  title: Record explicit, granular and revocable health consent
  wave: 2
  summary: >-
    Treat health data as special-category data by requiring explicit consent for each health
    data type, making revocation easy, and keeping local processing records for review.
  outcome: >-
    Forge only reads or uses health data after explicit consent and can show exactly what was
    consented, when, and for what purpose.
  concerns: [store-blocker, privacy]
  stories:
  - key: S25.04.01
    title: Capture granular explicit consent for health data types
    wave: 2
    size: l
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker, privacy]
    userStory:
      asA: new Forge user connecting health data
      iWant: to choose exactly which health data types Forge can use
      soThat: I can consent to steps without also consenting to sleep, heart rate or body metrics
    requirements:
    - Consent is requested per health data type and purpose before any platform permission request is shown.
    - Consent copy uses an explicit action such as a checked toggle and a Continue button, not silence or
      pre-ticked boxes.
    - The consent record stores data type, purpose, policy version, timestamp and platform locally.
    - Declining one data type does not block unrelated manual entry or other consented types.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: a new user opens health connection
      when: they consent to steps only
      then: Forge requests only the corresponding platform permission and does not read sleep, heart rate or
        body metrics
    - id: AC2
      given: no health consent exists
      when: a service attempts to read health data
      then: the call fails with ConsentRequired and no platform API read is attempted
    - id: AC3
      given: consent records are inspected in SQLite
      when: a granted consent is found
      then: it includes data type, purpose, policy version, timestamp and platform
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Put consent models in Forge.Domain and the gating service in Forge.Core so the platform implementations
        in Forge.Health cannot bypass them. The app consent page can use DXCollectionView with one row per data
        type and clear purpose text. Request HealthKit or Health Connect permissions only after the local explicit
        consent record is written successfully. Keep ownership in Forge.Domain/src/Forge.Domain/Privacy with HealthConsent
        and route user-visible copy through shared LegalLinks or resource strings. Use DevExpress DXCollectionView
        for the review surface and HealthKit only through abstractions so tests can prove offline behavior. The
        tricky part is matching local-only reality to store and GDPR evidence. A careless implementation would leave
        keys, caches, preferences or exported temp files behind, or assert a legal conclusion without counsel review.
      touches:
      - src/Forge.Domain/Privacy/HealthConsent.cs
      - src/Forge.Core/Health/IHealthConsentService.cs
      - src/Forge.App/Features/Health/HealthConsentPage.xaml
      devexpress:
      - DXCollectionView
      - DXButton
      apis:
      - HealthKit
      - androidx.health.connect
    testing:
    - Unit tests verify unconsented data types cannot be read through IHealthDataService.
    - UI tests verify toggles are off by default and independent per data type.
    grounding:
    - title: GDPR Article 9 special categories of personal data
      url: https://gdpr-info.eu/art-9-gdpr/
      note: Explicit consent is one possible condition for processing health data.

    - title: App Store Review Guideline 5.1.3 Health and Health Research
      url: https://developer.apple.com/app-store/review/guidelines/#health-and-health-research
      note: Requires health data not be used for advertising and supports conservative health-data handling.
  - key: S25.04.02
    title: Let users revoke consent without deleting unrelated data
    wave: 2
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [store-blocker, privacy]
    userStory:
      asA: user who changes my mind about health sync
      iWant: to revoke one consent at a time
      soThat: I can keep using Forge manually without deleting my account
    requirements:
    - Each health data consent can be revoked independently from Privacy settings.
    - Revocation stops future reads immediately and removes queued health-import work for that data type.
    - Existing imported values are either deleted or retained according to the choice shown to the user at
      revocation.
    - The revocation screen links to OS settings for platform permission management.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: steps and sleep are consented
      when: the user revokes sleep only
      then: sleep reads stop immediately while steps reads continue if their consent remains active
    - id: AC2
      given: imported sleep data exists
      when: the user chooses revoke and delete imported sleep data
      then: imported sleep records are removed and manually entered records are preserved
    - id: AC3
      given: a background import is queued for a revoked data type
      when: revocation completes
      then: that queued work is cancelled before another platform read occurs
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Implement revocation as a domain operation with explicit consequences rather than a UI-only toggle. The
        infrastructure importer should check consent immediately before each read, not only when the job is scheduled,
        because revocation can happen while work is queued. Link to platform settings through Launcher.OpenAsync
        or platform APIs where available, but do not rely on OS revocation as the app's only consent state.
      touches:
      - src/Forge.Core/Health/HealthConsentService.cs
      - src/Forge.Infrastructure/Health/HealthImportQueue.cs
      - src/Forge.App/Features/Settings/PrivacySettingsPage.xaml
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.ApplicationModel.Launcher
    testing:
    - Unit test verifies queued imports re-check consent before reading.
    - Integration test verifies revoke-and-delete removes only imported data for the selected type.

    grounding:
    - title: GDPR Article 9 special categories of personal data
      url: https://gdpr-info.eu/art-9-gdpr/
      note: Health and fitness data can be special-category data requiring explicit handling and review.
  - key: S25.04.03
    title: Maintain local records of processing and lawful basis
    wave: 2
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [privacy]
    userStory:
      asA: compliance reviewer
      iWant: a local record of data categories, purposes and lawful basis
      soThat: Forge can explain what it processes without inventing answers during review
    requirements:
    - Data inventory records purpose, lawful basis, retention, storage location and sharing status for each
      personal-data category.
    - Health-data categories are explicitly marked as Article 9 special-category data.
    - The app exposes a human-readable Privacy Summary generated from the inventory.
    - Legal-review status is recorded for each inventory version.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: the data inventory is parsed
      when: any health-data category lacks an Article 9 marker or explicit-consent basis
      then: the validation check fails
    - id: AC2
      given: a user opens Privacy Summary in app
      when: the summary renders
      then: it lists local storage, no Forge backend in v1 and each enabled health data purpose
    - id: AC3
      given: an inventory entry changes
      when: the release checklist is generated
      then: legal-review status for the new inventory version is marked pending until reviewed
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Use docs/legal/data-inventory.yml as the source of truth and generate a compact JSON resource for the in-app
        Privacy Summary. This avoids divergence between store forms, policy copy and app settings. Keep legal-review
        status as metadata in the inventory, with an open question for counsel when a feature's lawful basis is
        uncertain. Keep ownership in Forge.App/docs/legal with data-inventory and route user-visible copy through
        shared LegalLinks or resource strings. Use DevExpress DXCollectionView for the review surface and Microsoft.Maui.Storage.Preferences
        only through abstractions so tests can prove offline behavior. The tricky part is matching local-only reality
        to store and GDPR evidence. A careless implementation would leave keys, caches, preferences or exported
        temp files behind, or assert a legal conclusion without counsel review.
      touches:
      - docs/legal/data-inventory.yml
      - src/Forge.App/Resources/Raw/privacy-summary.json
      - src/Forge.App/Features/Legal/PrivacySummaryPage.xaml
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Schema test validates required inventory fields for every personal-data category.
    - Snapshot test verifies the generated Privacy Summary mentions no backend in v1.
    grounding:
    - title: GDPR Article 30 records of processing activities
      url: https://gdpr-info.eu/art-30-gdpr/
      note: Useful structure for processing records, subject to counsel confirmation on applicability.
    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
    openQuestions:
    - Ask counsel whether Forge's scale and jurisdictions require a formal Article 30 record or a lighter
      internal inventory for v1.

- key: F25.05
  title: Gate age, regional obligations and medical-device risk
  wave: 2
  summary: >-
    Decide who Forge is for, where privacy rights are disclosed, and how product copy avoids
    accidental claims that turn a fitness app into a regulated medical product.
  outcome: >-
    Launch copy, onboarding and settings clearly exclude unsupported children, disclose major
    regional rights, and avoid diagnostic or treatment claims.
  concerns: [store-blocker, privacy]
  stories:
  - key: S25.05.01
    title: Add age gate and exclude unsupported children from v1
    wave: 2
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker, privacy]
    userStory:
      asA: release owner
      iWant: Forge to avoid collecting children's health data in v1
      soThat: launch does not require COPPA or GDPR-K child-consent operations we cannot support locally
    requirements:
    - Onboarding asks the user to confirm they are at least 16 before any health, nutrition or profile data
      entry.
    - Users who do not confirm age eligibility see a respectful unsupported message and cannot proceed into
      the app.
    - The privacy policy and store listings state the v1 age eligibility decision consistently.
    - The age-gate decision is stored only as local eligibility state and is erased by Delete my data.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: a new user does not confirm they are at least 16
      when: they continue onboarding
      then: Forge blocks account setup and shows an unsupported message with no health-data fields collected
    - id: AC2
      given: the privacy policy, onboarding copy and store listing draft are inspected
      when: age eligibility text is compared
      then: all three state the same minimum age decision
    - id: AC3
      given: the user completes data deletion
      when: local eligibility state is inspected
      then: the age-gate confirmation is removed with other preferences
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Implement the age gate as an onboarding prerequisite in Forge.App, backed by a small local setting. The
        product choice is to support 16+ only in v1 because local-only architecture cannot provide parent verification,
        child-specific data rights handling or school-use controls. Mark this for legal review because age thresholds
        differ by region and store category. Keep ownership in Forge.App/src/Forge.App/Features/Onboarding with
        AgeGatePage and route user-visible copy through shared LegalLinks or resource strings. Use DevExpress DXButton
        for the review surface and Microsoft.Maui.Storage.Preferences only through abstractions so tests can prove
        offline behavior. The tricky part is matching local-only reality to store and GDPR evidence. A careless
        implementation would leave keys, caches, preferences or exported temp files behind, or assert a legal conclusion
        without counsel review.
      touches:
      - src/Forge.App/Features/Onboarding/AgeGatePage.xaml
      - docs/legal/privacy-policy.md
      - docs/release/store-listing-copy.md
      devexpress:
      - DXButton
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - UI test verifies under-age path collects no profile, health or nutrition values.
    - Content test verifies age text is identical across policy and store listing source.
    grounding:
    - title: FTC Children's Online Privacy Protection Rule
      url: https://www.ftc.gov/legal-library/browse/rules/childrens-online-privacy-protection-rule-coppa
      note: US children's privacy requirements relevant if Forge were to support children.
    - title: GDPR Article 8 child consent
      url: https://gdpr-info.eu/art-8-gdpr/
      note: EU child-consent threshold requires careful regional handling.
    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
    openQuestions:
    - Confirm with counsel whether 16+ is sufficient for every launch region or whether store availability
      should be restricted further.

  - key: S25.05.02
    title: Disclose CCPA, CPRA and UK GDPR rights honestly
    wave: 2
    size: s
    platforms: [android, ios]
    persona: team
    concerns: [privacy]
    userStory:
      asA: user in a regulated region
      iWant: privacy rights explained in language that matches Forge's local-only design
      soThat: I understand which requests are self-service and which ones need contact
    requirements:
    - Privacy policy includes regional sections for California and UK users reviewed by counsel.
    - The policy explains that access, portability and deletion are primarily self-service because data is
      local in v1.
    - The policy does not claim Forge sells or shares personal information unless counsel verifies the
      definitions and data flows.
    - The in-app Privacy Summary links to regional-rights text.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: the privacy policy is inspected
      when: the California section is read
      then: it states whether Forge sells or shares personal information and links that answer to the data
        inventory
    - id: AC2
      given: the UK GDPR section is inspected
      when: rights text is compared with the deletion and export flows
      then: every described self-service right has a working in-app route or a contact path
    - id: AC3
      given: the device is offline and the user opens this privacy or legal flow
      when: the user follows the documented in-app path from Settings
      then: the flow completes using bundled copy or local state and does not require contacting support
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Add regional rights as policy sections rather than separate app code unless a region requires a distinct
        runtime choice. Keep wording conservative and marked for legal review, because definitions such as sale
        and sharing under CPRA are legal terms. Link self-service deletion to F25.01 and portability to E26 instead
        of duplicating those implementations here. Keep ownership in Forge.App/docs/legal with privacy-policy and
        route user-visible copy through shared LegalLinks or resource strings. Use DevExpress DXCollectionView for
        the review surface and Microsoft.Maui.Storage.Preferences only through abstractions so tests can prove offline
        behavior. The tricky part is matching local-only reality to store and GDPR evidence. A careless implementation
        would leave keys, caches, preferences or exported temp files behind, or assert a legal conclusion without
        counsel review.
      touches:
      - docs/legal/privacy-policy.md
      - src/Forge.App/Features/Legal/PrivacySummaryPage.xaml
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Content test verifies regional sections link to either a self-service route or contact route.
    - Regression test covers S25.05.02 failure, denied or fallback path with concrete assertions.
    grounding:
    - title: California Consumer Privacy Act
      url: https://oag.ca.gov/privacy/ccpa
      note: Official California privacy rights reference.
    - title: UK ICO guide to UK GDPR
      url: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/
      note: UK regulator guidance for GDPR obligations.
    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
    openQuestions:
    - Counsel must confirm whether Forge meets any California threshold for CCPA or CPRA applicability at
      launch.

  - key: S25.05.03
    title: Review product claims for medical-device boundary risk
