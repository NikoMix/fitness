      when: unresolved regulatory openQuestions exist
      then: release approval is blocked until they are closed or accepted by counsel
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Add docs/legal/product-claims-checklist.md and require every user-facing coaching surface to reference string
        resource keys that can be scanned. This is not a substitute for counsel, but it catches obvious mistakes
