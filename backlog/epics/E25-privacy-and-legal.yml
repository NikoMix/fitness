key: E25
title: Privacy, Legal and Regulatory Compliance
domain: compliance
wave: 2
summary: >-
  Forge ships as a local-only fitness app, so privacy is a product promise as well as a legal
  obligation. This epic turns that promise into review-ready deletion, consent, policy,
  declaration and legal guardrails before store submission work begins.
problem: >-
  Users are asked to record health, nutrition and training information that is sensitive even
  when it never leaves the device. If Forge cannot prove what it collects, how consent works,
  how data is erased and what claims it avoids, a store reviewer or regulator can block launch.
outcome: >-
  A reviewer can install Forge, find all legal surfaces, delete all local data without support,
  verify health-data consent, and reconcile the App Store and Google Play declarations with the
  app's local-only architecture.
successMetrics:
- 100 percent of store-blocking legal stories in this epic are complete before the first release candidate
  build.
- Local data deletion removes SQLite, the SQLCipher key, cached media, preferences and export temp files in
  one confirmed operation.
- Apple Privacy Nutrition Labels and Google Play Data Safety answers match an internal data inventory with
  zero unresolved contradictions.
nonGoals:
- No Forge backend, remote account server, cloud sync or server-side deletion workflow in v1.
- No legal advice generated by engineers without review from qualified counsel.
- No diagnostic, treatment or medical-device claim for any workout, nutrition or readiness guidance.
risks:
- risk: Store declarations are completed from memory and contradict the actual local data flows.
  mitigation: Maintain a reviewed data inventory and require each declaration answer to link back to a
    specific app capability.
  severity: critical
- risk: Account deletion only clears visible records and leaves the SQLCipher key, caches or exports
    recoverable.
  mitigation: Implement deletion as an infrastructure-owned erasure service with automated post-delete
    filesystem assertions.
  severity: critical
- risk: Health guidance is worded like diagnosis or treatment advice, creating medical-device review risk.
  mitigation: Add a product-claims checklist and legal copy review before any coaching or nutrition copy
    ships.
  severity: high
grounding:
- title: Apple App Review Guidelines 5.1 Privacy
  url: https://developer.apple.com/app-store/review/guidelines/#privacy
  note: Establishes privacy, health-data and user-consent expectations for App Store review.
- title: Apple account deletion guidance
  url: https://developer.apple.com/support/offering-account-deletion-in-your-app/
  note: Requires apps with account creation to offer in-app account deletion.
- title: Google Play Data safety form guidance
  url: https://support.google.com/googleplay/android-developer/answer/10787469
  note: Requires accurate Play Console declarations and warns that misrepresentation can block updates.
- title: GDPR Article 17 right to erasure
  url: https://gdpr-info.eu/art-17-gdpr/
  note: Establishes the legal basis for irreversible erasure where erasure applies.
- title: GDPR Article 9 special categories of personal data
  url: https://gdpr-info.eu/art-9-gdpr/
  note: Health data requires an explicit condition such as explicit consent.

features:
- key: F25.01
  title: Make local account and data deletion irreversible
  wave: 2
  summary: >-
    Provide a user-reachable deletion flow that deliberately removes every local artefact Forge
    controls, including encrypted storage material that would otherwise make deleted data
    recoverable.
  outcome: >-
    A user can erase Forge from inside the app without contacting support, and a test can prove
    no recoverable local data remains.
  concerns: [store-blocker, privacy, security]
  grounding:
  - title: Apple account deletion guidance
    url: https://developer.apple.com/support/offering-account-deletion-in-your-app/
    note: Deletion must be discoverable in app and not require support contact.
  - title: GDPR Article 17 right to erasure
    url: https://gdpr-info.eu/art-17-gdpr/
    note: Establishes the legal basis for irreversible erasure.
  stories:
  - key: S25.01.01
    title: Add a deliberate Delete my account and data flow
    wave: 2
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [store-blocker, privacy]
    userStory:
      asA: privacy-conscious Forge user
      iWant: to delete my account and data from inside the app
      soThat: I do not need to contact support to exercise control over my information
    requirements:
    - The deletion entry point is reachable from Profile and Legal settings in no more than three taps from
      the tab shell.
    - The confirmation screen lists SQLite data, the encryption key, cached media, preferences and export temp
      files as deleted artefacts.
    - The final action requires typing DELETE and pressing a destructive confirmation button.
    - The flow works fully offline and does not attempt any network request.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    - Successful deletion removes the SQLite database, SQLCipher key in secure storage, cached media,
      preferences and exported temp files before reporting completion.
    acceptanceCriteria:
    - id: AC1
      given: a user has workouts, meals, health permissions and cached exercise media
      when: they open the deletion screen
      then: the screen lists each data category that will be erased before the destructive button is enabled
    - id: AC2
      given: the deletion screen is open
      when: the user types anything other than DELETE
      then: the final deletion button remains disabled
    - id: AC3
      given: the device is offline
      when: the user confirms deletion with the required text
      then: deletion starts and no support, email or network step is required
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Build this under src/Forge.App/Features/Legal using a DevExpress DXPopup or full-page route depending on
        navigation constraints from E01. The ViewModel calls an ILocalDataErasureService declared in Forge.Core
        so the UI never deletes files directly. Use clear destructive styling and require typed confirmation because
        this cannot be undone once the SQLCipher key is destroyed.  Keep ownership in Forge.App/src/Forge.App/Features/Legal
        with DeleteDataPage and route user-visible copy through shared LegalLinks or resource strings. Use DevExpress
        DXPopup for the review surface and Microsoft.Maui.Storage.Preferences only through abstractions so tests
        can prove offline behavior. The tricky part is matching local-only reality to store and GDPR evidence. A
        careless implementation would leave keys, caches, preferences or exported temp files behind, or assert a
        legal conclusion withou
      touches:
      - src/Forge.App/Features/Legal/DeleteDataPage.xaml
      - src/Forge.App/Features/Legal/DeleteDataViewModel.cs
      - src/Forge.Core/Privacy/ILocalDataErasureService.cs
      devexpress:
      - DXPopup
      - DXButton
      - TextEdit
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - UI test verifies the path from Profile settings to the final confirmation on Android and iOS.
    - Unit test verifies the ViewModel refuses confirmation text other than DELETE.
    grounding:
    - title: Apple account deletion guidance
      url: https://developer.apple.com/support/offering-account-deletion-in-your-app/
      note: In-app deletion is required for apps with account creation.

    - title: GDPR Article 17 right to erasure
      url: https://gdpr-info.eu/art-17-gdpr/
      note: Grounds irreversible local data erasure requirements where erasure applies.
  - key: S25.01.02
    title: Erase SQLite, SQLCipher keys and local artefacts atomically
    wave: 2
    size: l
    platforms: [android, ios]
    persona: team
    concerns: [store-blocker, privacy, security]
    userStory:
      asA: developer responsible for Forge privacy
      iWant: one erasure service that removes every local artefact
      soThat: deletion is real rather than a cosmetic reset
    requirements:
    - Erasure closes all active SQLite connections before deleting the database and journal files.
    - The SQLCipher key is removed from platform secure storage before the app returns to onboarding.
    - Cached media, local logs, preferences and export temp files are deleted from their documented
      directories.
    - If one artefact cannot be deleted, the user sees a failure state and the app does not claim deletion
      succeeded.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    - Successful deletion removes the SQLite database, SQLCipher key in secure storage, cached media,
      preferences and exported temp files before reporting completion.
    acceptanceCriteria:
    - id: AC1
      given: the app has an encrypted database, WAL files, cached media, preferences and export temp files
      when: ILocalDataErasureService.ExecuteAsync completes successfully
      then: none of those files or preference keys exists on disk or in secure storage
    - id: AC2
      given: a database connection is intentionally left open in a test harness
      when: deletion is requested
      then: the service closes the connection and removes the database without a sharing violation
    - id: AC3
      given: a file deletion throws an IOException
      when: deletion is requested
      then: the result reports failure, names the artefact class and leaves the user on a safe retry screen
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Implement the service in Forge.Infrastructure/Persistence because it owns SQLite, SQLCipher and file locations.
        Inject small abstractions for secure storage, preferences, cache folders and export folders so unit tests
        can run on net10.0 without a device. Delete the SQLCipher key as part of the same workflow rather than only
        deleting the database, since retaining the key undermines irreversible erasure.
      touches:
      - src/Forge.Infrastructure/Privacy/LocalDataErasureService.cs
      - src/Forge.Infrastructure/Persistence/ForgeDbContextFactory.cs
      - tests/Forge.Infrastructure.Tests/Privacy/LocalDataErasureServiceTests.cs
      apis:
      - Microsoft.Maui.Storage.SecureStorage
      - Microsoft.Maui.Storage.Preferences
      - SQLitePCLRaw.bundle_e_sqlcipher
      devexpress:
      - DXCollectionView
    testing:
    - Integration test creates all known artefact classes and asserts they are absent after deletion.
    - Failure-injection test verifies partial deletion reports failure instead of success.
    grounding:
    - title: .NET MAUI secure storage
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/secure-storage
      note: Defines the secure-storage API used for the SQLCipher key.

    - title: GDPR Article 17 right to erasure
      url: https://gdpr-info.eu/art-17-gdpr/
      note: Grounds irreversible local data erasure requirements where erasure applies.
  - key: S25.01.03
    title: Reset the app to first run after deletion
    wave: 2
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker, privacy]
    userStory:
      asA: user who has deleted Forge data
      iWant: the app to restart in a clean first-run state
      soThat: I can either leave or begin again without stale state reappearing
    requirements:
    - After successful deletion the navigation stack is cleared and onboarding opens as if the app were newly
      installed.
    - Health Connect and HealthKit permissions are treated as revoked inside Forge until the user grants
      consent again.
    - A post-delete verification screen states that local Forge data was removed and that operating-system
      health permissions may still be managed in system settings.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    - Successful deletion removes the SQLite database, SQLCipher key in secure storage, cached media,
      preferences and exported temp files before reporting completion.
    acceptanceCriteria:
    - id: AC1
      given: deletion has completed successfully
      when: the app navigates away from the confirmation screen
      then: no previous tab, workout or profile route can be reached with the back button
    - id: AC2
      given: the user relaunches the app after deletion
      when: startup completes
      then: onboarding is shown and no previous profile name, goal, workout or food entry is visible
    - id: AC3
      given: HealthKit or Health Connect permissions still exist at OS level
      when: the clean state is shown
      then: Forge treats health access as not consented until the user opts in again inside Forge
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Coordinate with the E01 navigation service to replace the root route rather than pushing onboarding on top
        of the old stack. Clear only Forge-controlled state and be precise in copy about OS-level health permissions,
        because an app cannot silently revoke every platform permission on the user's behalf. The ViewModel should
        publish a local event that resets in-memory singletons before navigation.  Keep ownership in Forge.App/src/Forge.App/Navigation
        with ShellNavigationService and route user-visible copy through shared LegalLinks or resource strings. Use
        DevExpress DXCollectionView for the review surface and Microsoft.Maui.Controls.Shell only through abstractions
        so tests can prove offline behavior. The tricky part is matching local-only reality to store and GDPR evidence.
        A careless implementation would leave keys, caches, preferences or exported temp files behind, or assert
        a l
      touches:
      - src/Forge.App/Navigation/ShellNavigationService.cs
      - src/Forge.App/Features/Onboarding
      - src/Forge.Core/Privacy/DataDeletedEvent.cs
      apis:
      - Microsoft.Maui.Controls.Shell
      devexpress:
      - DXCollectionView
    testing:
    - UI test verifies Android hardware back cannot return to pre-delete screens.
    - Startup test verifies onboarding appears after deletion and process restart.

    grounding:
    - title: GDPR Article 17 right to erasure
      url: https://gdpr-info.eu/art-17-gdpr/
      note: Grounds irreversible local data erasure requirements where erasure applies.
- key: F25.02
  title: Publish policy, terms, disclaimer and attribution surfaces
  wave: 2
  summary: >-
    Make all required legal information available in app and at public locations before store
    submission, with copy that reflects Forge's local-only architecture and safety limits.
  outcome: >-
    Store reviewers and users can find the privacy policy, terms, medical disclaimer and
    licence attributions from the app and, where required, from public URLs.
  concerns: [store-blocker, privacy]
  stories:
  - key: S25.02.01
    title: Host and link a public privacy policy
    wave: 2
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [store-blocker, privacy]
    userStory:
      asA: prospective Forge user
      iWant: to read the privacy policy before installing or granting permissions
      soThat: I can decide whether the local-only claim is trustworthy
    requirements:
    - A public HTTPS privacy policy URL is available before App Store, Google Play and Health Connect
      submission.
    - The same policy is reachable in app from Settings and from any health-permission consent screen.
    - The policy states that Forge has no backend in v1 and identifies data stored locally on device.
    - The policy has a version date and contact route for privacy requests.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    - Release validation treats missing public URL evidence or unresolved store declaration evidence as a
      store-blocking failure.
    acceptanceCriteria:
    - id: AC1
      given: the release candidate repository is published
      when: the privacy policy URL is opened in a browser without authentication
      then: it returns HTTP 200 over HTTPS and displays the current policy text
    - id: AC2
      given: the user is on the health consent screen
      when: they tap Privacy Policy
      then: the same public URL opens and the in-app WebView fallback renders if the browser is unavailable
    - id: AC3
      given: the policy content is inspected
      when: data flows are compared with the data inventory
      then: every data category in Forge is described with local storage and sharing status
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Add a docs/legal/privacy-policy.md source and publish it through GitHub Pages or an equivalent static host
        because v1 has no backend. The app should store the canonical URL in one LegalLinks class and open it through
        Browser.OpenAsync. Do not hard-code a different copy inside XAML, because store forms and Health Connect
        review must point to the public version. Keep ownership in Forge.App/docs/legal with privacy-policy and
        route user-visible copy through shared LegalLinks or resource strings. Use DevExpress DXCollectionView for
        the review surface and Microsoft.Maui.ApplicationModel.Browser only through abstractions so tests can prove
        offline behavior. The tricky part is matching local-only reality to store and GDPR evidence. A careless
        implementation would leave keys, caches, preferences or exported temp files behind, or assert a legal conclusion
        without counsel review.
      touches:
      - docs/legal/privacy-policy.md
      - src/Forge.App/Features/Legal/LegalLinks.cs
      - src/Forge.App/Features/Settings/LegalSettingsPage.xaml
      apis:
      - Microsoft.Maui.ApplicationModel.Browser
      devexpress:
      - DXCollectionView
    testing:
    - CI link check verifies the configured privacy policy URL returns HTTP 200.
    - Unit test verifies all privacy-policy buttons use the same LegalLinks.PrivacyPolicyUrl value.
    grounding:
    - title: Apple App Privacy Details
      url: https://developer.apple.com/help/app-store-connect/reference/app-privacy-details
      note: App Store Connect requires privacy information for submitted apps.
    - title: Google Play User Data policy
      url: https://support.google.com/googleplay/android-developer/answer/10144311
      note: Google Play requires transparent disclosure of user-data handling.

    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
  - key: S25.02.02
    title: Present terms and medical disclaimer before guidance is used
    wave: 2
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [store-blocker]
    userStory:
      asA: user receiving exercise and nutrition guidance
      iWant: clear limits before I rely on it
      soThat: I understand Forge is fitness guidance, not medical diagnosis or treatment
    requirements:
    - Terms of service are reachable from Settings and accepted during onboarding before personalised guidance
      is enabled.
    - A medical disclaimer appears before the first workout plan, nutrition target or readiness insight is
      generated.
    - The disclaimer advises consulting a qualified professional for medical conditions, injuries, pregnancy
      or eating-disorder concerns.
    - Acceptance version, locale and timestamp are stored locally and can be revoked by deleting data.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: a new user reaches onboarding
      when: they decline the terms or medical disclaimer
      then: personalised workout, nutrition and readiness guidance remains disabled
    - id: AC2
      given: the disclaimer has been accepted
      when: the user opens Settings and views Legal
      then: the accepted version and date are visible locally
    - id: AC3
      given: legal copy changes version
      when: the app next launches
      then: the user must accept the new version before guidance features are re-enabled
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Store legal acceptance records in SQLite as local compliance state, not in remote systems that do not exist.
        Gate guidance through an ILegalConsentService in Forge.Core so training and nutrition ViewModels
        can ask for eligibility without referencing UI controls. Keep the copy factual and conservative, and require
        legal review before final store submission.  Keep ownership in Forge.Core/src/Forge.Core/Legal
        with ILegalConsentService and route user-visible copy through shared LegalLinks or resource strings. Use
        DevExpress DXPopup for the review surface and Microsoft.Maui.Storage.Preferences only through abstractions
        so tests can prove offline behavior. The tricky part is matching local-only reality to store and GDPR evidence.
        A careless implementation would leave keys, caches, preferences or exported temp files behind, or assert
        a legal conclusion without cou
      touches:
      - src/Forge.Core/Legal/ILegalConsentService.cs
      - src/Forge.Infrastructure/Persistence/LegalAcceptanceEntity.cs
      - src/Forge.App/Features/Legal/TermsAndDisclaimerPage.xaml
      devexpress:
      - DXPopup
      - DXButton
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit test verifies guidance service calls fail closed when required legal acceptance is missing.
    - UI test verifies changed version prompts for re-acceptance.
    grounding:
    - title: Apple App Review Guidelines 1.4 Physical harm
      url: https://developer.apple.com/app-store/review/guidelines/#physical-harm
      note: Health and fitness apps must avoid unsafe advice and misleading medical use.
    - title: FDA device software functions and mobile medical applications policy
      url:
        https://www.fda.gov/medical-devices/digital-health-center-excellence/policy-device-software-functions-and-mobile-medical-applications
      note: Helps frame the boundary between wellness guidance and regulated medical functions.

    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
  - key: S25.02.03
    title: Generate third-party licence and content attribution notices
    wave: 2
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [store-blocker]
    userStory:
      asA: release owner
      iWant: complete open-source and content licence notices
      soThat: Forge does not ship with missing attribution for packages or seed databases
    requirements:
    - In-app notices list NuGet package licences, DevExpress terms reference, food database licences and
      exercise content licences.
    - The notices are generated from checked-in manifests and fail CI when a required licence is missing.
    - Food and exercise seed data attribution is visible from Legal settings and from the relevant catalogue
      about screens.
    - Licence text is bundled locally so it is readable offline.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: a new production PackageReference is added
      when: the licence generation check runs
      then: CI fails until the package licence is resolved or explicitly reviewed
    - id: AC2
      given: the device is offline
      when: the user opens Open-source licences from Settings
      then: package and content attributions render without a network connection
    - id: AC3
      given: food and exercise seed manifests are inspected
      when: their source licences are compared to the in-app notice
      then: each source appears with licence name, source name and attribution text
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Add a small tool under tools/LegalNotices that reads project PackageReference data and content-source manifests,
        then emits Resources/Raw/legal-notices.json for the app. Display it with DXCollectionView grouped by packages,
        food data and exercise data. DevExpress itself may require a product-specific notice, so keep an explicit
        manually reviewed entry in the manifest rather than assuming NuGet metadata is enough.
      touches:
      - tools/LegalNotices
      - src/Forge.App/Resources/Raw/legal-notices.json
      - src/Forge.App/Features/Legal/LicencesPage.xaml
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - CI test fails when a production dependency has no licence metadata or approved override.
    - Snapshot test verifies generated notices include seed food and exercise databases.

    grounding:
    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
- key: F25.03
  title: Complete store privacy and health declarations accurately
  wave: 2
  summary: >-
    Translate Forge's actual local data flows into App Store and Google Play submission answers,
    treating the local-only architecture as both a compliance simplifier and a marketing asset.
  outcome: >-
    Store submission forms, Health Connect declarations and app copy all agree that health data
    stays on device and is never used for advertising.
  concerns: [store-blocker, long-lead, privacy]
  stories:
  - key: S25.03.01
    title: Prepare Apple Privacy Nutrition Labels from the data inventory
    wave: 2
    size: m
    platforms: [ios]
    persona: team
    concerns: [store-blocker, privacy]
    userStory:
      asA: App Store release owner
      iWant: Apple privacy answers derived from evidence
      soThat: Forge is not rejected for inaccurate App Privacy details
    requirements:
    - A checked-in data inventory maps each feature to data categories, collection status and whether data is
      linked to the user.
    - App Privacy answers are recorded in a review checklist with evidence links to the inventory.
    - The inventory highlights that Forge stores health and fitness data locally and does not transmit it to
      Forge servers in v1.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: a reviewer opens the App Privacy checklist
      when: they inspect each Apple data category answer
      then: every answer links to a Forge feature or states not collected with evidence
    - id: AC2
      given: a new feature adds a data category
      when: the data inventory check runs
      then: CI fails until the Apple declaration checklist is updated
    - id: AC3
      given: the device is offline and the user opens this privacy or legal flow
      when: the user follows the documented in-app path from Settings
      then: the flow completes using bundled copy or local state and does not require contacting support
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Keep the data inventory in docs/legal/data-inventory.yml and write a simple schema check under tools/backlog-sync
        or tools/legal. The app does not need App Store Connect API automation yet, but the release checklist must
        be concrete enough that a human can fill Apple's form without guessing. State the local-only design plainly
        because it is both compliance evidence and a store-listing trust point.
      touches:
      - docs/legal/data-inventory.yml
      - docs/legal/apple-app-privacy-checklist.md
      - tools/legal
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - CI validates that every production feature touching personal data has a data-inventory entry.
    - Regression test covers S25.03.01 failure, denied or fallback path with concrete assertions.
    grounding:
    - title: Apple App Privacy Details
      url: https://developer.apple.com/help/app-store-connect/reference/app-privacy-details
      note: Official App Store Connect reference for privacy declarations.

    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
