      - tools/legal/ClaimsCopyCheck.cs
      - src/Forge.App/Resources/Strings
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit test for claims scanner flags prohibited medical verbs in sample resource strings.
    - Release checklist requires no unresolved medical-device openQuestions.
    grounding:
    - title: FDA mobile medical applications policy
      url:
        https://www.fda.gov/medical-devices/digital-health-center-excellence/policy-device-software-functions-and-mobile-medical-applications
      note: US reference for when software functions may become regulated medical devices.
    - title: European Commission medical devices sector
      url: https://health.ec.europa.eu/medical-devices-sector_en
      note: EU medical-device context for MDR risk review.

    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
- key: F25.06
  title: Connect privacy operations to portability and release governance
  wave: 2
  summary: >-
    Keep privacy work from becoming a one-time document by linking portability, evidence and
    release approvals to the same data inventory and legal surfaces.
  outcome: >-
    Release managers can prove every privacy blocker has an owner, a wave and evidence before
    submission begins.
  concerns: [store-blocker, privacy]
  stories:
  - key: S25.06.01
    title: Link data portability rights to the E26 export capability
    wave: 2
    size: s
    platforms: [android, ios]
    persona: enthusiast
    concerns: [store-blocker, privacy]
    dependsOn: [E26]
    userStory:
      asA: user who wants to leave Forge
      iWant: privacy surfaces to point me to export before deletion
      soThat: I can take my data with me before it is erased
    requirements:
    - The deletion flow offers an export-before-delete link when E26 export is available.
    - Privacy policy and Privacy Summary describe portability as the E26 local export flow, not as a server
      request.
    - Deletion remains available even if the user skips export.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: E26 export is enabled
      when: the user opens Delete my data
      then: an Export first option appears before the destructive confirmation
    - id: AC2
      given: the user chooses not to export
      when: they complete deletion
      then: deletion still succeeds without requiring export
    - id: AC3
      given: the device is offline and the user opens this privacy or legal flow
      when: the user follows the documented in-app path from Settings
      then: the flow completes using bundled copy or local state and does not require contacting support
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Do not implement export in this epic. Add route links, policy copy and contracts that E26 can satisfy. The
        deletion ViewModel should query an IDataExportAvailabilityService so this story can land before the full
        export implementation without duplicating E26 scope. Keep ownership in Forge.App/src/Forge.App/Features/Legal
        with DeleteDataViewModel and route user-visible copy through shared LegalLinks or resource strings. Use
        DevExpress DXButton for the review surface and Microsoft.Maui.Storage.Preferences only through abstractions
        so tests can prove offline behavior. The tricky part is matching local-only reality to store and GDPR evidence.
        A careless implementation would leave keys, caches, preferences or exported temp files behind, or assert
        a legal conclusion without counsel review.
      touches:
      - src/Forge.App/Features/Legal/DeleteDataViewModel.cs
      - docs/legal/privacy-policy.md
      - src/Forge.Core/Export/IDataExportAvailabilityService.cs
      devexpress:
      - DXButton
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit test verifies deletion remains enabled when export availability is false.
    - Regression test covers S25.06.01 failure, denied or fallback path with concrete assertions.
    grounding:
    - title: GDPR Article 20 right to data portability
      url: https://gdpr-info.eu/art-20-gdpr/
      note: Portability belongs in E26 but must be signposted from privacy flows.

  - key: S25.06.02
    title: Add a store-blocker compliance release checklist
    wave: 2
    size: s
    platforms: [android, ios]
    persona: team
    concerns: [store-blocker]
    userStory:
      asA: release manager
      iWant: one checklist of privacy and legal store blockers
      soThat: submission cannot start while a mandatory item is still incomplete
    requirements:
    - Checklist covers in-app deletion, public privacy URL, terms, medical disclaimer, licences, App Privacy,
      Data Safety and Health Connect declarations.
    - Each checklist item records owner, evidence URL or file path, status and last reviewed date.
    - Release packaging fails when any store-blocker item is not done.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    - Release validation treats missing public URL evidence or unresolved store declaration evidence as a
      store-blocking failure.
    acceptanceCriteria:
    - id: AC1
      given: a store-blocker checklist item is marked pending
      when: the release packaging validation runs
      then: the validation fails and names the pending item
    - id: AC2
      given: all checklist items are done with evidence
      when: validation runs
      then: the compliance gate passes without requiring network access
    - id: AC3
      given: the device is offline and the user opens this privacy or legal flow
      when: the user follows the documented in-app path from Settings
      then: the flow completes using bundled copy or local state and does not require contacting support
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Store the checklist as docs/release/store-compliance.yml with a minimal schema checked by a local tool.
        This keeps release evidence in version control and avoids relying on memory. Wire the validation into the
        release build path only, so normal developer inner-loop builds are not blocked by legal document churn.
        Keep ownership in Forge.App/docs/release with store-compliance and route user-visible copy through shared
        LegalLinks or resource strings. Use DevExpress DXCollectionView for the review surface and Microsoft.Maui.Storage.Preferences
        only through abstractions so tests can prove offline behavior. The tricky part is matching local-only reality
        to store and GDPR evidence. A careless implementation would leave keys, caches, preferences or exported
        temp files behind, or assert a legal conclusion without counsel review.
      touches:
      - docs/release/store-compliance.yml
      - tools/release/StoreComplianceCheck.cs
      - .github/workflows
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - CI test exercises one pending item fixture and one complete fixture.

    - Regression test covers S25.06.02 failure, denied or fallback path with concrete assertions.
    grounding:
    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
  - key: S25.06.03
    title: Require legal review for unresolved jurisdiction questions
    wave: 2
    size: xs
    platforms: [android, ios]
    persona: team
    concerns: [store-blocker]
    userStory:
      asA: product owner
      iWant: open legal questions visible in the release gate
      soThat: engineers do not silently decide jurisdiction or regulatory questions
    requirements:
    - Legal openQuestions from this epic are copied into the release compliance checklist with owner and due
      date.
    - Any open question marked release-blocking prevents store submission packaging.
    - Accepted legal risks require a dated note and named approver in the checklist.
    - All user-facing legal and privacy copy is sourced from versioned files and marked pending legal review
      until counsel or the release owner approves it.
    - The flow remains available offline except for opening a public policy URL, and any offline fallback must
      clearly show the last bundled policy version.
    acceptanceCriteria:
    - id: AC1
      given: a release-blocking open legal question exists
      when: the release gate runs
      then: submission validation fails and names the question owner
    - id: AC2
      given: counsel accepts a risk with approver and date
      when: the release gate runs
      then: the item is treated as resolved and the acceptance note is included in the report
    - id: AC3
      given: the device is offline and the user opens this privacy or legal flow
      when: the user follows the documented in-app path from Settings
      then: the flow completes using bundled copy or local state and does not require contacting support
    - id: AC4
      given: the release compliance check runs for a candidate build
      when: required legal evidence is missing, stale or marked pending review
      then: the check fails with the story key and the missing evidence field within the report
    implementation:
      notes: >-
        Extend the store-compliance.yml schema with openQuestions and acceptedRisks sections. This story is intentionally
        process-heavy because the dangerous failure mode is an engineer making legal assumptions in YAML. Keep the
        final answers in documentation and link them from the app only when they affect user-facing copy. Keep ownership
        in Forge.App/docs/release with store-compliance and route user-visible copy through shared LegalLinks or
        resource strings. Use DevExpress DXCollectionView for the review surface and Microsoft.Maui.Storage.Preferences
        only through abstractions so tests can prove offline behavior. The tricky part is matching local-only reality
        to store and GDPR evidence. A careless implementation would leave keys, caches, preferences or exported
        temp files behind, or assert a legal conclusion without counsel review.
      touches:
      - docs/release/store-compliance.yml
      - tools/release/StoreComplianceCheck.cs
      devexpress:
      - DXCollectionView
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Schema test verifies release-blocking openQuestions require owner and due date.
    - Regression test covers S25.06.03 failure, denied or fallback path with concrete assertions.
    grounding:
    - title: Apple App Review Guidelines 5.1 Privacy
      url: https://developer.apple.com/app-store/review/guidelines/#privacy
      note: Grounds App Store privacy, consent and user data disclosure expectations.
