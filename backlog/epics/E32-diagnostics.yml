      iWant: to choose the recipient myself
      soThat: nothing uploads automatically
    requirements:
    - Share diagnostics calls the OS share sheet with the reviewed bundle file.
    - Forge performs no HTTP upload or automatic recipient selection.
    - The command is enabled only after review and redaction pass.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
