      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
