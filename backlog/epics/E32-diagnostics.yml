        using Microsoft.Extensions.Logging, app-private cache or AppDataDirectory storage, and DevExpress review controls
        where UI is needed. Use allow-listed typed event properties such as route, status, duration bucket and file size,
        never arbitrary message templates or domain objects. Enforce rotation, retention and local-only sharing through the
        OS sheet. A careless implementation would log exception.ToString with notes, keep unlimited files, or add an automatic
        crash upload that breaks Forge local-first privacy.
      touches: [src/Forge.App/Features/Diagnostics/DiagnosticShareService.cs]
      devexpress:
      - DXButton
      apis:
      - Microsoft.Maui.ApplicationModel.DataTransfer.Share
    testing:
    - UI automation for Share enablement and source scan for HttpClient absence.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: Logging in .NET
      url: https://learn.microsoft.com/dotnet/core/extensions/logging
      note: Grounds Microsoft.Extensions.Logging event levels and structured logs.
    - title: .NET MAUI share files
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/data/share
      note: Grounds opt-in OS share flows rather than automatic upload.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
    - title: GDPR Article 9
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds treating health and fitness records as special-category data.
- key: F32.03
  title: Trace startup and frame performance
  wave: 3
  summary: >-
    Measure cold start, database readiness and critical frame timing in local traces with low overhead.
  outcome: >-
    Performance budgets are observable on devices without collecting personal data.
  concerns: [perf, privacy]
  dependsOn: [E01, E04]
  stories:
  - key: S32.03.01
    title: Record cold-start milestones on every launch
    wave: 3
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [perf]
    userStory:
      asA: Forge team member
      iWant: local cold-start traces
      soThat: startup regressions are visible before release
    requirements:
    - Milestones include process start, MauiProgram start, DI built, database ready, shell created and first interactive
      frame.
    - Trace overhead is under 20 ms.
    - Cold start without migration remains under 2.0 seconds and traces contain timing names only.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
    - id: AC1
      given: a normal cold start has no pending migration
      when: startup completes
      then: all milestones exist and total duration is under 2.0 seconds
    - id: AC2
      given: tracing is toggled in a performance build
      when: cold starts are compared
      then: overhead is under 20 ms
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Add early static hooks for pre-DI milestones and hand off to an injected recorder after MauiProgram builds. Store
        compact JSON in diagnostics cache.  Implement this in src/Forge.App/Diagnostics/StartupTraceRecorder.cs using Microsoft.Extensions.Logging,
        app-private cache or AppDataDirectory storage, and DevExpress review controls where UI is needed. Use allow-listed
        typed event properties such as route, status, duration bucket and file size, never arbitrary message templates or
        domain objects. Enforce rotation, retention and local-only sharing through the OS sheet. A careless implementation
        would log exception.ToString with notes, keep unlimited files, or add an automatic crash upload that breaks Forge
        local-first privacy.
      touches: [src/Forge.App/Diagnostics/StartupTraceRecorder.cs]
      apis:
      - System.Diagnostics.Stopwatch
      - Microsoft.Maui.Controls.Application
    testing:
    - Startup milestone ordering and device budget tests.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: Logging in .NET
      url: https://learn.microsoft.com/dotnet/core/extensions/logging
      note: Grounds Microsoft.Extensions.Logging event levels and structured logs.
    - title: .NET MAUI file system helpers
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-system-helpers
      note: Grounds AppDataDirectory, CacheDirectory and safe local file placement.
  - key: S32.03.02
    title: Capture frame timing for critical interactions
    wave: 3
    size: m
    platforms: [android, ios]
    persona: enthusiast
    concerns: [perf]
    userStory:
      asA: enthusiast user
      iWant: Forge to detect jank in key flows
      soThat: performance problems do not interrupt training
    requirements:
    - Capture covers workout set logging, food search scrolling and chart navigation.
    - Summary records frames over 16.6 ms and over 33 ms.
    - Tracing adds less than 5 MB memory overhead.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
    - id: AC1
      given: frame tracing is enabled
      when: 500 food results are scrolled
      then: summary records sample count, p95 and count over 16.6 ms
    - id: AC2
      given: 10 injected frames exceed 33 ms
      when: summary is computed
      then: over-33-ms count equals 10
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Hide platform frame timing behind IFrameTimingService. Android can use Choreographer and iOS can use CADisplayLink,
        storing aggregate timings only.  Implement this in src/Forge.Core/Diagnostics/IFrameTimingService.cs using
        Microsoft.Extensions.Logging, app-private cache or AppDataDirectory storage, and DevExpress review controls where
        UI is needed. Use allow-listed typed event properties such as route, status, duration bucket and file size, never
        arbitrary message templates or domain objects. Enforce rotation, retention and local-only sharing through the OS sheet.
        A careless implementation would log exception.ToString with notes, keep unlimited files, or add an automatic crash
        upload that breaks Forge local-first privacy.
      touches: [src/Forge.Core/Diagnostics/IFrameTimingService.cs]
      devexpress:
      - DXCollectionView
      - RadialGauge
      - ChartView
      apis:
      - Android.Views.Choreographer
      - CoreAnimation.CADisplayLink
    testing:
    - Frame summary unit tests and manual scroll tests.
