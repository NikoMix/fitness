key: E32
title: Diagnostics and Local Telemetry
domain: quality
wave: 3
summary: >-
  Forge needs observability for crashes, migrations, storage and performance while preserving the local-only privacy promise.
  This epic creates on-device structured telemetry, reviewable diagnostic bundles, performance traces, storage reporting and
  debug tooling with no automatic analytics or crash upload.
problem: >-
  When a local-only app fails, support needs technical context, but collecting health data or phoning home would break user
  trust. Diagnostics must be useful, bounded, reviewable and explicitly shared by the user.
outcome: >-
  Forge records privacy-safe local events, crash breadcrumbs and performance traces, lets users review diagnostic bundles
  before OS sharing, and exposes storage plus data inventory screens sourced from the real database.
successMetrics:
- Production packages include no automatic analytics SDK, remote crash reporter or diagnostic upload.
- Diagnostic bundle redaction tests find zero workout values, food names, body metrics or free-text notes.
- Startup trace records required milestones for every launch with under 20 ms overhead.
- Storage usage categories report within 5 percent of direct file-system measurements.
nonGoals:
- No automatic telemetry transmission, analytics dashboard or remote crash reporting in v1.
- No collection of health data for product analytics or advertising.
- No desktop diagnostic tooling in waves 1 to 5.
risks:
- risk: Logs accidentally include Article 9 health data through free-text payloads.
  mitigation: Use allow-listed typed event properties and redaction tests over generated bundles.
  severity: critical
- risk: Debug tooling exposes database metadata in production.
  mitigation: Gate sensitive screens behind build flags, deliberate gesture and local user verification.
  severity: high
- risk: Tracing overhead erodes the startup budget.
  mitigation: Use lightweight timers and enforce overhead below 20 ms.
  severity: medium
grounding:
- title: Microsoft.Extensions.Logging in .NET
  url: https://learn.microsoft.com/dotnet/core/extensions/logging
  note: Provides local structured logging abstractions.
- title: .NET MAUI share files
  url: https://learn.microsoft.com/dotnet/maui/platform-integration/data/share
  note: Used for explicit diagnostic bundle sharing.
- title: .NET MAUI app lifecycle
  url: https://learn.microsoft.com/dotnet/maui/fundamentals/app-lifecycle
  note: Used for startup traces and crash recovery hooks.
- title: DevExpress MAUI CollectionView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
  note: Used for virtualised diagnostics and inventory lists.
features:
- key: F32.01
  title: Record local diagnostic events
  wave: 3
  summary: >-
    Capture structured technical logs and crash breadcrumbs on-device with bounded storage and redaction.
  outcome: >-
    Diagnostics are useful for support but contain no health data and never transmit automatically.
  concerns: [privacy, perf, offline]
  dependsOn: [E01, E04]
  stories:
  - key: S32.01.01
    title: Write structured local event logs with rotation
    wave: 3
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [privacy, perf]
    userStory:
      asA: Forge team member
      iWant: structured local technical logs
      soThat: failures can be diagnosed without remote analytics
    requirements:
    - Logs use Microsoft.Extensions.Logging and newline-delimited JSON in cache.
    - Logs rotate at 5 MB with at most three retained files.
    - Payloads accept only allow-listed scalar fields and add less than 1 ms p95 overhead to set logging.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
    - id: AC1
      given: workout, meal and body metric flows have run
      when: logs are inspected
      then: no reps, weights, food names, calories, bodyweight or notes appear
    - id: AC2
      given: the active log reaches 5 MB
      when: another event is written
      then: rotation occurs and no more than three files remain
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Extend the E01 logger with typed ForgeDiagnosticEventId values and payload builders that cannot accept free-text health
        data. Use a bounded channel and no HTTP sink.  Implement this in src/Forge.Infrastructure/Diagnostics/ForgeDiagnosticEventId.cs
        using Microsoft.Extensions.Logging, app-private cache or AppDataDirectory storage, and DevExpress review controls
        where UI is needed. Use allow-listed typed event properties such as route, status, duration bucket and file size,
        never arbitrary message templates or domain objects. Enforce rotation, retention and local-only sharing through the
        OS sheet. A careless implementation would log exception.ToString with notes, keep unlimited files, or add an automatic
        crash upload that breaks Forge local-first privacy.
      touches: [src/Forge.Infrastructure/Diagnostics/ForgeDiagnosticEventId.cs]
      apis:
      - Microsoft.Extensions.Logging
      - System.Threading.Channels
    testing:
    - Redaction, rotation and logging-overhead tests.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: Logging in .NET
      url: https://learn.microsoft.com/dotnet/core/extensions/logging
      note: Grounds Microsoft.Extensions.Logging event levels and structured logs.
    - title: .NET MAUI file system helpers
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-system-helpers
      note: Grounds AppDataDirectory, CacheDirectory and safe local file placement.
  - key: S32.01.02
    title: Capture crash breadcrumbs without domain values
    wave: 3
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [privacy]
    userStory:
      asA: Forge team member
      iWant: the last technical events before a crash
      soThat: the failing route or operation is visible without health records
    requirements:
    - A ring buffer stores the last 100 breadcrumbs.
    - Breadcrumbs include route names, operation ids and timing categories only.
    - Unhandled exception handling flushes breadcrumbs within 200 ms before recovery UI.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
    - id: AC1
      given: 150 breadcrumb events are recorded
      when: a crash bundle is created
      then: only the newest 100 breadcrumbs are included
    - id: AC2
      given: a forced crash occurs after set logging
      when: breadcrumbs are inspected
      then: route and operation id exist but set weight and reps are absent
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Implement BreadcrumbRecorder as an in-memory ring buffer flushed to cache. Record route constants and operation ids,
        not display names, food text or metric values.  Implement this in src/Forge.Infrastructure/Diagnostics/BreadcrumbRecorder.cs
        using Microsoft.Extensions.Logging, app-private cache or AppDataDirectory storage, and DevExpress review controls
        where UI is needed. Use allow-listed typed event properties such as route, status, duration bucket and file size,
        never arbitrary message templates or domain objects. Enforce rotation, retention and local-only sharing through the
        OS sheet. A careless implementation would log exception.ToString with notes, keep unlimited files, or add an automatic
        crash upload that breaks Forge local-first privacy.
      touches: [src/Forge.Infrastructure/Diagnostics/BreadcrumbRecorder.cs]
      apis:
      - AppDomain.UnhandledException
      - TaskScheduler.UnobservedTaskException
    testing:
    - Ring buffer truncation and forced-crash redaction tests.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: Logging in .NET
      url: https://learn.microsoft.com/dotnet/core/extensions/logging
      note: Grounds Microsoft.Extensions.Logging event levels and structured logs.
    - title: .NET MAUI app lifecycle
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/app-lifecycle
      note: Grounds launch, resume and crash-recovery lifecycle hooks.
    - title: GDPR Article 9
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds treating health and fitness records as special-category data.
