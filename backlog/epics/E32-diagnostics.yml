    testing:
    - CI scan for banned packages and service registrations.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: Logging in .NET
      url: https://learn.microsoft.com/dotnet/core/extensions/logging
      note: Grounds Microsoft.Extensions.Logging event levels and structured logs.
    - title: .NET MAUI file system helpers
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-system-helpers
      note: Grounds AppDataDirectory, CacheDirectory and safe local file placement.
- key: F32.02
  title: Share reviewable diagnostic bundles
  wave: 3
  summary: >-
    Package technical diagnostics locally and require the user to inspect the bundle before OS sharing.
  outcome: >-
    Support receives useful files only when the user explicitly chooses to share them.
  concerns: [privacy, a11y]
  dependsOn: [F32.01]
  stories:
  - key: S32.02.01
    title: Generate a redacted diagnostic bundle
    wave: 3
    size: m
    platforms: [android, ios]
    persona: returner
    concerns: [privacy]
    userStory:
      asA: returner user
      iWant: Forge to package technical diagnostics locally
      soThat: I can decide whether to share them
    requirements:
    - Bundle includes app version, coarse device info, OS version, schema version, recent logs, breadcrumbs and 
      performance summaries.
    - Bundle excludes workouts, foods, meals, hydration, body metrics and notes by default.
    - Generation completes in under 10 seconds and unshared bundles are deleted after 24 hours.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
    - id: AC1
      given: maximum retained diagnostics exist
      when: Generate bundle runs
      then: a zip file is created in under 10 seconds
    - id: AC2
      given: the user has logged health and nutrition data
      when: the bundle is scanned
      then: no workout names, food names, body metric values or notes are present
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Implement DiagnosticBundleService with manifest.json and redacted technical files only. Return a local file for review;
        do not call Share or network APIs from generation.  Implement this in src/Forge.Core/Diagnostics/IDiagnosticBundleService.cs
        using Microsoft.Extensions.Logging, app-private cache or AppDataDirectory storage, and DevExpress review controls
        where UI is needed. Use allow-listed typed event properties such as route, status, duration bucket and file size,
        never arbitrary message templates or domain objects. Enforce rotation, retention and local-only sharing through the
        OS sheet. A careless implementation would log exception.ToString with notes, keep unlimited files, or add an automatic
        crash upload that breaks Forge local-first privacy.
      touches: [src/Forge.Core/Diagnostics/IDiagnosticBundleService.cs]
      apis:
      - System.IO.Compression.ZipArchive
      - Microsoft.Maui.Devices.DeviceInfo
    testing:
    - Bundle generation time and redaction fixture tests.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: Logging in .NET
      url: https://learn.microsoft.com/dotnet/core/extensions/logging
      note: Grounds Microsoft.Extensions.Logging event levels and structured logs.
    - title: .NET MAUI share files
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/data/share
      note: Grounds opt-in OS share flows rather than automatic upload.
    - title: ZipArchive class
      url: https://learn.microsoft.com/dotnet/api/system.io.compression.ziparchive
      note: Grounds local archive packaging for backups and bundles.
    - title: GDPR Article 9
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds treating health and fitness records as special-category data.
  - key: S32.02.02
    title: Review bundle contents before sharing
    wave: 3
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [privacy, a11y]
    userStory:
      asA: newcomer user
      iWant: to see exactly what Forge will share
      soThat: I remain in control of private data
    requirements:
    - Review lists every bundle file with size, category and inclusion reason.
    - The user can preview redacted text files.
    - Share is disabled until generation and redaction scan pass.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
