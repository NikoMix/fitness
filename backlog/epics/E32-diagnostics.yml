      given: a bundle exists
      when: review opens
      then: every zip file appears with name, size and inclusion reason
    - id: AC2
      given: redaction scan fails
      when: review renders
      then: Share is disabled and the failing category is shown without matched value
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Use DXCollectionView for bundle files and DXPopup for redacted text previews. Keep share as a separate explicit command
        after review passes.  Implement this in src/Forge.App/Features/Diagnostics/DiagnosticBundleReviewPage.xaml using Microsoft.Extensions.Logging,
        app-private cache or AppDataDirectory storage, and DevExpress review controls where UI is needed. Use allow-listed
        typed event properties such as route, status, duration bucket and file size, never arbitrary message templates or
        domain objects. Enforce rotation, retention and local-only sharing through the OS sheet. A careless implementation
        would log exception.ToString with notes, keep unlimited files, or add an automatic crash upload that breaks Forge
        local-first privacy.
      touches: [src/Forge.App/Features/Diagnostics/DiagnosticBundleReviewPage.xaml]
      devexpress:
      - DXCollectionView
      - DXPopup
      - DXButton
      apis:
      - Microsoft.Maui.Accessibility.SemanticScreenReader
    testing:
    - UI tests for disabled Share and accessible file rows.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: DevExpress MAUI CollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Grounds virtualised review, history and diagnostics lists.
    - title: DevExpress MAUI Popup
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.DXPopup
      note: Grounds explicit confirmations and review dialogs.
    - title: .NET MAUI accessibility
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/accessibility
      note: Grounds accessible review and confirmation screens.
