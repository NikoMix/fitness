        app-private cache or AppDataDirectory storage, and DevExpress review controls where UI is needed. Use allow-listed
        typed event properties such as route, status, duration bucket and file size, never arbitrary message templates or
        domain objects. Enforce rotation, retention and local-only sharing through the OS sheet. A careless implementation
        would log exception.ToString with notes, keep unlimited files, or add an automatic crash upload that breaks Forge
