  - key: S32.05.03
    title: Require local verification for sensitive diagnostics
    wave: 3
    size: m
    platforms: [android, ios]
    persona: team
    concerns: [security, privacy]
    userStory:
      asA: Forge team member
      iWant: sensitive screens gated again
      soThat: metadata is not exposed after a casual phone handoff
    requirements:
    - Database inspector, data inventory and bundle review require recent device unlock or biometric confirmation where 
      available.
    - Authentication success is cached for no more than 5 minutes.
    - Failure leaves the target screen closed.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
    - id: AC1
      given: debug menu is unlocked with no recent verification
      when: database inspector is opened
      then: a platform authentication prompt appears first
    - id: AC2
      given: authentication is cancelled
      when: the prompt closes
      then: inspector remains closed and no metadata is shown
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Create ILocalUserVerificationService with platform implementations in Forge.App. This gate protects support surfaces
        but does not replace SQLCipher or device lock.  Implement this in src/Forge.Core/Security/ILocalUserVerificationService.cs
        using Microsoft.Extensions.Logging, app-private cache or AppDataDirectory storage, and DevExpress review controls
        where UI is needed. Use allow-listed typed event properties such as route, status, duration bucket and file size,
        never arbitrary message templates or domain objects. Enforce rotation, retention and local-only sharing through the
        OS sheet. A careless implementation would log exception.ToString with notes, keep unlimited files, or add an automatic
        crash upload that breaks Forge local-first privacy.
      touches: [src/Forge.Core/Security/ILocalUserVerificationService.cs]
      apis:
      - AndroidX.Biometric
      - LocalAuthentication.LAContext
    testing:
    - Cache-expiry unit tests and manual platform authentication tests.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    openQuestions:
    - Confirm the final MAUI 10 biometric dependency before implementation.
    grounding:
    - title: GDPR Article 9
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds treating health and fitness records as special-category data.
    - title: .NET MAUI accessibility
