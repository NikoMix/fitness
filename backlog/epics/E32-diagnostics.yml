- key: F32.04
  title: Inspect data and storage transparently
  wave: 3
  summary: >-
    Expose what Forge stores and how much space it uses through screens backed by real database and file-system measurements.
  outcome: >-
    Users can verify local data categories, storage usage and integrity status without hard-coded promises.
  concerns: [privacy, a11y]
  dependsOn: [E04]
  stories:
  - key: S32.04.01
    title: Show what data Forge holds about me
    wave: 3
    size: m
    platforms: [android, ios]
    persona: newcomer
    concerns: [privacy, a11y]
    userStory:
      asA: newcomer user
      iWant: to see actual categories Forge stores
      soThat: I can trust the local-only privacy story
    requirements:
    - Counts are read from the real database for workouts, sets, meals, hydration, body metrics, achievements, imports 
      and backups.
    - Empty categories show zero rather than being hidden.
    - Visible counts refresh within 500 ms after data changes.
    - No health data, food entries, body metrics or free-text notes may appear in diagnostics at any log level.
    - Diagnostic files must remain local, bounded by rotation or retention limits, and shared only after explicit review
      for the current incident.
    acceptanceCriteria:
    - id: AC1
      given: the database has 3 workouts, 27 sets and 0 body metrics
      when: inventory opens
      then: those exact counts are shown
    - id: AC2
      given: the screen is visible
      when: a hydration entry is saved
      then: hydration count updates within 500 ms
    - id: AC3
      given: diagnostics are generated after workouts, meals, body metrics and notes exist
      when: all log, trace and bundle files are scanned
      then: zero health values, food names, body metric values or free-text notes are present
    - id: AC4
      given: the user does not tap the explicit Share action for this incident
      when: diagnostics are produced and reviewed
      then: Forge performs no upload, no background retry and no automatic recipient selection
    implementation:
      notes: >-
        Implement IDataInventoryService over real Infrastructure queries and render with DXCollectionView. The service defines
        categories so tests catch schema additions.  Implement this in src/Forge.Core/Privacy/IDataInventoryService.cs
        using Microsoft.Extensions.Logging, app-private cache or AppDataDirectory storage, and DevExpress review controls
        where UI is needed. Use allow-listed typed event properties such as route, status, duration bucket and file size,
        never arbitrary message templates or domain objects. Enforce rotation, retention and local-only sharing through the
        OS sheet. A careless implementation would log exception.ToString with notes, keep unlimited files, or add an automatic
        crash upload that breaks Forge local-first privacy.
      touches: [src/Forge.Core/Privacy/IDataInventoryService.cs]
      devexpress:
      - DXCollectionView
      - DXButton
      apis:
      - Microsoft.EntityFrameworkCore
    testing:
    - Integration test comparing inventory counts with seeded rows.
    - Redaction fixture scanning every retained diagnostic artifact for seeded health, food, body metric and note 
      values.
    - No-network test proving diagnostics never transmit before explicit OS share action.
    grounding:
    - title: EF Core SQLite provider
      url: https://learn.microsoft.com/ef/core/providers/sqlite/
      note: Grounds the local SQLite provider used by ForgeDbContext.
    - title: SQLite PRAGMA statements
      url: https://www.sqlite.org/pragma.html
      note: Grounds quick_check, integrity_check and SQLite runtime checks.
    - title: GDPR Article 9
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
      note: Grounds treating health and fitness records as special-category data.
