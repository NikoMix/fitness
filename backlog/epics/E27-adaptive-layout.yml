    requirements:
    - Current route, selected item key, scroll offset and focused input restore after orientation change.
    - Rotation layout recalculation completes within 250 ms after new display info.
    - The same state restoration path runs after app suspend and resume when size class changes.
    - Adaptive breakpoints must be defined in device-independent units as compact below 600, medium from
      600 to 839 and expanded at 840 or wider.
    - Core flows must render without truncation, clipping or overlap at 200 percent text scaling on both
      phone and tablet form factors.
    - Layouts must respect safe areas on iOS notched devices, Dynamic Island devices and Android gesture-navigation
      insets in portrait and landscape.
    - Phone portrait remains the canonical source of content and actions; tablet, foldable and landscape
      layouts may rearrange but must not remove required functionality.
    acceptanceCriteria:
    - id: AC1
      given: the user is editing reps in a workout row
      when: the phone rotates to landscape and back to portrait
      then: the same row and input remain focused with the typed value intact
    - id: AC2
      given: the app resumes on a tablet after size changed
      when: size class recalculates
      then: the selected item and scroll offset restore within 250 ms
    - id: AC3
