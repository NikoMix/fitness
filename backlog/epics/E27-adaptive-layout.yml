key: E27
title: Adaptive Layout and Responsive Experience
domain: design
wave: 2
summary: >-
  Forge v1 is phone-first, but users will still open it on tablets, iPads, landscape phones and foldables.
  This epic creates adaptive layout rules, breakpoint services, safe-area handling, text scaling and reachability
  patterns so the app never feels broken outside phone portrait.
problem: >-
  A mobile-only app that assumes one narrow portrait viewport will fail in real use: keyboards cover forms,
  notches hide controls, tablets waste space, foldables split content at hinges, large text truncates
  labels and landscape workout or video modes become awkward.
outcome: >-
  Forge keeps phone portrait as the primary target while adapting cleanly to tablet, iPad, landscape and
  foldable postures on Android and iOS, with safe insets, keyboard avoidance, 200 percent text scaling
  and lower-third primary actions.
successMetrics:
- Core Wave 2 screens pass layout tests at 360 x 800, 430 x 932, 768 x 1024 and landscape phone viewports
  with no clipped critical content.
- Exercise library and nutrition screens support one-pane phone and two-pane tablet layouts with selection
  state preserved across rotation.
- All validated input forms avoid the soft keyboard using dx:SafeKeyboardAreaView or MAUI SafeAreaEdges
  with focused controls fully visible.
- At 200 percent text scale, primary flows complete with no horizontal scrolling and no critical text
  truncation.
nonGoals:
- No desktop-specific UX in waves 1 through 5.
- No multi-window productivity mode in v1.
- No separate tablet product surface that diverges from phone functionality.
risks:
- risk: >-
    Tablet and foldable work becomes a second design system instead of adaptive reuse.
  mitigation: >-
    Define breakpoint tokens and adaptive containers once, then require feature screens to use those primitives.
  severity: medium
- risk: >-
    Large text and safe-area fixes are left until late when every screen needs rework.
  mitigation: >-
    Add automated gallery and core-flow layout tests at 200 percent text scale in Wave 2.
  severity: high
grounding:
- title: .NET MAUI safe area layout
  url: https://learn.microsoft.com/dotnet/maui/user-interface/safe-area?view=net-maui-10.0
  note: >-
    Documents SafeAreaEdges for notches, system bars and keyboard-aware layouts in .NET 10.
- title: DevExpress SafeKeyboardAreaView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Core.SafeKeyboardAreaView
  note: >-
    DevExpress container that shrinks vertically to avoid the device keyboard.
- title: .NET MAUI device display information
  url: https://learn.microsoft.com/dotnet/maui/platform-integration/device/display?view=net-maui-10.0
  note: Provides screen metrics and orientation change notifications.
- title: .NET MAUI TwoPaneView layout
  url: https://learn.microsoft.com/dotnet/maui/user-interface/controls/twopaneview?view=net-maui-10.0
  note: Documents foldable and responsive two-pane layout support.
- title: .NET MAUI customize UI by device idiom
  url: https://learn.microsoft.com/dotnet/maui/platform-integration/customize-ui-appearance?view=net-maui-10.0
  note: Covers OnIdiom and device idiom based UI adaptations.
features:
- key: F27.01
  title: Establish breakpoint and orientation foundations
  wave: 2
  summary: >-
    Define responsive rules and services that all screens use instead of hard-coding device widths or
    assuming portrait orientation.
  outcome: >-
    Feature teams can bind to semantic size classes and orientation states from reusable adaptive containers.
  concerns:
  - a11y
  stories:
  - key: S27.01.01
    title: Define Forge breakpoint and size-class tokens
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer working on Forge
      iWant: shared breakpoint tokens and size classes
      soThat: every feature adapts at the same thresholds
    requirements:
    - Breakpoints include compact under 600 dp, medium from 600 to 839 dp and expanded at 840 dp or wider.
    - Size class calculation uses effective width after safe-area insets, not raw physical pixels.
    - Breakpoint changes raise notifications within 100 ms of rotation or size change.
    - Adaptive breakpoints must be defined in device-independent units as compact below 600, medium from
      600 to 839 and expanded at 840 or wider.
    - Core flows must render without truncation, clipping or overlap at 200 percent text scaling on both
      phone and tablet form factors.
    - Layouts must respect safe areas on iOS notched devices, Dynamic Island devices and Android gesture-navigation
      insets in portrait and landscape.
    - Phone portrait remains the canonical source of content and actions; tablet, foldable and landscape
      layouts may rearrange but must not remove required functionality.
    acceptanceCriteria:
    - id: AC1
      given: a viewport has 599 dp effective width
      when: the breakpoint service evaluates it
      then: it reports compact size class
    - id: AC2
      given: the device rotates from portrait to landscape
      when: effective width crosses 600 dp
      then: subscribers receive one size-class change notification within 100 ms
    - id: AC3
      given: >-
        the viewport width is tested at 359, 600, 839 and 840 device-independent units in portrait and
        landscape
      when: the story layout enters compact, medium and expanded states
      then: >-
        VisualStateManager selects the expected state and all primary content remains reachable without
        horizontal scrolling
    - id: AC4
      given: >-
        the story layout runs at 200 percent text scaling on a notched iPhone and an Android gesture-navigation
        device
      when: >-
        forms, actions and navigation bars are displayed with the keyboard hidden and shown
      then: >-
        there is no truncation, overlap or unsafe-area collision and dx:SafeKeyboardAreaView keeps focused
        fields visible
    implementation:
      notes: >-
        Implement IAdaptiveLayoutService in Forge.App/Adaptive using DeviceDisplay.Current and page safe-area
        information from the view layer. Expose Compact, Medium and Expanded to XAML behaviours; keep
        MAUI device APIs out of Forge.Core. Implement Define Forge breakpoint and size-class tokens
        in Forge.App/Layout with an adaptive helper named S270101LayoutProfile plus XAML styles in Resources/Styles/AdaptiveLayout.xaml.
        Use OnIdiom for phone and tablet defaults, VisualStateManager for 600 and 840 device-independent-unit
        breakpoints, dx:SafeKeyboardAreaView for keyboard-safe forms, and DevExpress DXStackLayout, DXDockLayout
        and DXBorder primitives. The tricky part is preserving the phone content model while rearranging
        panes around safe areas and text scaling. A careless implementation would fork pages per device,
        causing drift, clipped 200 percent text and broken notch or gesture insets.
      touches:
      - src/Forge.App/Adaptive
      - src/Forge.App/Layout
      - src/Forge.App/Resources/Styles/AdaptiveLayout.xaml
      - src/Forge.App/Features/DesignSystem/AdaptiveGallery
      devexpress:
      - DXDockLayout
      - DXStackLayout
      - dx:SafeKeyboardAreaView
      - DXBorder
      apis:
      - Microsoft.Maui.Devices.DeviceDisplay
      - Microsoft.Maui.Devices.DisplayInfo
      - OnIdiom
      - VisualStateManager
      - DeviceInfo.Idiom
      - Microsoft.Maui.Controls.PlatformConfiguration.iOSSpecific.Page.UseSafeArea
    testing:
    - Add an automated layout or behaviour test for the stated thresholds.
    - Add a gallery example covering happy path and edge state.
    - Add adaptive snapshot tests at 359, 600, 839 and 840 device-independent-unit widths in portrait
      and landscape.
    - Add 200 percent text-scaling and safe-area tests on notched iOS and Android gesture-navigation profiles.
    grounding:
    - title: .NET MAUI layouts
      url: https://learn.microsoft.com/dotnet/maui/user-interface/layouts/
      note: >-
        Documents MAUI layout containers and measurement behavior used for adaptive pages.
    - title: .NET MAUI platform and idiom appearance
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/customize-ui-appearance
      note: >-
        Documents OnIdiom and OnPlatform markup for varying UI by phone and tablet form factor.
    - title: .NET MAUI visual states
      url: https://learn.microsoft.com/dotnet/maui/user-interface/visual-states
      note: >-
        Documents VisualStateManager, which Forge uses for breakpoint-driven layout states.
    - title: DevExpress SafeKeyboardAreaView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Core.SafeKeyboardAreaView
      note: >-
        Documents the DevExpress keyboard-safe container required for adaptive form layouts.
