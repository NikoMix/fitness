  - key: F27.06
    title: 'Document adaptive layout rules and equivalence'
    wave: 2
    summary: >-
      Keep adaptive behaviour understandable and prevent larger-screen layouts from silently dropping actions available on phone.
    outcome: >-
      Later feature teams have measurable adaptive rules and tests that preserve capability equivalence.
    concerns: [quality]
    stories:
      - key: S27.06.01
        title: 'Keep tablet and foldable layouts content-equivalent to phone'
        wave: 2
        size: m
        platforms: [android, ios]
        persona: team
        concerns: [quality]
        userStory:
          asA: 'developer working on Forge'
          iWant: 'adaptive layouts to expose the same capabilities'
          soThat: 'larger screens do not drift into unsupported variants'
        requirements:
          - 'Every primary action available in compact phone layout is available in medium, expanded and foldable layouts.'
          - 'Adaptive layout tests compare action inventories by automation identifier across size classes.'
          - 'Any deliberate omission requires an exception with owner and expiry.'
        acceptanceCriteria:
          - id: AC1
            given: 'exercise detail renders in compact and expanded layouts'
            when: 'automation identifiers are collected'
            then: 'the set of primary and secondary actions is identical across both layouts'
          - id: AC2
            given: 'a feature hides a phone action on tablet'
            when: 'action inventory tests run'
            then: 'the test fails unless the omission is listed in an approved exception file'
        implementation:
          notes: >-
            Add ActionInventoryTestHelpers that crawl named interactive elements in UI tests. Require adaptive containers to preserve AutomationId values when moving content between panes.
          touches:
            - 'src/Forge.App/DesignTests'
          devexpress:
            - 'DXButton'
            - 'DXCollectionView'
            - 'BottomSheet'
        testing:
          - 'Add an automated layout or behaviour test for the stated thresholds.'
          - 'Add a gallery example covering happy path and edge state.'
      - key: S27.06.02
        title: 'Document adaptive layout rules and exceptions'
        wave: 2
        size: s
        platforms: [android, ios]
        persona: team
        userStory:
          asA: 'developer working on Forge'
          iWant: 'adaptive layout rules with measurable examples'
          soThat: 'I do not re-litigate breakpoints or reachability on every screen'
        requirements:
          - 'Documentation covers breakpoints, pane selection, landscape, foldables, keyboard avoidance, text scaling and primary action placement.'
          - 'Each rule names the automated test or manual checklist that enforces it.'
          - 'Exceptions require product owner approval and an expiry or follow-up story.'
        acceptanceCriteria:
          - id: AC1
            given: 'the adaptive layout README is opened'
            when: 'a developer searches for keyboard, foldable, large text or lower third'
            then: 'each term has a rule, example and enforcement reference'
          - id: AC2
            given: 'an exception file has an entry without owner or expiry'
            when: 'adaptive documentation tests run'
            then: 'the test fails and reports the incomplete exception'
        implementation:
          notes: >-
            Place adaptive documentation near src/Forge.App/Adaptive so it evolves with code. Link to gallery pages, test classes and example screens rather than static screenshots only.
          touches:
            - 'src/Forge.App/Adaptive'
          devexpress:
            - 'SafeKeyboardAreaView'
            - 'DXDockLayout'
            - 'DXCollectionView'
        testing:
          - 'Add an automated layout or behaviour test for the stated thresholds.'
          - 'Add a gallery example covering happy path and edge state.'
      - key: S27.06.03
        title: 'Add adaptive regression snapshots for representative viewports'
        wave: 2
        size: m
        platforms: [android, ios]
        persona: team
        concerns: [quality]
        userStory:
          asA: 'developer working on Forge'
          iWant: 'viewport regressions to be caught automatically'
          soThat: 'layout bugs are found before device testing'
        requirements:
          - 'Snapshots cover 360 x 800, 430 x 932, 768 x 1024 and landscape phone viewports.'
          - 'Diffs over 0.5 percent fail unless approved with a linked design-system change.'
          - 'Snapshots include text scale 100 percent and 200 percent for at least compact phone layouts.'
        acceptanceCriteria:
          - id: AC1
            given: 'a component shifts a primary action outside the lower-third zone'
            when: 'adaptive snapshots and layout assertions run'
            then: 'the test fails and reports the affected viewport'
          - id: AC2
            given: 'no adaptive files changed'
            when: 'snapshot tests run twice on the same runner'
            then: 'diffs remain below 0.1 percent pixels'
        implementation:
          notes: >-
            Extend the E02 visual regression workflow with adaptive viewport sets and store baselines under tests/Forge.App.Design.Tests/AdaptiveBaselines. Pair pixel diffs with semantic layout assertions for action zones and clipped text.
          touches:
            - 'src/Forge.App/DesignTests'
          devexpress:
            - 'DXCollectionView'
            - 'DXBorder'
            - 'DXButton'
        testing:
          - 'Add an automated layout or behaviour test for the stated thresholds.'
          - 'Add a gallery example covering happy path and edge state.'
