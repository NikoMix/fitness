      - DXStackLayout
      - DXDockLayout
      - DXBorder
      apis:
      - Microsoft.Maui.Devices.DeviceDisplay
      - OnIdiom
      - VisualStateManager
      - DeviceInfo.Idiom
      - Microsoft.Maui.Controls.PlatformConfiguration.iOSSpecific.Page.UseSafeArea
