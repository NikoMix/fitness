key: E03
title: Motion, Animation and Micro-interactions
domain: design
wave: 2
summary: >-
  Forge should feel polished, responsive and calm, not static or distracting. This epic defines motion
  tokens, transitions, feedback, data animations, celebrations and loading states while enforcing reduced-motion
  accessibility, non-blocking input and the 60 fps performance budget.
problem: >-
  Users explicitly expect beautiful, clean animations, but unmanaged motion can make a fitness app feel
  slow, block set logging, trigger motion sensitivity or miss platform accessibility settings. Without
  a shared motion system, every feature will invent timing and easing.
outcome: >-
  Forge has a consistent motion language that makes navigation, progress and achievements feel alive,
  honours OS Reduce Motion throughout, never blocks input and stays within a 16.6 ms frame budget during
  animation and scroll.
successMetrics:
- All motion-enabled components complete routine transitions within documented token durations and expose
  a reduced-motion path.
- Animation and scrolling scenarios in the gallery sustain 60 fps with no frame exceeding 16.6 ms on a
  Pixel 6a class Android device.
- 100 percent of gesture and button feedback returns control to the input loop within 100 ms.
- Zero essential information is available only through animation in the reduced-motion gallery run.
nonGoals:
- No game-like animation layer or physics engine.
- No live pose-estimation or camera-based movement analysis.
- No Lottie dependency through DevExpress; celebration animation uses SkiaSharp.Extended.UI.Maui only
  where needed.
risks:
- risk: >-
    Beautiful transitions delay workout logging, making the app feel worse during the core loop.
  mitigation: >-
    Motion services must fire-and-forget non-critical animations, expose cancellation and prove input
    responsiveness under load.
  severity: high
- risk: Reduced-motion support misses shimmer or count-up effects.
  mitigation: >-
    Centralize motion permission in one IMotionSettings service and require every animation helper to
    consume it.
  severity: high
grounding:
- title: .NET MAUI basic animation
  url: https://learn.microsoft.com/dotnet/maui/user-interface/animation/basic?view=net-maui-10.0
  note: >-
    Documents MAUI animation methods, cancellation and Android behaviour when system animations are disabled.
- title: .NET MAUI custom animation
  url: https://learn.microsoft.com/dotnet/maui/user-interface/animation/custom?view=net-maui-10.0
  note: Supports custom progress, colour and compound animation scenarios.
- title: UIAccessibility IsReduceMotionEnabled
  url: https://learn.microsoft.com/dotnet/api/uikit.uiaccessibility.isreducemotionenabled?view=net-ios-26.5-10.0
  note: iOS API for detecting Reduce Motion.
- title: DevExpress CollectionView pull-to-refresh
  url: https://docs.devexpress.com/MAUI/403332
  note: Documents pull-to-refresh support used by loading micro-interactions.
- title: SkiaSharp.Extended.UI.Maui NuGet
  url: https://www.nuget.org/packages/SkiaSharp.Extended.UI.Maui
  note: >-
    Sanctioned fallback package for Lottie-style celebration animation gaps.
features:
- key: F03.01
  title: Establish motion governance and reduced-motion support
  wave: 2
  summary: >-
    Create the tokens, services and measurement hooks that every motion story uses, with reduced motion
    treated as a mandatory accessibility input rather than a preference toggle.
  outcome: >-
    Motion behaviour is predictable, centrally controlled and measurable before product teams add page-specific
    transitions.
  concerns:
  - a11y
  - perf
  stories:
  - key: S03.01.01
    title: Define motion duration and easing tokens
    wave: 2
    size: s
    platforms:
    - android
    - ios
    persona: team
    concerns:
    - perf
    userStory:
      asA: developer working on Forge
      iWant: named duration and easing tokens
      soThat: the app feels consistent without copying magic numbers
    requirements:
    - Motion tokens define instant, fast, standard, slow and celebration durations with numeric millisecond
      values.
    - Easing tokens define standard, emphasized, decelerate, accelerate and linear curves.
    - No animation in Forge.App may hard-code a duration outside MotionTokens except in tests.
    - 'Motion defaults must use concrete tokens: 200 ms ease-out for entry, 150 ms ease-in for exit, 120
      ms for press feedback and no repeating animation longer than 1000 ms without an explicit stop condition.'
    - Every animation path must honour the operating system Reduce Motion setting by switching to an instant
      state change or opacity-only transition under 80 ms.
    - Animations must run asynchronously and must never disable scrolling, tapping, hardware back or form
      input while they are in progress.
    - Animation helpers must cancel cleanly when the page disappears, data refreshes or the user repeats
      the triggering gesture.
    acceptanceCriteria:
    - id: AC1
      given: source code under src/Forge.App is scanned
      when: an animation method uses a literal duration outside MotionTokens
      then: the lint test fails with the file path and method name
    - id: AC2
      given: the motion gallery renders token examples
      when: fast, standard and slow examples are timed
      then: each completes within 16 ms of its documented token duration
    - id: AC3
      given: >-
        the operating system Reduce Motion setting is enabled before Forge starts
      when: the story animation is triggered from the relevant screen
      then: >-
        Forge uses an instant state change or opacity-only fallback under 80 ms and no translation, scale
        or parallax motion occurs
    - id: AC4
      given: >-
        the story animation is running with its configured 200 ms entry or 150 ms exit duration
      when: >-
        the user taps another enabled control, scrolls the list or presses hardware back
      then: >-
        the input is processed immediately and the animation is cancelled or completed without blocking
        the UI thread
    implementation:
      notes: >-
        Add MotionTokens in src/Forge.App/Motion with TimeSpan and uint values usable from C# helpers.
        Provide XAML resources only as projections, keeping the source of truth in code for tests. Implement
        Define motion duration and easing tokens in Forge.App/Motion with a S030101MotionProfile consumed
        by page behaviors, not by ViewModels. Use .NET MAUI ViewExtensions, Easing.CubicOut for 200 ms
        entries, Easing.CubicIn for 150 ms exits and CancellationToken-aware helper methods. The tricky
        part is honoring platform Reduce Motion and lifecycle cancellation while keeping controls interactive.
        A careless implementation would await animations on command paths, block input, or leave orphaned
        animations running after navigation.
      touches:
      - src/Forge.App/Motion
      - src/Forge.App/Behaviors
      - src/Forge.App/Features/DesignSystem/MotionGallery
      devexpress:
      - DXBorder
      - DXButton
      - DXCollectionView
      - DXPopup
      - RadialGauge
      apis:
      - Microsoft.Maui.Controls.ViewExtensions
      - Microsoft.Maui.Easing
      - Animation.Cancel
      - SkiaSharp.Extended.UI.Maui
    testing:
    - Add an automated layout or behaviour test for the stated thresholds.
    - Add a gallery example covering happy path and edge state.
    - Add UI tests that enable Reduce Motion and verify the animation falls back to an instant or opacity-only
      transition under 80 ms.
    - Add interaction tests that tap, scroll and navigate during the animation and assert commands are
      not blocked.
    grounding:
    - title: .NET MAUI basic animation
      url: https://learn.microsoft.com/dotnet/maui/user-interface/animation/basic
      note: >-
        Documents ViewExtensions animation methods, cancellation and Task-based animation flow used by
        Forge motion helpers.
    - title: 'Apple Human Interface Guidelines: Motion'
      url: https://developer.apple.com/design/human-interface-guidelines/motion
      note: >-
        Grounds platform expectations for purposeful motion and reduced-motion alternatives on iOS.
    - title: Android view animation guidance
      url: https://developer.android.com/develop/ui/views/animations/reveal-or-hide-view
      note: >-
        Grounds Android show, hide and crossfade motion patterns used for micro-interactions.
