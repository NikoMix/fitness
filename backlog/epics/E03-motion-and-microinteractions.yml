    size: m
    platforms:
    - android
    - ios
    persona: cutter
    concerns:
    - perf
    - a11y
    userStory:
      asA: Priya browsing meal search results
      iWant: new results to appear smoothly
      soThat: I can see the list update without losing my place
    requirements:
    - Stagger applies only to the first 20 newly visible items and never to recycled rows during fast
      scroll.
    - Per-item delay is capped at 20 ms and total stagger duration is capped at 240 ms.
    - Reduced-motion mode renders all rows immediately with no stagger.
    - 'Motion defaults must use concrete tokens: 200 ms ease-out for entry, 150 ms ease-in for exit, 120
      ms for press feedback and no repeating animation longer than 1000 ms without an explicit stop condition.'
    - Every animation path must honour the operating system Reduce Motion setting by switching to an instant
      state change or opacity-only transition under 80 ms.
    - Animations must run asynchronously and must never disable scrolling, tapping, hardware back or form
      input while they are in progress.
    - Animation helpers must cancel cleanly when the page disappears, data refreshes or the user repeats
      the triggering gesture.
    acceptanceCriteria:
    - id: AC1
      given: 60 search results arrive
      when: the list first renders
      then: >-
        only the first 20 visible rows use stagger and the last stagger starts no later than 240 ms
    - id: AC2
      given: the user flings a list while rows recycle
      when: recycled rows enter the viewport
      then: they do not replay entrance animation
    - id: AC3
      given: >-
        the operating system Reduce Motion setting is enabled before Forge starts
      when: the story animation is triggered from the relevant screen
      then: >-
        Forge uses an instant state change or opacity-only fallback under 80 ms and no translation, scale
        or parallax motion occurs
