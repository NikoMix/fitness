  - key: S03.01.03
    title: Ensure animations never block input
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: enthusiast
    concerns:
    - perf
    userStory:
      asA: Alex logging sets quickly
      iWant: animations to never delay my next tap
      soThat: motion feels polished without slowing workouts
    requirements:
    - Non-critical animations are cancelable and do not await on the UI command path.
    - Any animation attached to a button press returns command execution to the caller within 100 ms.
    - Navigating away cancels animations tied to the old page and leaves elements in a valid final or
      neutral state.
    - 'Motion defaults must use concrete tokens: 200 ms ease-out for entry, 150 ms ease-in for exit, 120
      ms for press feedback and no repeating animation longer than 1000 ms without an explicit stop condition.'
    - Every animation path must honour the operating system Reduce Motion setting by switching to an instant
      state change or opacity-only transition under 80 ms.
    - Animations must run asynchronously and must never disable scrolling, tapping, hardware back or form
      input while they are in progress.
    - Animation helpers must cancel cleanly when the page disappears, data refreshes or the user repeats
      the triggering gesture.
    acceptanceCriteria:
    - id: AC1
      given: a workout set is completed and a micro-animation starts
      when: the user immediately taps Add Set within 100 ms
      then: >-
        the tap is accepted and a new set row appears without waiting for animation completion
    - id: AC2
      given: a page transition is in progress
      when: Android hardware back is triggered
      then: >-
        the transition cancels within 100 ms and navigation state remains consistent
    - id: AC3
      given: >-
        the operating system Reduce Motion setting is enabled before Forge starts
      when: the story animation is triggered from the relevant screen
      then: >-
        Forge uses an instant state change or opacity-only fallback under 80 ms and no translation, scale
        or parallax motion occurs
    - id: AC4
      given: >-
        the story animation is running with its configured 200 ms entry or 150 ms exit duration
      when: >-
        the user taps another enabled control, scrolls the list or presses hardware back
      then: >-
        the input is processed immediately and the animation is cancelled or completed without blocking
        the UI thread
    implementation:
      notes: >-
        Build MotionRunner to track animations by owner page and expose cancellation. Command handlers
        should start non-essential animations without awaiting them, while structural navigation awaits
        only the minimum transition setup. Implement Ensure animations never block input in Forge.App/Motion
        with a S030103MotionProfile consumed by page behaviors, not by ViewModels. Use .NET MAUI ViewExtensions,
        Easing.CubicOut for 200 ms entries, Easing.CubicIn for 150 ms exits and CancellationToken-aware
        helper methods. The tricky part is honoring platform Reduce Motion and lifecycle cancellation
        while keeping controls interactive. A careless implementation would await animations on command
        paths, block input, or leave orphaned animations running after navigation.
      touches:
      - src/Forge.App/Motion
      - src/Forge.App/Behaviors
      - src/Forge.App/Features/DesignSystem/MotionGallery
      devexpress:
      - DXButton
      - DXCollectionView
      - TabView
      - DXPopup
      - RadialGauge
      apis:
      - Microsoft.Maui.Controls.ViewExtensions.CancelAnimations
      - Microsoft.Maui.Controls.ViewExtensions
      - Microsoft.Maui.Easing
      - Animation.Cancel
      - SkiaSharp.Extended.UI.Maui
    testing:
    - Add an automated layout or behaviour test for the stated thresholds.
    - Add a gallery example covering happy path and edge state.
    - Add UI tests that enable Reduce Motion and verify the animation falls back to an instant or opacity-only
      transition under 80 ms.
    - Add interaction tests that tap, scroll and navigate during the animation and assert commands are
      not blocked.
