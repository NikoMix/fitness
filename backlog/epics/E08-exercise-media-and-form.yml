key: E08
title: Exercise Media, Video and Form Guidance
domain: training
wave: 3
summary: 'Forge''s exercise library becomes far more useful when text guidance is paired with careful media: short demonstrations,
  annotated stills, timed cues, tempo helpers and private side-by-side form review. This epic delivers media without breaking
  the 40 MB Android APK budget or the local-only privacy promise.'
problem: Users can read exercise steps and still misunderstand range, setup, tempo or body position. If the app bundles hundreds
  of videos it becomes too large to install, but if it depends on network media it fails users in gyms, basements and data-saver
  mode.
outcome: Exercise details can show lightweight bundled essentials, on-demand demonstration media, accessible text fallbacks,
  annotated form guidance and strictly on-device user recordings with clear storage controls and no v1 pose-estimation claims.
successMetrics:
- The release Android per-ABI APK remains under 40 MB with all bundled exercise media included.
- Bundled media essentials add no more than 12 MB compressed to the base package.
- Downloaded demo playback starts within 1.0 s after the file is cached and within 3.0 s on a 10 Mbps connection.
- A user-recorded form check never creates a network request and stores video only in the app data directory.
nonGoals:
- No live coaching, remote coach review, social sharing or upload of user form videos in v1.
- No AI pose estimation, rep scoring or skeleton overlay in v1; that exploration is parked in wave 6.
- No desktop-specific media implementation in waves 1 to 5.
- No custom video transcoding service or Forge-hosted backend in v1.
risks:
- risk: Full video coverage for hundreds of exercises makes the app too large to install.
  mitigation: Bundle only a tiny essential set, prefer animated loops and stills, and download full video on demand with cache
    limits.
  severity: critical
- risk: User-recorded videos are perceived as being uploaded or analysed remotely.
  mitigation: Make recording strictly local, show an on-device privacy notice, block network upload code paths and include
    tests that assert no HTTP request occurs.
  severity: high
- risk: Media playback controls are implemented with unsupported custom renderers.
  mitigation: Use CommunityToolkit.Maui.MediaElement as the documented fallback for the DevExpress media-control gap.
  severity: medium
dependsOn:
- E07
grounding:
- title: Forge architecture overview
  url: https://github.com/NikoMix/fitness/blob/main/docs/architecture/overview.md
  note: Documents CommunityToolkit.Maui.MediaElement as the sanctioned video fallback and the 40 MB Android APK budget.
- title: CommunityToolkit MAUI MediaElement
  url: https://learn.microsoft.com/dotnet/communitytoolkit/maui/views/mediaelement
  note: Official playback control used because DevExpress has no MAUI media control.
- title: Android Play Asset Delivery
  url: https://developer.android.com/guide/playcore/asset-delivery
  note: Candidate option for external asset packs if policy and app-type fit are confirmed.
- title: Apple On-Demand Resources
  url: https://developer.apple.com/library/archive/documentation/FileManagement/Conceptual/On_Demand_Resources_Guide/
  note: Candidate option for App Store-hosted media assets outside the base bundle.
features:
- key: F08.01
  title: Choose media asset strategy and manifest
  wave: 3
  summary: Decide how Forge references, packages, downloads and versions exercise media while staying inside the mobile package
    budget and local-only architecture.
  outcome: Media is addressed by a manifest, base package size is controlled, and unknown platform delivery questions are
    explicit.
  concerns:
  - perf
  - offline
  - store-blocker
  stories:
  - key: S08.01.01
    title: Define the v1 media size budget and delivery mix
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: team
    concerns:
    - perf
    - store-blocker
    userStory:
      asA: release manager
      iWant: a concrete media budget
      soThat: video quality cannot silently break the app-size budget
    requirements:
    - Strategy documents the arithmetic that 800 exercises times 6 MB full videos equals 4800 MB, which is 120 times the 40
      MB Android APK budget.
    - Base package bundles no more than 12 MB compressed media, reserved for essential safety loops and posters.
    - Full video demos are on-demand downloads or store-hosted resources and never required for text-only exercise detail.
    - Animated WebP or AVIF loops are preferred for common movement snippets where they are at least 70 percent smaller than
      equivalent MP4.
    - On-demand media resolves to a local file before playback through bundled resources, Android Play Asset Delivery, iOS
      On-Demand Resources or a checksum-verified cache.
    acceptanceCriteria:
    - id: AC1
      given: the release build pipeline measures packaged assets
      when: bundled exercise media exceeds 12 MB compressed
      then: the build fails before signing and reports the media asset total
    - id: AC2
      given: the media strategy document is reviewed
      when: the size arithmetic is inspected
      then: it includes 800 times 6 MB equals 4800 MB and compares it to the 40 MB APK budget
    - id: AC3
      given: the release Android build is produced with bundled exercise media
      when: the package budget check runs
      then: the per-ABI APK is below 40 MB and bundled exercise media is 12 MB or less compressed
    - id: AC4
      given: media is unavailable because it is not downloaded, was evicted or fails checksum validation
      when: the user opens the exercise detail or form screen
      then: a still image or text-only fallback is reachable in one tap and no crash occurs
    implementation:
      notes: >-
        Implement this around docs/media/exercise-media-strategy.md in Forge.App with manifest policy in Forge.Core
        and persisted metadata in Forge.Infrastructure where needed. Use CommunityToolkit.Maui.MediaElement for playback because
        the architecture documents DevExpress has no media control, then wrap it with DevExpress DXBorder, DXButton and DXCollectionView
        surfaces for consistent styling. Resolve bundled files, Android Play Asset Delivery packs, iOS On-Demand Resource
        tags and checksum-verified cache files to local paths before playback. The hard part is protecting the 40 MB Android
        APK budget while preserving captions, fallback and reduced-motion behaviour; a careless implementation would autoplay
        downloads, evict recordings, or send form-check video off device.
      touches:
      - docs/media/exercise-media-strategy.md
      - tools/media-budget/Program.cs
      - src/Forge.App/Resources/Raw/media-manifest.json
      devexpress:
      - DXBorder
      - DXButton
      - DXCollectionView
      apis:
      - CommunityToolkit.Maui.MediaElement
      - Microsoft.Maui.Storage.FileSystem
    testing:
    - CI test that fails when bundled media exceeds 12 MB.
    - CI package-budget test verifies the Android per-ABI APK remains under 40 MB and bundled exercise media remains 12 MB
      or less.
    - Offline and low-storage tests verify media falls back to still images or text-only guidance without network access.
    - Accessibility test verifies captions, text fallback, control labels and reduced-motion no-autoplay behaviour.
    grounding:
    - title: CommunityToolkit MAUI MediaElement
      url: https://learn.microsoft.com/dotnet/communitytoolkit/maui/views/mediaelement
      note: Official playback control used because DevExpress has no MAUI media component.
    - title: Android Play Asset Delivery
      url: https://developer.android.com/guide/playcore/asset-delivery
      note: Documents asset packs and on-demand delivery for media outside the base package.
    - title: Apple On-Demand Resources
      url: https://developer.apple.com/library/archive/documentation/FileManagement/Conceptual/On_Demand_Resources_Guide/
      note: Documents App Store hosted resources requested by tag outside the app bundle.
    - title: .NET MAUI file system helpers
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-system-helpers
      note: Documents cache and app data locations for downloaded media and user recordings.
    - title: WCAG 2.2 Non-text Content
      url: https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html
      note: Supports captions, text alternatives and non-video fallback requirements.
