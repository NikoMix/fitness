        for playback because the architecture documents DevExpress has no media control, then wrap it with DevExpress DXBorder,
        DXButton and DXCollectionView surfaces for consistent styling. Resolve bundled files, Android Play Asset Delivery
        packs, iOS On-Demand Resource tags and checksum-verified cache files to local paths before playback. The hard part
