- key: F08.02
  title: Play demonstration media on exercise details
  wave: 3
  summary: Add reliable video and loop playback to exercise details using the sanctioned MediaElement fallback and DevExpress
    layout controls.
  outcome: Users can watch short demonstrations with speed, scrub, zoom and angle controls without blocking text guidance.
  concerns:
  - devexpress
  - perf
  - a11y
  stories:
  - key: S08.02.01
    title: Embed MediaElement demonstration playback
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: newcomer
    concerns:
    - devexpress
    userStory:
      asA: Maya, learning a movement
      iWant: a playable demonstration on the exercise detail page
      soThat: I can see setup and rhythm before trying it
    requirements:
    - Video playback uses CommunityToolkit.Maui.MediaElement because DevExpress has no media control in the architecture gap
      list.
    - The player supports local cached file sources and packaged bundled sources.
    - Text instructions remain visible or reachable when media fails to load.
    - Playback errors surface within 1.0 s and include Retry and Text Guidance actions.
    - On-demand media resolves to a local file before playback through bundled resources, Android Play Asset Delivery, iOS
      On-Demand Resources or a checksum-verified cache.
    acceptanceCriteria:
    - id: AC1
      given: a cached demo file exists for Goblet Squat
      when: the detail page opens and the user taps Play
      then: playback starts within 1.0 s and no network request is made
    - id: AC2
      given: the media file is missing or corrupt
      when: the user taps Play
      then: an error state appears within 1.0 s with Retry and Text Guidance actions
    - id: AC3
      given: the release Android build is produced with bundled exercise media
      when: the package budget check runs
      then: the per-ABI APK is below 40 MB and bundled exercise media is 12 MB or less compressed
    - id: AC4
      given: media is unavailable because it is not downloaded, was evicted or fails checksum validation
      when: the user opens the exercise detail or form screen
      then: a still image or text-only fallback is reachable in one tap and no crash occurs
