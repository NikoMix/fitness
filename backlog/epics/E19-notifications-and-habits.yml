    - UI test that tapping the card opens the actionable filter.
    grounding:
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Grounds virtualized lists used for notification history, trophies, challenges and shop status rows.
