  - key: F18.02
    title: Build transparent readiness scoring and morning check-ins
    wave: 5
    summary: >-
      Combine sleep, recent load, subjective wellbeing and resting heart rate where available into
      a composite score that is useful because users can inspect and edit the inputs.
    outcome: >-
      Readiness is a transparent daily summary, not a black-box command.
    concerns: [devexpress, privacy]
    stories:
      - key: S18.02.01
        title: Capture morning energy, soreness, motivation and stress
        wave: 5
        size: m
        platforms: [android, ios]
        persona: newcomer
        concerns: [devexpress, a11y]
        userStory:
          asA: Maya, checking in before training
          iWant: a quick morning questionnaire
          soThat: Forge can adjust guidance to how I feel today
        requirements:
          - >-
            Check-in captures energy, whole-body soreness, motivation and stress on 1 to 5 scales
            in under 30 seconds.
          - >-
            The user can skip any day without penalty copy and can edit the current day until
            midnight local time.
          - >-
            Accessibility labels announce each scale value and direction clearly.
          - >-
            All recovery and readiness insights run on device from local data and show a visible input breakdown instead of an opaque score.
          - >-
            Correlation or association insights require at least 21 paired samples and use wording that says associated with, never caused by.
        acceptanceCriteria:
          - id: AC1
            given: a user selects 4 values and taps Save
            when: persistence completes
            then: the check-in is durable in SQLite within 200 ms and appears in today's readiness inputs
          - id: AC2
            given: a screen reader is active
            when: focus enters the energy scale
            then: the control announces the current value and that 5 is highest energy
          - id: AC3
            given: >-
              the user has no recovery data or has denied health permissions
            when: >-
              the screen opens
            then: >-
              a purposeful empty state appears within 400 ms with manual entry guidance and no broken chart or spinner
          - id: AC4
            given: >-
              a readiness or recovery score is displayed
            when: >-
              the user opens its details
            then: >-
              the UI shows each input, weight and contribution to the score rather than only a single number
          - id: AC5
            given: >-
              fewer than 21 paired samples exist for a sleep, readiness or performance comparison
            when: >-
              the insight engine evaluates correlations
            then: >-
              no correlation card is shown and the UI explains that 21 paired samples are required
        implementation:
          notes: >-
            Implement MorningCheckInService in Forge.Core/Recovery and render the entry surface with DevExpress editors or accessible selectable chips. Store one check-in per local date and avoid shame copy for skipped days. E17 can consume the resulting IReadinessSnapshotProvider for bad-day adjustments. Keep recovery logic in Forge.Core/Recovery and read sleep only through E12 IHealthDataService in Forge.Health. Readiness is deterministic: 35 percent sleep duration, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent RHR deviation. If RHR is missing, redistribute its weight proportionally and label it. Require 21 paired samples for associations and avoid causal language. Do not duplicate platform health access in UI.
          touches:
            - src/Forge.Core/Recovery/MorningCheckInService.cs
            - src/Forge.App/Features/Insights/Recovery/MorningCheckInPage.xaml
          devexpress:
            - dx:DXCollectionView
            - dx:RadialGauge
        testing:
          - Unit tests for one check-in per local date and edit window.
          - Manual screen reader test for all scale controls.

          - >-
            Unit tests for readiness weighting, missing-input redistribution and visible breakdown DTOs.
          - >-
            Unit test verifying correlation cards are suppressed below 21 paired samples and never use causal wording.
        grounding:
          - title: DevExpress MAUI DXCollectionView
            url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
            note: >-
              DevExpress virtualized list or card control for recovery entries, routines and explanatory breakdowns.
          - title: .NET MAUI accessibility semantic properties
            url: https://learn.microsoft.com/en-us/dotnet/maui/fundamentals/accessibility?view=net-maui-10.0
            note: >-
              Accessibility semantics are required so score breakdowns and recovery caveats are not conveyed by colour or gauge position alone.
      - key: S18.02.02
        title: Calculate readiness with visible weights and inputs
        wave: 5
        size: m
        platforms: [android, ios]
        persona: masters
        concerns: [devexpress]
        userStory:
          asA: Tom, seeing a readiness score
          iWant: to know exactly what drove it
          soThat: I can decide whether to follow the recommendation
        requirements:
          - >-
            Readiness score is a 0 to 100 composite using default weights of 35 percent sleep, 25
            percent recent load, 25 percent subjective wellbeing and 15 percent resting heart rate
            when heart rate is available.
          - >-
            If resting heart rate is unavailable, its 15 percent weight is redistributed
            proportionally across the other available inputs and the UI states this.
          - >-
            Inputs, weights and input freshness are visible on the readiness detail screen.
          - >-
            All recovery and readiness insights run on device from local data and show a visible input breakdown instead of an opaque score.
          - >-
            Correlation or association insights require at least 21 paired samples and use wording that says associated with, never caused by.
          - >-
            Readiness score uses explicit weights: 35 percent sleep duration versus target, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent resting heart-rate deviation when available.
        acceptanceCriteria:
          - id: AC1
            given: sleep 80, load 60, wellbeing 70 and heart rate 90
            when: readiness is calculated with default weights
            then: the score is 74.0 and all four weights are displayed
          - id: AC2
            given: heart rate is unavailable
            when: readiness is calculated
            then: the remaining weights sum to 100 percent and the detail states that heart rate was unavailable
          - id: AC3
            given: >-
              the user has no recovery data or has denied health permissions
            when: >-
              the screen opens
            then: >-
              a purposeful empty state appears within 400 ms with manual entry guidance and no broken chart or spinner
          - id: AC4
            given: >-
              a readiness or recovery score is displayed
            when: >-
              the user opens its details
            then: >-
              the UI shows each input, weight and contribution to the score rather than only a single number
          - id: AC5
            given: >-
              fewer than 21 paired samples exist for a sleep, readiness or performance comparison
            when: >-
              the insight engine evaluates correlations
            then: >-
              no correlation card is shown and the UI explains that 21 paired samples are required
        implementation:
          notes: >-
            Put ReadinessScoreCalculator in Forge.Domain/Recovery as a pure weighted-average function returning score plus contribution breakdown. Data freshness and availability are assembled in Forge.Core. Render the score with dx:RadialGauge and a DXCollectionView breakdown. Avoid red danger styling because this is not a medical risk score. Keep recovery logic in Forge.Core/Recovery and read sleep only through E12 IHealthDataService in Forge.Health. Readiness is deterministic: 35 percent sleep duration, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent RHR deviation. If RHR is missing, redistribute its weight proportionally and label it. Require 21 paired samples for associations and avoid causal language. Do not duplicate platform health access in UI.
          touches:
            - src/Forge.Domain/Recovery/ReadinessScoreCalculator.cs
            - src/Forge.Core/Recovery/ReadinessService.cs
            - src/Forge.App/Features/Insights/Recovery/ReadinessPage.xaml
          devexpress:
            - dx:RadialGauge
            - dx:DXCollectionView
        testing:
          - Unit tests for weighted score, missing heart rate redistribution and stale inputs.

          - >-
            Unit tests for readiness weighting, missing-input redistribution and visible breakdown DTOs.
          - >-
            Unit test verifying correlation cards are suppressed below 21 paired samples and never use causal wording.
        grounding:
          - title: DevExpress MAUI RadialGauge
            url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Gauges.RadialGauge
            note: >-
              DevExpress gauge control used for readiness display while the numeric breakdown remains visible as text.
          - title: .NET MAUI accessibility semantic properties
            url: https://learn.microsoft.com/en-us/dotnet/maui/fundamentals/accessibility?view=net-maui-10.0
            note: >-
              Accessibility semantics are required so score breakdowns and recovery caveats are not conveyed by colour or gauge position alone.
      - key: S18.02.03
        title: Incorporate resting heart rate when available
        wave: 5
        size: m
        platforms: [android, ios]
        persona: masters
        concerns: [privacy]
        userStory:
          asA: Tom, tracking resting heart rate
          iWant: it included only when the platform provides it reliably
          soThat: the readiness score improves without forcing manual data
        requirements:
          - >-
            Resting heart rate is read only through E12 IHealthDataService and is optional for all
            readiness features.
          - >-
            Heart-rate contribution requires at least 7 readings in the last 14 days.
          - >-
            Missing or stale heart-rate data never blocks sleep, check-in or load readiness.
          - >-
            All recovery and readiness insights run on device from local data and show a visible input breakdown instead of an opaque score.
          - >-
            Correlation or association insights require at least 21 paired samples and use wording that says associated with, never caused by.
          - >-
            Sleep data is read only through the E12 IHealthDataService abstraction, and manual entry remains available when Health Connect or HealthKit permission is denied.
          - >-
            Readiness score uses explicit weights: 35 percent sleep duration versus target, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent resting heart-rate deviation when available.
        acceptanceCriteria:
          - id: AC1
            given: 7 resting heart rate readings in the last 14 days
            when: readiness inputs are assembled
            then: heart rate is marked available and contributes 15 percent before redistribution
          - id: AC2
            given: 6 readings in the last 14 days
            when: readiness inputs are assembled
            then: heart rate is marked insufficient and readiness still calculates from other inputs
          - id: AC3
            given: >-
              the user has no recovery data or has denied health permissions
            when: >-
              the screen opens
            then: >-
              a purposeful empty state appears within 400 ms with manual entry guidance and no broken chart or spinner
          - id: AC4
