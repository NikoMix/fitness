  - key: F18.05
    title: Surface sleep-performance correlations responsibly
    wave: 5
    summary: >-
      Make recovery tracking feel worthwhile by showing cautious associations between sleep,
      readiness and performance only when enough paired samples exist.
    outcome: >-
      Users see useful patterns such as stronger sessions after longer sleep without mistaking them for proof of cause.
    concerns: [devexpress, privacy]
    stories:
      - key: S18.05.01
        title: Correlate sleep with training performance after minimum samples
        wave: 5
        size: m
        platforms: [android, ios]
        persona: enthusiast
        concerns: [devexpress]
        userStory:
          asA: Alex, wondering whether sleep affects lifts
          iWant: cautious sleep-performance insights
          soThat: I know which habits are worth paying attention to
        requirements:
          - >-
            Sleep-performance correlation requires at least 20 paired nights and workouts for the
            same metric before any claim is shown.
          - >-
            Insights use association language such as your squat was 8 percent higher after 7 or
            more hours of sleep and include does not prove cause.
          - >-
            Outlier handling excludes performance points more than 3 standard deviations from the
            user's rolling mean and reports the exclusion count.
          - >-
            All recovery and readiness insights run on device from local data and show a visible input breakdown instead of an opaque score.
          - >-
            Correlation or association insights require at least 21 paired samples and use wording that says associated with, never caused by.
          - >-
            Sleep data is read only through the E12 IHealthDataService abstraction, and manual entry remains available when Health Connect or HealthKit permission is denied.
        acceptanceCriteria:
          - id: AC1
            given: 20 paired squat workouts and prior-night sleep records with 8 percent higher average after 7 plus hours
            when: correlation insights run
            then: the insight states 8 percent higher, names 20 samples and includes does not prove cause
          - id: AC2
            given: 19 paired samples
            when: correlation insights run
            then: no insight appears and the eligibility reason states that 20 paired samples are required
          - id: AC3
            given: >-
              the user has no recovery data or has denied health permissions
            when: >-
              the screen opens
            then: >-
              a purposeful empty state appears within 400 ms with manual entry guidance and no broken chart or spinner
          - id: AC4
            given: >-
              a readiness or recovery score is displayed
            when: >-
              the user opens its details
            then: >-
              the UI shows each input, weight and contribution to the score rather than only a single number
          - id: AC5
            given: >-
              fewer than 21 paired samples exist for a sleep, readiness or performance comparison
            when: >-
              the insight engine evaluates correlations
            then: >-
              no correlation card is shown and the UI explains that 21 paired samples are required
        implementation:
          notes: >-
            Implement CorrelationInsightService in Forge.Core with conservative minimum samples and simple group comparisons before considering more complex statistics. Use E16 performance projections and E18 sleep summaries. Render the insight with dx:ChartView plus a text explanation, because the copy is as important as the chart. Keep recovery logic in Forge.Core/Recovery and read sleep only through E12 IHealthDataService in Forge.Health. Readiness is deterministic: 35 percent sleep duration, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent RHR deviation. If RHR is missing, redistribute its weight proportionally and label it. Require 21 paired samples for associations and avoid causal language. Do not duplicate platform health access in UI.
          touches:
            - src/Forge.Core/Recovery/CorrelationInsightService.cs
            - src/Forge.App/Features/Insights/Recovery/CorrelationInsightPage.xaml
          devexpress:
            - dx:ChartView
            - dx:DXCollectionView
        testing:
          - Unit tests for 20 sample threshold, 3 standard deviation outlier exclusion and association copy.

          - >-
            Unit tests for readiness weighting, missing-input redistribution and visible breakdown DTOs.
          - >-
            Unit test verifying correlation cards are suppressed below 21 paired samples and never use causal wording.
        grounding:
          - title: Android Health Connect
            url: https://developer.android.com/health-and-fitness/health-connect
            note: >-
              Official Android health data surface that supplies sleep and recovery records through the E12 abstraction.
          - title: Apple HealthKit
            url: https://developer.apple.com/documentation/healthkit
            note: >-
              Official Apple framework used through the E12 abstraction for sleep and related health samples.
          - title: DevExpress MAUI DXCollectionView
            url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
            note: >-
              DevExpress virtualized list or card control for recovery entries, routines and explanatory breakdowns.
          - title: .NET MAUI accessibility semantic properties
            url: https://learn.microsoft.com/en-us/dotnet/maui/fundamentals/accessibility?view=net-maui-10.0
            note: >-
              Accessibility semantics are required so score breakdowns and recovery caveats are not conveyed by colour or gauge position alone.
      - key: S18.05.02
        title: Show readiness and performance trend associations
        wave: 5
        size: m
        platforms: [android, ios]
        persona: masters
        concerns: [devexpress]
        userStory:
          asA: Tom, comparing good and bad days
          iWant: to see whether readiness aligns with performance
          soThat: I can decide how much weight to give the score
        requirements:
          - >-
            Readiness-performance association requires at least 20 workouts with same-day readiness
            scores and comparable exercise metrics.
          - >-
            The view groups performance into readiness bands below 50, 50 to 74 and 75 plus.
          - >-
            The UI shows sample counts for every band and hides any band with fewer than 5 samples.
          - >-
            All recovery and readiness insights run on device from local data and show a visible input breakdown instead of an opaque score.
          - >-
            Correlation or association insights require at least 21 paired samples and use wording that says associated with, never caused by.
          - >-
            Readiness score uses explicit weights: 35 percent sleep duration versus target, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent resting heart-rate deviation when available.
        acceptanceCriteria:
          - id: AC1
            given: 24 workouts with readiness scores split across all bands
            when: the association view opens
            then: each band with at least 5 samples displays average performance and sample count
          - id: AC2
            given: a readiness band with 4 samples
            when: the chart renders
            then: that band is hidden and the explanation states fewer than 5 samples
          - id: AC3
            given: >-
              the user has no recovery data or has denied health permissions
            when: >-
              the screen opens
            then: >-
              a purposeful empty state appears within 400 ms with manual entry guidance and no broken chart or spinner
          - id: AC4
            given: >-
              a readiness or recovery score is displayed
            when: >-
              the user opens its details
            then: >-
              the UI shows each input, weight and contribution to the score rather than only a single number
          - id: AC5
            given: >-
              fewer than 21 paired samples exist for a sleep, readiness or performance comparison
            when: >-
              the insight engine evaluates correlations
            then: >-
              no correlation card is shown and the UI explains that 21 paired samples are required
        implementation:
          notes: >-
            Extend CorrelationInsightService with readiness-band summaries. Keep calculations aggregated in Forge.Core and expose hidden-band reasons to the UI. Render bands as a dx:ChartView bar series with adjacent DXCollectionView explanation rows so users can read exact sample counts without interpreting chart colours alone. Keep recovery logic in Forge.Core/Recovery and read sleep only through E12 IHealthDataService in Forge.Health. Readiness is deterministic: 35 percent sleep duration, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent RHR deviation. If RHR is missing, redistribute its weight proportionally and label it. Require 21 paired samples for associations and avoid causal language. Do not duplicate platform health access in UI.
          touches:
            - src/Forge.Core/Recovery/ReadinessPerformanceAssociationService.cs
            - src/Forge.App/Features/Insights/Recovery/ReadinessAssociationView.xaml
          devexpress:
            - dx:ChartView
            - dx:DXCollectionView
            - dx:RadialGauge
        testing:
          - Unit tests for 20 workout eligibility and 5 sample band hiding.

          - >-
            Unit tests for readiness weighting, missing-input redistribution and visible breakdown DTOs.
          - >-
            Unit test verifying correlation cards are suppressed below 21 paired samples and never use causal wording.
        grounding:
          - title: DevExpress MAUI RadialGauge
            url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Gauges.RadialGauge
            note: >-
              DevExpress gauge control used for readiness display while the numeric breakdown remains visible as text.
          - title: .NET MAUI accessibility semantic properties
            url: https://learn.microsoft.com/en-us/dotnet/maui/fundamentals/accessibility?view=net-maui-10.0
            note: >-
              Accessibility semantics are required so score breakdowns and recovery caveats are not conveyed by colour or gauge position alone.
      - key: S18.05.03
        title: Export recovery insights with caveats included
        wave: 5
        size: s
        platforms: [android, ios]
        persona: enthusiast
        concerns: [privacy, devexpress]
        userStory:
          asA: Alex, discussing recovery with a coach
          iWant: to export a recovery chart with caveats
          soThat: context is not lost when I share it
        requirements:
          - >-
            Recovery chart export includes chart title, date range, sample count and non-causation
            caveat in the exported image.
          - >-
            The export preview redacts raw sleep times unless the user enables Include exact sleep
            times for that export.
          - >-
            Temporary export files are deleted within 5 seconds of share completion or cancellation.
          - >-
            All recovery and readiness insights run on device from local data and show a visible input breakdown instead of an opaque score.
          - >-
            Correlation or association insights require at least 21 paired samples and use wording that says associated with, never caused by.
          - >-
            Readiness score uses explicit weights: 35 percent sleep duration versus target, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent resting heart-rate deviation when available.
        acceptanceCriteria:
          - id: AC1
            given: a sleep-performance insight with 24 samples
            when: Export image is tapped
            then: the preview includes the sample count 24 and the phrase does not prove cause
          - id: AC2
            given: Include exact sleep times is disabled
            when: the recovery export is generated
            then: the image contains sleep duration bands but no exact bedtime or wake time values
          - id: AC3
            given: >-
              the user has no recovery data or has denied health permissions
            when: >-
              the screen opens
            then: >-
              a purposeful empty state appears within 400 ms with manual entry guidance and no broken chart or spinner
          - id: AC4
            given: >-
              a readiness or recovery score is displayed
            when: >-
              the user opens its details
            then: >-
              the UI shows each input, weight and contribution to the score rather than only a single number
          - id: AC5
            given: >-
              fewer than 21 paired samples exist for a sleep, readiness or performance comparison
            when: >-
              the insight engine evaluates correlations
            then: >-
              no correlation card is shown and the UI explains that 21 paired samples are required
        implementation:
          notes: >-
            Reuse the chart export service from E16 but provide a RecoveryExportPolicy that adds sample counts and caveats and redacts exact sleep times by default. This keeps sharing behaviour consistent across insights while recognising that sleep times are sensitive. Keep recovery logic in Forge.Core/Recovery and read sleep only through E12 IHealthDataService in Forge.Health. Readiness is deterministic: 35 percent sleep duration, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent RHR deviation. If RHR is missing, redistribute its weight proportionally and label it. Require 21 paired samples for associations and avoid causal language. Do not duplicate platform health access in UI.
          touches:
            - src/Forge.App/Features/Insights/Recovery/RecoveryExportPolicy.cs
            - src/Forge.App/Features/Insights/Shared/ChartExportService.cs
          devexpress:
            - dx:ChartView
            - dx:RadialGauge
          apis:
            - Microsoft.Maui.ApplicationModel.DataTransfer.Share
        testing:
          - UI test confirming caveats appear in exported recovery images.
          - Privacy test confirming exact sleep times are redacted by default.
          - >-
            Unit tests for readiness weighting, missing-input redistribution and visible breakdown DTOs.
          - >-
            Unit test verifying correlation cards are suppressed below 21 paired samples and never use causal wording.
        grounding:
          - title: DevExpress MAUI RadialGauge
            url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Gauges.RadialGauge
            note: >-
              DevExpress gauge control used for readiness display while the numeric breakdown remains visible as text.
          - title: .NET MAUI accessibility semantic properties
            url: https://learn.microsoft.com/en-us/dotnet/maui/fundamentals/accessibility?view=net-maui-10.0
            note: >-
              Accessibility semantics are required so score breakdowns and recovery caveats are not conveyed by colour or gauge position alone.
