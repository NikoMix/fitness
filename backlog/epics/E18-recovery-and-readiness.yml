            when: >-
              the insight engine evaluates correlations
            then: >-
              no correlation card is shown and the UI explains that 21 paired samples are required
        implementation:
          notes: >-
            Create RestingHeartRateInputProvider in Forge.Core that consumes the health abstraction only. The provider should return availability reason codes so the UI can explain unavailable, denied, stale or insufficient without platform branching. Do not store raw high-frequency heart data in Recovery; persist only daily resting summaries. Keep recovery logic in Forge.Core/Recovery and read sleep only through E12 IHealthDataService in Forge.Health. Readiness is deterministic: 35 percent sleep duration, 25 percent energy, 20 percent inverse soreness, 10 percent inverse stress and 10 percent RHR deviation. If RHR is missing, redistribute its weight proportionally and label it. Require 21 paired samples for associations and avoid causal language. Do not duplicate platform health access in UI.
          touches:
            - src/Forge.Core/Recovery/RestingHeartRateInputProvider.cs
            - src/Forge.Infrastructure/Persistence/RestingHeartRateSummary.cs
          devexpress:
            - dx:DXCollectionView
            - dx:RadialGauge
          apis:
            - Health Connect via Forge.Health
            - HealthKit via Forge.Health
        testing:
          - Unit tests for 7 of 14 day sufficiency and stale data reasons.

          - >-
            Unit tests for readiness weighting, missing-input redistribution and visible breakdown DTOs.
          - >-
            Unit test verifying correlation cards are suppressed below 21 paired samples and never use causal wording.
        grounding:
          - title: Android Health Connect
            url: https://developer.android.com/health-and-fitness/health-connect
