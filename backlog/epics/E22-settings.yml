- key: F22.04
  title: Manage local data and compliance links
  wave: 2
  summary: Make local data state visible and provide routes to legal and deletion experiences owned by E25 without duplicating
    those flows.
  outcome: Users can understand storage use and reach required privacy surfaces from Settings quickly.
  concerns:
  - privacy
  - store-blocker
  stories:
  - key: S22.04.01
    title: Show local storage usage by category
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: cutter
    concerns:
    - privacy
    - perf
    userStory:
      asA: Priya storing photos and logs
      iWant: to see what consumes device storage
      soThat: I can manage local data before it becomes a problem
    requirements:
    - Categories include database, progress photos, cached catalogue assets and logs.
    - Each category and total app-managed storage are rounded to 0.1 MB.
    - Calculation completes within 1.0 s for 2 GB of progress photos without blocking the UI thread.
    - Storage scanning excludes directories outside Forge app-managed storage.
    - Sensitive file names are not written to logs during scanning.
    acceptanceCriteria:
    - id: AC1
      given: database, photo and log files exist
      when: the storage screen opens
      then: each category and total size are shown rounded to 0.1 MB
    - id: AC2
      given: 2 GB of local photos exist
      when: size calculation runs
      then: the UI remains responsive and a progress state is shown until completion
    - id: AC3
      given: the user leaves the storage screen during a scan
      when: cancellation is requested
      then: the scan stops without blocking navigation or logging file names
    implementation:
      notes: 'Implement storage scanning in Forge.Infrastructure with async directory enumeration and cancellation. Render
        categories with dx:DXCollectionView and keep scanning off the UI thread. Implement this in src/Forge.Infrastructure/Storage,
        src/Forge.App/Features/Settings/Data using a typed PreferenceDescriptor or settings service rather than ad hoc key
        strings in pages. The Settings UI should compose dx:DXCollectionView, dx:DXBorder, including dx:DataFormView, dx:ComboBoxEdit
        and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences. The tricky part
        is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical health
        data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate conversion
        drift.'
      touches:
      - src/Forge.Infrastructure/Storage
      - src/Forge.App/Features/Settings/Data
      devexpress:
      - dx:DXCollectionView
      - dx:DXBorder
      - dx:DataFormView
      - dx:ComboBoxEdit
      - dx:CheckEdit
      apis:
      - System.IO.Enumeration
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Performance test scans a seeded 2 GB directory tree without UI-thread blocking.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: DevExpress Collection View for .NET MAUI
      url: https://docs.devexpress.com/MAUI/403324
      note: Grounds DXCollectionView use for virtualized lists, settings rows and selectors.
  - key: S22.04.02
    title: Clear non-essential caches without deleting user data
    wave: 2
    size: s
    platforms:
    - android
    - ios
