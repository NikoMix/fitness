key: E22
title: Settings and Preferences
domain: compliance
wave: 2
summary: 'Settings is the control centre for a local-first fitness app: units, theme, notifications, haptics, workout defaults,
  storage, search and legal links must be visible, predictable and consistent across Forge. Because v1 has no backend, settings
  must never imply server-side account management.'
problem: Users enter sensitive body and health data, then expect the app to respect how they measure, train, receive reminders
  and protect privacy. If settings are fragmented, users make unit mistakes, disable every notification or fail to find legal
  and deletion paths required for launch compliance.
outcome: A user can search and change preferences from one settings area, see changes applied consistently, tune reminders
  without global opt-out, manage local storage, and reach privacy, legal and delete-my-data surfaces in two taps.
successMetrics:
- Unit preference changes propagate to visible preview values within 100 ms.
- Settings search returns matching results within 100 ms for 100 descriptors.
- Users can opt out of one notification category in no more than 2 taps from Settings.
- Privacy policy, terms and delete-my-data entries are reachable in 2 taps or fewer.
nonGoals:
- No implementation of privacy policy, terms content or delete-my-data flows; those belong to E25.
- No cloud account settings in v1.
- No wearable-specific preferences in wave 2.
risks:
- risk: Settings becomes a dumping ground of inconsistent controls.
  mitigation: Back every setting with a typed descriptor, category and search keywords.
  severity: medium
- risk: Unit changes corrupt stored values or make history ambiguous.
  mitigation: Store canonical values and treat preferences as formatting only, with conversion boundary tests.
  severity: high
- risk: Legal links depend on E25 and may not exist when Settings is built.
  mitigation: Define stable route contracts and show disabled development placeholders until E25 provides destinations.
  severity: medium
dependsOn:
- E01
- E25
grounding:
- title: .NET MAUI preferences
  url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
  note: Used for small non-sensitive local preference values.
- title: .NET MAUI system theme changes
  url: https://learn.microsoft.com/dotnet/maui/user-interface/system-theme-changes
  note: Used for respecting system, light and dark theme choices.
- title: Color Themes for DevExpress .NET MAUI Controls
  url: https://docs.devexpress.com/MAUI/404636
  note: Documents ThemeManager and Material Design 3 colour themes.
- title: DevExpress Collection View for .NET MAUI
  url: https://docs.devexpress.com/MAUI/403324
  note: Documents DXCollectionView for searchable settings lists.
features:
- key: F22.01
  title: Apply appearance, locale and unit preferences
  wave: 2
  summary: Give users global control over measurement units, theme and formatting while preserving canonical stored values.
  outcome: Visible units, dates and theme choices update consistently across settings previews and feature surfaces.
  concerns:
  - a11y
  - i18n
  stories:
  - key: S22.01.01
    title: Set metric or imperial units globally
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: enthusiast
    concerns:
    - i18n
    userStory:
      asA: Alex configuring Forge
      iWant: to choose the measurement system I use
      soThat: all values are shown consistently
    requirements:
    - Metric and imperial apply to body metrics, exercise loads, distance and serving weights.
    - Visible values update within 100 ms after the setting changes.
    - Stored canonical values are not changed by display-unit switches.
    - The global unit model covers kg/lb, cm/ft-in, ml/fl-oz and kcal/kJ.
    - Round-trip conversions must use canonical values and avoid cumulative rounding drift across every surface.
    acceptanceCriteria:
    - id: AC1
      given: a workout load is stored as 100 kg
      when: the user switches to imperial
      then: the visible load displays as 220.5 lb plus or minus 0.1 lb within 100 ms
    - id: AC2
      given: the setting is toggled five times
      when: stored data is inspected
      then: the canonical kilogram value remains exactly unchanged
    - id: AC3
      given: a hydration target, body weight and calorie value are stored canonically
      when: the user switches units away and back five times
      then: all displayed values return within configured precision and stored values are unchanged
    implementation:
      notes: 'Create UnitPreference in Forge.Core/Preferences and expose it through an IUnitFormatter used by all ViewModels.
        Settings uses dx:ComboBoxEdit, and features must bind formatted values rather than storing presentation strings. Implement
        this in src/Forge.Core/Preferences, src/Forge.App/Features/Settings using a typed PreferenceDescriptor or settings
        service rather than ad hoc key strings in pages. The Settings UI should compose dx:ComboBoxEdit, dx:DXBorder, including
        dx:DataFormView, dx:ComboBoxEdit and dx:CheckEdit where appropriate, and persist only small non-sensitive values through
        Preferences. The tricky part is propagation: unit, theme and notification choices must refresh all surfaces without
        rewriting canonical health data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated
        keys, or accumulate conversion drift.'
      touches:
      - src/Forge.Core/Preferences
      - src/Forge.App/Features/Settings
      devexpress:
      - dx:ComboBoxEdit
      - dx:DXBorder
      - dx:DataFormView
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit tests cover kg/lb, cm/ft-in and km/mi conversion precision.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
    - title: .NET MAUI localization
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/localization
      note: Grounds localized resources, culture-sensitive formatting and translated settings text.
  - key: S22.01.02
    title: Choose light, dark, system and high-contrast themes
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: masters
    concerns:
    - a11y
    userStory:
      asA: Tom improving readability
      iWant: to pick a theme that suits my vision and device
      soThat: Forge remains comfortable in different environments
    requirements:
    - Theme choices are System, Light, Dark and High contrast.
    - Theme changes apply to DevExpress and standard MAUI controls without restart.
    - 'High contrast meets WCAG AA contrast: 4.5:1 for normal text and 3:1 for large text.'
    - Theme preference is stored in Preferences and restored before the shell renders.
    - High-contrast selection remains visually distinct without relying on colour alone.
    acceptanceCriteria:
    - id: AC1
      given: the user selects Dark
      when: they return to Today
      then: DevExpress and standard controls use dark colours without app restart
    - id: AC2
      given: the user selects High contrast
      when: a contrast audit runs
      then: normal text contrast is at least 4.5:1 and large text contrast is at least 3:1
    - id: AC3
      given: System theme is selected
      when: the device changes from light to dark
      then: Forge follows the system change and persists the System preference
    implementation:
      notes: 'Drive appearance through ThemePreferenceService that sets DevExpress ThemeManager and MAUI AppTheme resources
        together. Use semantic resources only so dynamic changes and accessibility audits work. Implement this in src/Forge.App/Features/Settings/Appearance,
        src/Forge.App/Resources/Styles using a typed PreferenceDescriptor or settings service rather than ad hoc key strings
        in pages. The Settings UI should compose dx:ComboBoxEdit, dx:DXBorder, ThemeManager, including dx:DataFormView, dx:ComboBoxEdit
        and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences. The tricky part
        is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical health
        data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate conversion
        drift.'
      touches:
      - src/Forge.App/Features/Settings/Appearance
      - src/Forge.App/Resources/Styles
      devexpress:
      - dx:ComboBoxEdit
      - dx:DXBorder
      - ThemeManager
      - dx:DataFormView
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Controls.AppThemeBinding
      - Microsoft.Maui.Storage.Preferences
    testing:
    - UI tests switch each theme and assert key semantic resources change.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: .NET MAUI system theme changes
      url: https://learn.microsoft.com/dotnet/maui/user-interface/system-theme-changes
      note: Grounds responding to light, dark and system theme changes.
    - title: WCAG 2.2 contrast minimum
      url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
      note: Grounds high-contrast readability thresholds for settings and warning surfaces.
  - key: S22.01.03
    title: Configure first day of week and locale formatting
    wave: 2
    size: s
    platforms:
    - android
    - ios
    persona: returner
    concerns:
    - i18n
    userStory:
      asA: Sam planning training weeks
      iWant: calendars and dates to match my region
      soThat: weekly plans are easier to read
    requirements:
    - First day of week supports System default, Monday, Saturday and Sunday.
    - Dates and numbers follow current culture unless first day is overridden.
    - Calendar previews update within 100 ms after change.
    - Localized labels come from resource files rather than hard-coded settings strings.
    - Changing first day of week does not change measurement units or language.
    acceptanceCriteria:
    - id: AC1
      given: the user selects Monday
      when: a weekly preview opens
      then: the week starts on Monday regardless of device culture
    - id: AC2
      given: the user returns to System default
      when: the preview renders
      then: week start matches CultureInfo.CurrentCulture
    - id: AC3
      given: the device culture uses Sunday and the user overrides Monday
      when: settings search indexes dates
      then: date formatting stays culture-based while week previews start Monday
    implementation:
      notes: 'Store only the first-day override in preferences and use CultureInfo for other formatting. Consumers request
        WeekFormatOptions from Forge.Core rather than reading preferences directly. Implement this in src/Forge.Core/Preferences,
        src/Forge.App/Features/Settings/Appearance using a typed PreferenceDescriptor or settings service rather than ad hoc
        key strings in pages. The Settings UI should compose dx:ComboBoxEdit, dx:DXBorder, including dx:DataFormView, dx:ComboBoxEdit
        and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences. The tricky part
        is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical health
        data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate conversion
        drift.'
      touches:
      - src/Forge.Core/Preferences
      - src/Forge.App/Features/Settings/Appearance
      devexpress:
      - dx:ComboBoxEdit
      - dx:DXBorder
      - dx:DataFormView
      - dx:CheckEdit
      apis:
      - System.Globalization
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit tests for culture default, Monday, Saturday and Sunday overrides.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: .NET MAUI localization
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/localization
      note: Grounds localized resources, culture-sensitive formatting and translated settings text.
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
  - key: S22.01.04
    title: Control sound and haptic feedback separately
    wave: 2
    size: s
    platforms:
    - android
    - ios
    persona: newcomer
    concerns:
    - a11y
    userStory:
      asA: Maya using Forge in public
      iWant: to disable sounds without losing useful haptics
      soThat: the app fits my environment
    requirements:
    - Sound and haptic preferences are separate toggles.
    - Both settings default to platform conventions where available.
    - The next eligible feedback event uses the changed value immediately.
    - Toggles use dx:CheckEdit and expose accessible on/off state.
    - Settings store no sensitive health data and can be reset without affecting logs.
    acceptanceCriteria:
    - id: AC1
      given: sound is disabled and haptics are enabled
      when: a timer completes
      then: no app sound plays and one haptic event is requested
    - id: AC2
      given: haptics are disabled
      when: the user logs a set
      then: no haptic API call is made
    - id: AC3
      given: a screen reader is active
      when: focus reaches the sound and haptic toggles
      then: each toggle announces its label, state and purpose
    implementation:
      notes: 'Create FeedbackPreferenceService with separate sound and haptic policies. Keep all platform feedback calls behind
        an interface so unit tests can assert no feedback fires when disabled. Implement this in src/Forge.Core/Preferences,
        src/Forge.App/Feedback, src/Forge.App/Features/Settings using a typed PreferenceDescriptor or settings service rather
        than ad hoc key strings in pages. The Settings UI should compose dx:ComboBoxEdit, dx:DXButton, including dx:DataFormView,
        dx:ComboBoxEdit and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences.
        The tricky part is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical
        health data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate
        conversion drift.'
      touches:
      - src/Forge.Core/Preferences
      - src/Forge.App/Feedback
      - src/Forge.App/Features/Settings
      devexpress:
      - dx:ComboBoxEdit
      - dx:DXButton
      - dx:DataFormView
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Devices.HapticFeedback
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit tests for sound and haptic suppression independently.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
- key: F22.02
  title: Configure workout defaults from Settings
  wave: 2
  summary: Centralise frequently reused workout defaults so training screens start from the user's equipment and habits.
  outcome: Rest timers, barbell defaults and plate inventory apply consistently to relevant training flows.
  stories:
  - key: S22.02.01
    title: Set default rest timers by workout context
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: enthusiast
    concerns:
    - perf
    userStory:
      asA: Alex logging sets quickly
      iWant: timers to start with my preferred durations
      soThat: I do not adjust the same value after every set
    requirements:
    - Defaults support warm-up, hypertrophy, strength and custom contexts.
    - Timer values accept 15 to 600 seconds.
    - Changing a default affects newly started timers only.
    - Default rest timers are profile-scoped and do not leak between local profiles.
    - Invalid timer values from imported preferences are repaired to seeded defaults.
    acceptanceCriteria:
    - id: AC1
      given: strength rest default changes from 180 to 240 seconds
      when: the user logs a new strength set
      then: the timer starts at 240 seconds
    - id: AC2
      given: a 180-second timer is already running
      when: the default changes to 240 seconds
      then: the running timer keeps its current remaining duration
    - id: AC3
      given: two local profiles have different strength rest defaults
      when: the active profile switches
      then: new timers use the active profile default only
    implementation:
      notes: 'Define WorkoutDefaults in Forge.Core/Preferences and edit it with dx:DataFormView and dx:NumericEdit.
        Workout execution snapshots defaults when a timer starts to avoid surprising mid-set changes. Implement this in src/Forge.Core/Preferences/WorkoutDefaults.cs,
        src/Forge.App/Features/Settings/Workout using a typed PreferenceDescriptor or settings service rather than ad hoc
        key strings in pages. The Settings UI should compose dx:DataFormView, dx:NumericEdit, including dx:DataFormView, dx:ComboBoxEdit
        and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences. The tricky part
        is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical health
        data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate conversion
        drift.'
      touches:
      - src/Forge.Core/Preferences/WorkoutDefaults.cs
      - src/Forge.App/Features/Settings/Workout
      devexpress:
      - dx:DataFormView
      - dx:NumericEdit
      - dx:ComboBoxEdit
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit tests verify running timers are unaffected by preference changes.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: DevExpress MAUI Data Form examples
      url: https://docs.devexpress.com/MAUI/404178
      note: Grounds DataFormView based structured entry and validation layout.
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
  - key: S22.02.02
    title: Configure barbell weight and collars
    wave: 2
    size: s
    platforms:
    - android
    - ios
    persona: enthusiast
    concerns:
    - i18n
    userStory:
      asA: Alex training at different gyms
      iWant: to set the bar weight Forge assumes
      soThat: plate math matches the equipment in front of me
    requirements:
    - Barbell defaults support 20 kg, 15 kg, 45 lb, 35 lb and custom values.
    - Custom bar values must be 1 to 50 kg equivalent.
    - Collar weight can be 0 to 5 kg equivalent per pair.
    - Changing unit preference re-renders bar and collar defaults without changing canonical kilograms.
    - Custom values are rounded only for display and validation uses canonical precision.
    acceptanceCriteria:
    - id: AC1
      given: the user selects 45 lb bar and 5 lb collars
      when: they preview a 225 lb load
      then: the computed remaining load accounts for bar and collars
    - id: AC2
      given: the user enters a 0 kg custom bar
      when: they save
      then: validation blocks saving and names the 1 kg minimum
    - id: AC3
      given: a 20 kg bar is displayed in imperial
      when: the user switches back to metric
      then: the bar remains exactly 20 kg with no rounding drift
    implementation:
      notes: 'Store defaults as canonical kilograms and format through F22.01. Use dx:ComboBoxEdit for common bars and dx:NumericEdit
        for custom values. Plate calculation remains in training services. Implement this in src/Forge.Core/Preferences/WorkoutDefaults.cs,
        src/Forge.App/Features/Settings/Workout using a typed PreferenceDescriptor or settings service rather than ad hoc
        key strings in pages. The Settings UI should compose dx:ComboBoxEdit, dx:NumericEdit, dx:DXBorder, including dx:DataFormView,
        dx:ComboBoxEdit and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences.
        The tricky part is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical
        health data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate
        conversion drift.'
      touches:
      - src/Forge.Core/Preferences/WorkoutDefaults.cs
      - src/Forge.App/Features/Settings/Workout
      devexpress:
      - dx:ComboBoxEdit
      - dx:NumericEdit
      - dx:DXBorder
      - dx:DataFormView
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit tests for common bar presets and custom validation.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: DevExpress MAUI data editor types
      url: https://docs.devexpress.com/MAUI/404621
      note: Grounds ComboBoxEdit, NumericEdit, TextEdit and related editor choices.
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
  - key: S22.02.03
    title: Manage available plate inventory
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: enthusiast
    concerns:
    - i18n
    userStory:
      asA: Alex loading a bar
      iWant: to tell Forge which plates I have
      soThat: suggested loads are achievable in my gym
    requirements:
    - Inventory supports metric and imperial denominations with quantity per side.
    - Quantity accepts 0 to 20 per denomination.
    - Preview flags target loads that cannot be built from available plates.
    - Inventory rows include unit labels and accessible denomination names.
    - Importing invalid quantities repairs only the invalid denomination and reports the repair.
    acceptanceCriteria:
    - id: AC1
      given: the user has no 1.25 kg plates
      when: a target load requires them
      then: the preview shows Unavailable and suggests the nearest lower buildable load
    - id: AC2
      given: the user sets quantity to 21
      when: they save
      then: validation blocks saving and names the maximum quantity of 20
    - id: AC3
      given: plate inventory is displayed in metric then imperial then metric
      when: canonical inventory is inspected
      then: denominations and quantities are unchanged
    implementation:
      notes: 'Represent PlateInventory in Forge.Domain/Training using canonical denominations and counts. Settings renders
        rows with dx:DXCollectionView and dx:NumericEdit quantities. Implement this in src/Forge.Domain/Training/PlateInventory.cs,
        src/Forge.App/Features/Settings/Workout using a typed PreferenceDescriptor or settings service rather than ad hoc
        key strings in pages. The Settings UI should compose dx:DXCollectionView, dx:NumericEdit, dx:DXBorder, including dx:DataFormView,
        dx:ComboBoxEdit and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences.
        The tricky part is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical
        health data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate
        conversion drift.'
      touches:
      - src/Forge.Domain/Training/PlateInventory.cs
      - src/Forge.App/Features/Settings/Workout
      devexpress:
      - dx:DXCollectionView
      - dx:NumericEdit
      - dx:DXBorder
      - dx:DataFormView
      - dx:ComboBoxEdit
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit tests for buildable and nearest-lower plate calculations.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: DevExpress Collection View for .NET MAUI
      url: https://docs.devexpress.com/MAUI/403324
      note: Grounds DXCollectionView use for virtualized lists, settings rows and selectors.
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
  - key: S22.02.04
    title: Reset workout defaults safely
    wave: 2
    size: xs
    platforms:
    - android
    - ios
    persona: returner
    concerns:
    - a11y
    userStory:
      asA: Sam fixing confusing settings
      iWant: to restore sensible workout defaults
      soThat: I can recover from over-customising
    requirements:
    - Reset affects rest timers, barbell, collars and plate inventory only.
    - Confirmation lists exactly which categories will change.
    - Non-workout settings remain unchanged after reset.
    - The confirmation is accessible and requires an explicit destructive action.
    - Reset uses profile-scoped defaults and never touches legal, unit or account preferences.
    acceptanceCriteria:
    - id: AC1
      given: custom workout defaults exist
      when: the user taps Reset and cancels
      then: no preference value changes
    - id: AC2
      given: custom defaults exist
      when: the user confirms Reset
      then: workout defaults equal seeded values and theme settings are unchanged
    - id: AC3
      given: a screen reader is active on the reset confirmation
      when: focus moves through the sheet
      then: the affected categories and Cancel action are announced before Reset
    implementation:
      notes: 'Implement reset as a scoped command on WorkoutDefaultsService, not a preference-store clear. Use dx:BottomSheet
        so affected categories are visible before the destructive action. Implement this in src/Forge.Core/Preferences,
        src/Forge.App/Features/Settings/Workout using a typed PreferenceDescriptor or settings service rather than ad hoc
        key strings in pages. The Settings UI should compose dx:BottomSheet, dx:DXButton, including dx:DataFormView, dx:ComboBoxEdit
        and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences. The tricky part
        is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical health
        data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate conversion
        drift.'
      touches:
      - src/Forge.Core/Preferences
      - src/Forge.App/Features/Settings/Workout
      devexpress:
      - dx:BottomSheet
      - dx:DXButton
      - dx:DataFormView
      - dx:ComboBoxEdit
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Unit test category reset does not mutate unrelated settings.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
- key: F22.03
  title: Tune notifications without a global opt-out
  wave: 2
  summary: Give users category-level control over reminders and quiet hours while respecting platform permission state and
    the local notification provider.
  outcome: Users can opt in to useful reminders, silence categories and understand why notifications may not appear.
  concerns:
  - privacy
  - a11y
  stories:
  - key: S22.03.01
    title: Configure notification categories independently
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: returner
    concerns:
    - privacy
    userStory:
      asA: Sam using reminders selectively
      iWant: workout reminders without nutrition prompts
      soThat: Forge reminds me only about what I chose
    requirements:
    - Categories include workout, nutrition, hydration, progress check-in and streak risk.
    - Each category has enabled state, time window and maximum daily count.
    - Disabling a category cancels pending local notifications for that category within 500 ms.
    - Notification preferences store category ids only and no message body or health value.
    - Settings links to permission education from E05 when platform permission is unavailable.
    acceptanceCriteria:
    - id: AC1
      given: hydration notifications are disabled
      when: the scheduler refreshes
      then: zero pending hydration notifications remain within 500 ms
    - id: AC2
      given: workout reminders remain enabled
      when: hydration is disabled
      then: workout pending notifications are unchanged
    - id: AC3
      given: notification permission is denied
      when: the user opens a category editor
      then: the editor explains the denied state and links to the E05 permission route instead of prompting repeatedly
    implementation:
      notes: 'Create NotificationPreference records keyed by category and wire them to the E18 local scheduler. Use dx:DXCollectionView
        for categories and dx:BottomSheet for per-category editing. Implement this in src/Forge.Core/Preferences/Notifications,
        src/Forge.App/Features/Settings/Notifications using a typed PreferenceDescriptor or settings service rather than ad
        hoc key strings in pages. The Settings UI should compose dx:DXCollectionView, dx:BottomSheet, dx:TimeEdit, including
        dx:DataFormView, dx:ComboBoxEdit and dx:CheckEdit where appropriate, and persist only small non-sensitive values through
        Preferences. The tricky part is propagation: unit, theme and notification choices must refresh all surfaces without
        rewriting canonical health data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated
        keys, or accumulate conversion drift.'
      touches:
