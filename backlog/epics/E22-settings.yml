    - id: AC2
      given: no cache files exist
      when: the user taps Clear cache
      then: the action completes with 0 bytes freed and no error
    - id: AC3
      given: one cache file cannot be deleted
      when: Clear cache runs
      then: the result names a partial failure and user-owned data remains unchanged
    implementation:
      notes: 'Define Essential and NonEssential data categories so deletion cannot rely on fragile path strings in the ViewModel.
        Confirmation uses dx:BottomSheet and reports exact categories before execution. Implement this in src/Forge.Infrastructure/Storage,
        src/Forge.App/Features/Settings/Data using a typed PreferenceDescriptor or settings service rather than ad hoc key
        strings in pages. The Settings UI should compose dx:BottomSheet, dx:DXButton, dx:DXBorder, including dx:DataFormView,
        dx:ComboBoxEdit and dx:CheckEdit where appropriate, and persist only small non-sensitive values through Preferences.
        The tricky part is propagation: unit, theme and notification choices must refresh all surfaces without rewriting canonical
        health data. A careless implementation would duplicate E25 legal or delete flows, clear unrelated keys, or accumulate
        conversion drift.'
      touches:
      - src/Forge.Infrastructure/Storage
      - src/Forge.App/Features/Settings/Data
      devexpress:
      - dx:BottomSheet
      - dx:DXButton
      - dx:DXBorder
      - dx:DataFormView
      - dx:ComboBoxEdit
      - dx:CheckEdit
      apis:
      - Microsoft.Maui.Storage.Preferences
    testing:
    - Integration test clear cache preserves seeded profile-owned rows.
    - UI or integration test covers the denied, empty or interrupted path described by acceptance criteria.
    grounding:
    - title: .NET MAUI preferences
      url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/preferences
      note: Grounds storage of small non-sensitive local preference and onboarding flags.
