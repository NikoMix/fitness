- key: F09.03
  title: Apply periodisation and progression rules
  wave: 3
  summary: Progression turns exercise lists into programmes. Forge supports simple and advanced models with explicit maths
    so workout execution can compute next targets predictably.
  outcome: A plan can carry tested progression rules per exercise or block, and future targets are computed locally.
  stories:
  - key: S09.03.01
    title: Add linear and double progression models
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: newcomer
    userStory:
      asA: newcomer Forge user
      iWant: progression to be automatic and understandable
      soThat: I know what to do next time
    requirements:
    - Linear progression adds a configured load increment after all target sets are completed at or below target RPE.
    - Double progression increases reps within a range first, then increases load and resets reps to the lower bound.
    - The next target preview explains the calculation in the user's units.
    - Plan validation reruns after this change and warns when weekly push hard sets exceed pull hard sets by more than 2:1.
    - If required equipment becomes unavailable, the screen either proposes same-pattern substitutions or marks affected sessions
      as blocked before workout start.
    - Missed scheduled sessions remain neutral occurrence state and are never converted into completed workouts or deleted
      by this action.
    acceptanceCriteria:
    - id: AC1
      given: a 5x5 squat target at 60 kg with 2.5 kg increments
      when: all five sets are completed at RPE 8 or lower
      then: the next preview shows 62.5 kg for 5x5
    - id: AC2
      given: a 3x8-12 row target at 20 kg
      when: the user completes 12, 12 and 12 reps
      then: the next preview increases load and resets reps to 8
