  - key: S09.06.03
    title: Warn when a plan is badly skewed or unsafe
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: returner
    userStory:
      asA: returner Forge user
      iWant: to be warned about obvious imbalance
      soThat: I do not blindly follow a poor plan
    requirements:
    - Warn when push sets exceed pull sets by more than 2:1 for two consecutive weeks.
    - Warn when any major muscle group exceeds 30 hard sets per week or is below 4 sets in a hypertrophy plan.
    - Warnings include one suggested action and can be dismissed per plan version.
    - Plan validation reruns after this change and warns when weekly push hard sets exceed pull hard sets by more than 2:1.
    - If required equipment becomes unavailable, the screen either proposes same-pattern substitutions or marks affected sessions
      as blocked before workout start.
    - Missed scheduled sessions remain neutral occurrence state and are never converted into completed workouts or deleted
      by this action.
    acceptanceCriteria:
    - id: AC1
      given: a plan has 24 push sets and 8 pull sets
      when: quality is evaluated
      then: a push-pull warning shows ratio 3:1
    - id: AC2
      given: a warning is dismissed
      when: the same version reopens
      then: the warning remains dismissed and a new version evaluates again
    - id: AC3
      given: a Monday occurrence was missed and not completed
      when: the story workflow saves or previews the plan
      then: the missed occurrence remains visible with Move, Skip and Keep options and no workout log is created
    - id: AC4
      given: the plan uses barbell equipment and barbell is marked unavailable
      when: validation runs
      then: affected exercises show a substitute or blocked state before the user can start the workout
    - id: AC5
      given: a generated week has 24 push hard sets and 8 pull hard sets
      when: plan quality is evaluated
      then: a warning shows the push to pull ratio as 3:1 because it exceeds the 2:1 limit
    implementation:
      notes: 'Code lives in src/Forge.Core/Training/Plans/QualityRules, src/Forge.App/Features/Plans/PlanQuality/PlanWarningsView.xaml.
        Use dx:BottomSheet, dx:DXCollectionView only in Forge.App while domain and application stay plain DTOs. QualityRules
        are deterministic: pushPullRatio = pushHardSets / max(1, pullHardSets), warn when > 2.0; major muscle warn when hard
        sets > 30 or hypertrophy target muscles < 4. Store dismissals by planVersionId and warningCode. Copy says consider
        adding, not must, because this is not medical advice.'
      touches:
      - src/Forge.Core/Training/Plans/QualityRules
      - src/Forge.App/Features/Plans/PlanQuality/PlanWarningsView.xaml
      devexpress:
      - dx:BottomSheet
      - dx:DXCollectionView
      apis:
      - SQLite EF Core
    concerns:
    - a11y
    grounding:
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Documents the virtualized list and swipe action control used for long local lists.
