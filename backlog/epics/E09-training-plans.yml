- key: F09.06
  title: Evaluate plan quality and training load
  wave: 3
  summary: Forge warns when a plan is obviously lopsided or unrealistic. These checks are not medical advice, but they give
    users a safety and quality signal.
  outcome: Every plan shows estimated duration, weekly muscle-group volume and actionable warnings for extreme imbalance.
  stories:
  - key: S09.06.01
    title: Estimate session duration from sets and rest
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: newcomer
    userStory:
      asA: newcomer Forge user
      iWant: to know how long each session will take
      soThat: I pick a plan that fits my day
    requirements:
    - Estimated duration includes warm-up, effort time, rest, circuits and cooldown.
    - The estimate displays a range no wider than 20 percent for ordinary strength sessions.
    - Editing a day with 40 sets recalculates within 200 ms.
    - Plan validation reruns after this change and warns when weekly push hard sets exceed pull hard sets by more than 2:1.
    - If required equipment becomes unavailable, the screen either proposes same-pattern substitutions or marks affected sessions
      as blocked before workout start.
    - Missed scheduled sessions remain neutral occurrence state and are never converted into completed workouts or deleted
      by this action.
    acceptanceCriteria:
    - id: AC1
      given: a day has 15 sets, 90 s rest and 30 s effort per set
      when: duration is calculated
      then: the estimate is between 29 and 36 minutes
    - id: AC2
      given: a day has 40 sets
      when: rest changes from 60 s to 90 s
      then: duration updates within 200 ms
    - id: AC3
      given: a Monday occurrence was missed and not completed
      when: the story workflow saves or previews the plan
      then: the missed occurrence remains visible with Move, Skip and Keep options and no workout log is created
    - id: AC4
      given: the plan uses barbell equipment and barbell is marked unavailable
      when: validation runs
      then: affected exercises show a substitute or blocked state before the user can start the workout
    - id: AC5
      given: a generated week has 24 push hard sets and 8 pull hard sets
      when: plan quality is evaluated
      then: a warning shows the push to pull ratio as 3:1 because it exceeds the 2:1 limit
    implementation:
      notes: Code lives in src/Forge.Core/Training/Plans/SessionDurationEstimator.cs, src/Forge.App/Features/Plans/PlanQuality.
        Use dx:NumericEdit, dx:DXCollectionView only in Forge.App while domain and application stay plain DTOs. SessionDurationEstimator
        sums warmupSeconds + cooldownSeconds + set effort seconds + rest gaps + timed block seconds + transitions. Show a
        +/-10 percent range, so a 30 minute estimate displays 27 to 33 minutes. Recalculate 40-set edits within 200 ms. Rest
        is counted between sets, not after every final set.
      touches:
      - src/Forge.Core/Training/Plans/SessionDurationEstimator.cs
      - src/Forge.App/Features/Plans/PlanQuality
      devexpress:
      - dx:NumericEdit
      - dx:DXCollectionView
      apis:
      - SQLite EF Core
    concerns:
    - perf
    grounding:
    - title: DevExpress MAUI NumericEdit
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.NumericEdit
      note: Documents numeric input used for reps, load, RPE, rest and plan targets.
    testing:
    - Unit test the domain or application rule for valid, invalid and boundary values.
    - UI test the empty or first-run state and the one-handed save or preview path on Android and iOS.
    - Regression test missed-session, equipment-unavailable and push-pull imbalance warning scenarios.
  - key: S09.06.02
    title: Calculate weekly volume by muscle group
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: enthusiast
    userStory:
      asA: enthusiast Forge user
      iWant: to see set volume per muscle group
      soThat: I can spot gaps before stalls
    requirements:
    - Weekly volume counts hard sets per primary and secondary muscle group with secondary weighted at 0.5.
    - The view displays chest, back, quads, hamstrings, glutes, shoulders, biceps, triceps, calves and core.
    - A 150-prescription plan calculates volume within 300 ms.
    - Plan validation reruns after this change and warns when weekly push hard sets exceed pull hard sets by more than 2:1.
    - If required equipment becomes unavailable, the screen either proposes same-pattern substitutions or marks affected sessions
      as blocked before workout start.
    - Missed scheduled sessions remain neutral occurrence state and are never converted into completed workouts or deleted
      by this action.
    acceptanceCriteria:
    - id: AC1
      given: bench press has chest primary and triceps secondary for 3 sets
      when: volume is calculated
      then: chest increases by 3.0 and triceps by 1.5
    - id: AC2
      given: a 150-prescription plan
      when: the volume panel opens
      then: all totals render within 300 ms
    - id: AC3
      given: a Monday occurrence was missed and not completed
      when: the story workflow saves or previews the plan
      then: the missed occurrence remains visible with Move, Skip and Keep options and no workout log is created
    - id: AC4
      given: the plan uses barbell equipment and barbell is marked unavailable
      when: validation runs
      then: affected exercises show a substitute or blocked state before the user can start the workout
    - id: AC5
      given: a generated week has 24 push hard sets and 8 pull hard sets
      when: plan quality is evaluated
      then: a warning shows the push to pull ratio as 3:1 because it exceeds the 2:1 limit
    implementation:
      notes: Code lives in src/Forge.Core/Training/Plans/WeeklyVolumeCalculator.cs, src/Forge.Domain/Training/Exercises/MuscleGroup.cs.
        Use dx:DXCollectionView only in Forge.App while domain and application stay plain DTOs. WeeklyVolumeCalculator uses
        catalogue muscle metadata. Hard-set credit is primary muscle +1.0 per working set and secondary muscle +0.5; warm-ups
        and skipped sets count 0. Return MuscleGroupVolumeDto for dx:DXCollectionView. Never infer muscles from exercise names,
        because custom names and translations will be wrong.
      touches:
      - src/Forge.Core/Training/Plans/WeeklyVolumeCalculator.cs
      - src/Forge.Domain/Training/Exercises/MuscleGroup.cs
