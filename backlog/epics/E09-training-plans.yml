key: E09
title: Training Plan Builder and Programmes
domain: training
wave: 3
summary: Forge gives newcomers a safe path from zero to a structured training week, while giving experienced lifters enough
  control to build periodised programmes without a spreadsheet. Plans stay local, editable, schedulable and portable without
  any backend account.
problem: People churn when an app asks them to design a programme before they know the movements, volume or progression rule.
  Experienced users churn when template-only apps cannot represent the programme they already follow.
outcome: A user can pick or build a plan, understand its weekly demand, schedule it flexibly, adapt it when life or equipment
  changes, and start a workout from clear targets.
successMetrics:
- 80 percent of first-run users create or select a plan and schedule the first session in under 4 minutes.
- Plan validation calculates estimated duration and muscle-group volume for 100 exercises in under 300 ms.
- Plan export and import round-trip exercises, targets, progression rules and schedule metadata with zero loss.
nonGoals:
- No coach marketplace, remote publishing, account sync or backend sharing in v1.
- No generative AI plan creation in v1.
- No wearable companion plan editing in v1.
risks:
- risk: Progression rules are encoded in ViewModels and become impossible to test or reuse.
  mitigation: Put all programme maths in Forge.Domain and Forge.Core services, with ViewModels exposing DTOs only.
  severity: high
- risk: Flexible scheduling makes a missed workout feel like failure.
  mitigation: Model missed sessions as neutral reschedulable work and avoid guilt language.
  severity: medium
dependsOn:
- E01
grounding:
- &id005
  title: DevExpress Scheduler for .NET MAUI
  url: https://docs.devexpress.com/MAUI/403734
  note: Scheduler views back the plan calendar and occurrence display.
- &id001
  title: DevExpress MAUI DXCollectionView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
  note: Virtualized list control for exercises, templates, sets and swipe actions.
- &id003
  title: DevExpress MAUI NumericEdit
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.NumericEdit
  note: Numeric entry control for sets, reps, load, RPE and rest durations.
- &id002
  title: DevExpress MAUI BottomSheet
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.BottomSheet
  note: Bottom sheet control for quick actions without leaving the main flow.
- &id004
  title: DevExpress MAUI TabView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.TabView
  note: Tab control used for builder sections and workout subviews.
features:
- key: F09.01
  title: Offer ready-made programmes for common goals
  wave: 3
  summary: Curated templates let a newcomer start training without understanding programme design, while still showing enough
    detail to build trust before the first workout.
  outcome: The library contains goal-based templates that can be previewed, filtered and copied into an editable local plan.
  stories:
  - key: S09.01.01
    title: Seed beginner and goal-based programme templates
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: newcomer
    userStory:
      asA: newcomer Forge user
      iWant: to choose a proven plan for my goal
      soThat: I can start without building one from scratch
    requirements:
    - 'Seed at least seven templates: full-body beginner, upper/lower, push-pull-legs, strength 5x5, hypertrophy, home bodyweight-only
      and minimal-equipment.'
    - Each template includes goal, experience level, weekly frequency, estimated duration, equipment list and safety notes.
    - Template imports are versioned and never overwrite a customized user copy.
    - Plan validation reruns after this change and warns when weekly push hard sets exceed pull hard sets by more than 2:1.
    - If required equipment becomes unavailable, the screen either proposes same-pattern substitutions or marks affected sessions
      as blocked before workout start.
    - Missed scheduled sessions remain neutral occurrence state and are never converted into completed workouts or deleted
      by this action.
    acceptanceCriteria:
    - id: AC1
      given: a fresh install with an empty database
      when: template import completes
      then: at least seven templates are available within 2 s
    - id: AC2
      given: a user copy already exists
      when: a template version updates
      then: the user copy remains unchanged
    - id: AC3
      given: a Monday occurrence was missed and not completed
      when: the story workflow saves or previews the plan
      then: the missed occurrence remains visible with Move, Skip and Keep options and no workout log is created
    - id: AC4
      given: the plan uses barbell equipment and barbell is marked unavailable
      when: validation runs
      then: affected exercises show a substitute or blocked state before the user can start the workout
    - id: AC5
      given: a generated week has 24 push hard sets and 8 pull hard sets
      when: plan quality is evaluated
      then: a warning shows the push to pull ratio as 3:1 because it exceeds the 2:1 limit
    implementation:
      notes: 'Code lives in src/Forge.Infrastructure/Content/TrainingTemplates, src/Forge.Domain/Training/Plans, src/Forge.Core/Training/Plans.
        Use dx:DXCollectionView, dx:TabView only in Forge.App while domain and application stay plain DTOs. Import versioned
        compressed JSON templates through Forge.Infrastructure into PlanTemplate rows, then copy to UserTrainingPlan only
        when selected. Validate every template after import: duration sums effort, rest, warm-up and cooldown; quality warns
        when push:pull hard sets exceed 2:1. Do not reuse template row ids for user copies.'
      touches:
      - src/Forge.Infrastructure/Content/TrainingTemplates
      - src/Forge.Domain/Training/Plans
      - src/Forge.Core/Training/Plans
      devexpress:
      - dx:DXCollectionView
      - dx:TabView
      apis:
      - System.Text.Json
      - SQLite EF Core
    concerns:
    - offline
    testing:
    - Unit test template import idempotence.
    - Unit test the domain or application rule for valid, invalid and boundary values.
    - UI test the empty or first-run state and the one-handed save or preview path on Android and iOS.
    - Regression test missed-session, equipment-unavailable and push-pull imbalance warning scenarios.
    grounding:
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Documents the virtualized list and swipe action control used for long local lists.
