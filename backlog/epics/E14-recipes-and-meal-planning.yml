key: E14
title: Recipes and Meal Planning
domain: nutrition
wave: 4
summary: >-
  Forge builds on food logging with recipes, a curated starter collection, weekly planning, shopping lists, leftovers, conservative dietary filtering and
  local file import and export.
problem: >-
  Users cook and plan meals rather than eating isolated foods. Without recipes, meal planning and shopping lists, nutrition tracking becomes repetitive
  and the no-backend model risks trapping valuable user-created content on one device.
outcome: >-
  Users can create or choose recipes, scale servings, log meals, plan a week, generate shopping lists and move recipe files deliberately without a server
  account.
successMetrics:
- A 10 ingredient recipe can be created and logged in under 90 seconds during usability testing.
- A 7 day plan with 21 meals renders within 300 ms.
- A 50 ingredient shopping list aggregates within 200 ms.
nonGoals:
- No Forge backend, cloud sync, social database or server-side lookup in v1.
- No medical diagnosis, treatment plan or guaranteed health outcome.
- No desktop implementation in waves 1 to 5.
risks:
- risk: Recipe content could violate copyright.
  mitigation: Ship only original or properly licensed starter recipes and block builds on missing licence metadata.
  severity: high
- risk: Allergen filtering could imply certification.
  mitigation: Use conservative conflict and needs review labels, never safe or guaranteed labels.
  severity: critical
- risk: Unit aggregation could mislead shoppers.
  mitigation: Combine compatible units only and keep incompatible quantities separate for review.
  severity: medium
dependsOn: [E13]
grounding:
- title: Forge architecture overview
  url: https://github.com/NikoMix/fitness/blob/main/docs/architecture/overview.md
  note: Local-only architecture, SQLite, mobile platforms and 40 MB APK budget.
- title: DevExpress MAUI DXCollectionView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
  note: Virtualized lists for large local datasets.
- title: DevExpress MAUI AutoCompleteEdit
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.AutoCompleteEdit
  note: Asynchronous local search suggestions.
- title: DevExpress MAUI NumericEdit
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.NumericEdit
  note: Bounded numeric entry.
- title: DevExpress MAUI BottomSheet
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.BottomSheet
  note: Fast focused entry sheets.
- title: Creative Commons Attribution 4.0 International
  url: https://creativecommons.org/licenses/by/4.0/
  note: A suitable licence model when attribution metadata is present.
- title: MAUI file system helpers
  url: https://learn.microsoft.com/dotnet/maui/platform-integration/storage/file-system-helpers
  note: Local import and export file handling.

features:
- key: F14.01
  title: Create recipes and calculate nutrition
  wave: 4
  summary: >-
    Model recipes with ingredients, steps, servings and nutrition snapshots that reuse E13 portion math.
  outcome: >-
    The feature can be used offline on Android and iOS with deterministic local data and measurable performance.
  concerns: [privacy, perf, safety]
  stories:
  - key: S14.01.01
    title: Model recipes with ingredients and steps
    wave: 4
    size: l
    platforms: [android, ios]
    persona: team
    userStory:
      asA: "Forge developer"
      iWant: "model recipes with ingredients and steps"
      soThat: "the feature works locally, clearly and safely"
    requirements:
    - Store name, servings, ingredients, steps, prep time and cook time.
    - Link ingredients to foods or free-text rows.
    - Calculate whole-recipe and per-serving nutrients.
    - The flow must work fully offline from the local SQLite store and must not call a Forge backend.
    - Visible text and accessibility labels must use neutral, non-judgemental wording and expose the same redacted values.
    - Recipe and ingredient data must retain source, author, licence and modification metadata where applicable.
    acceptanceCriteria:
    - id: AC1
      given: 2 servings total 800 calories
      when: nutrition is calculated
      then: per-serving calories equal 400 within 0.5 calories
    - id: AC2
      given: a logged recipe is edited
      when: old log opens
      then: the original snapshot is unchanged
    - id: AC3
      given: the device is in airplane mode
      when: the user completes model recipes with ingredients and steps
      then: the action succeeds using only local data or shows a recoverable local-only state
    - id: AC4
      given: a screen reader is enabled
      when: the main controls are focused
      then: labels include the visible units, state and actions without hidden or contradictory values
    implementation:
      notes: >-
        Implement ModelRecipesWithIngredientsAndStepsPage and ModelRecipesWithIngredientsAndStepsViewModel in src/Forge.App/Features/Nutrition, with use
        cases in src/Forge.Core/Nutrition and entities or policies in src/Forge.Domain/Nutrition. Use DevExpress MAUI controls only in the App layer
        and local SQLite services while keeping DevExpress types out of Application. Add Recipe, RecipeIngredient and RecipeStep aggregates in Domain and
        reuse E13 portion conversion. Persist log snapshots so recipe edits never rewrite history. The tricky part is preserving Forge's local-first, safety-conscious
        behavior under offline, interrupted and permission-denied paths. A careless implementation would hide validation in XAML, lose source metadata,
        leak private or hidden values through accessibility text, or call a backend that does not exist.
      touches:
      - src/Forge.Domain/Nutrition
      - src/Forge.Core/Nutrition
      - src/Forge.App/Features/Nutrition
      apis: []
      devexpress: []
    testing:
    - Add unit and UI coverage for S14.01.01 acceptance criteria including offline and error paths.
    - Add boundary tests for S14.01.01 covering offline operation, interrupted state, accessibility labels and all numeric thresholds in the 
      acceptance criteria.
    grounding:
    - title: Forge architecture overview
      url: https://github.com/NikoMix/fitness/blob/main/docs/architecture/overview.md
      note: Confirms Forge is local-only, Android and iOS first, with SQLite and mobile performance budgets.
    - title: Creative Commons Attribution 4.0 International
      url: https://creativecommons.org/licenses/by/4.0/
      note: Grounds attribution obligations for compatible starter recipe content.
    - title: USDA FoodData Central API guide and licensing
      url: https://fdc.nal.usda.gov/api-guide/
      note: Grounds use of FoodData Central public domain data and citation metadata.
    - title: Open Food Facts data reuse terms
      url: https://world.openfoodfacts.org/data
      note: Grounds ODbL, DbCL, attribution and share-alike duties for barcode food data.
  - key: S14.01.02
    title: Build a recipe editor with draft autosave
