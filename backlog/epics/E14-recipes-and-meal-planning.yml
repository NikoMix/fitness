      iWant: "bundle an attributed starter collection"
      soThat: "the feature works locally, clearly and safely"
    requirements:
    - Bundle at least 40 recipes across high-protein, budget, quick, vegetarian and vegan tags.
    - Each recipe includes author, source, licence and modification notes.
    - Compressed starter recipe assets stay under 2 MB.
    - The flow must work fully offline from the local SQLite store and must not call a Forge backend.
    - Visible text and accessibility labels must use neutral, non-judgemental wording and expose the same redacted values.
    - Recipe and ingredient data must retain source, author, licence and modification metadata where applicable.
    acceptanceCriteria:
    - id: AC1
      given: seed content builds
      when: licence check runs
      then: every recipe has non-empty licence and attribution
    - id: AC2
      given: fresh install is offline
      when: Recipes opens
      then: starter recipes render and search within 300 ms
    - id: AC3
      given: the device is in airplane mode
      when: the user completes bundle an attributed starter collection
      then: the action succeeds using only local data or shows a recoverable local-only state
    - id: AC4
      given: a screen reader is enabled
      when: the main controls are focused
      then: labels include the visible units, state and actions without hidden or contradictory values
    implementation:
      notes: >-
        Implement BundleAnAttributedStarterCollectionPage and BundleAnAttributedStarterCollectionViewModel in src/Forge.App/Features/Nutrition, with use
        cases in src/Forge.Core/Nutrition and entities or policies in src/Forge.Domain/Nutrition. Use dx:DXCollectionView and MAUI file system helpers
        while keeping DevExpress types out of Application. Store original or properly licensed recipes as versioned compressed JSON. Exclude photos in v1
        to avoid size and licensing complexity. The tricky part is preserving Forge's local-first, safety-conscious behavior under offline, interrupted
        and permission-denied paths. A careless implementation would hide validation in XAML, lose source metadata, leak private or hidden values through
        accessibility text, or call a backend that does not exist.
      touches:
      - src/Forge.Domain/Nutrition
      - src/Forge.Core/Nutrition
      - src/Forge.App/Features/Nutrition
      devexpress:
      - dx:DXCollectionView
      apis:
      - MAUI file system helpers
    testing:
    - Add unit and UI coverage for S14.02.01 acceptance criteria including offline and error paths.
    - Add boundary tests for S14.02.01 covering offline operation, interrupted state, accessibility labels and all numeric thresholds in the 
      acceptance criteria.
    grounding:
    - title: Forge architecture overview
      url: https://github.com/NikoMix/fitness/blob/main/docs/architecture/overview.md
      note: Confirms Forge is local-only, Android and iOS first, with SQLite and mobile performance budgets.
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Grounds virtualized collection rendering for local food, recipe, reminder and history lists.
    - title: Creative Commons Attribution 4.0 International
      url: https://creativecommons.org/licenses/by/4.0/
      note: Grounds attribution obligations for compatible starter recipe content.
    - title: USDA FoodData Central API guide and licensing
      url: https://fdc.nal.usda.gov/api-guide/
      note: Grounds use of FoodData Central public domain data and citation metadata.
    - title: Open Food Facts data reuse terms
      url: https://world.openfoodfacts.org/data
      note: Grounds ODbL, DbCL, attribution and share-alike duties for barcode food data.
  - key: S14.02.02
    title: Filter recipes by goal and preference tags
    wave: 4
    size: s
    platforms: [android, ios]
    persona: newcomer
    userStory:
      asA: "Forge user"
      iWant: "filter recipes by goal and preference tags"
      soThat: "the feature works locally, clearly and safely"
    requirements:
    - Support high-protein, budget, quick, vegetarian, vegan and meal prep filters.
    - Tags are curated metadata, not title matching.
    - Filter 1000 recipes within 150 ms.
    - The flow must work fully offline from the local SQLite store and must not call a Forge backend.
    - Visible text and accessibility labels must use neutral, non-judgemental wording and expose the same redacted values.
    - Recipe and ingredient data must retain source, author, licence and modification metadata where applicable.
    - Allergen handling must be conservative and must state that data can be incomplete and is not a certified safety guarantee.
    - Unknown allergen metadata must be surfaced as needs review, not hidden or labelled safe.
