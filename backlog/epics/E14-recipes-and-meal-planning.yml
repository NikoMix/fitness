        local SQLite services while keeping DevExpress types out of Application. Build the preview from the same DTO that will be serialized so user approval
        matches actual contents. Use a final BottomSheet before platform share. The tricky part is preserving Forge's local-first, safety-conscious behavior
        under offline, interrupted and permission-denied paths. A careless implementation would hide validation in XAML, lose source metadata, leak private
