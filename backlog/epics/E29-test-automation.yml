key: E29
title: Quality Engineering and Test Automation
domain: quality
wave: 1
summary: Forge needs a test system that protects local-only fitness data, calculation correctness and the critical workout
  journeys without making every change wait on fragile device automation.
problem: Users will trust Forge with workouts, nutrition and health-derived context. A regression in maths, persistence or
  workout flow can erase progress or give misleading feedback, and manual testing alone will not scale as features land in
  parallel.
outcome: Core logic is covered by fast deterministic tests, persistence is verified against SQLite, critical journeys are
  smoke-tested on Android and iOS, and release candidates carry clear quality evidence.
successMetrics:
- Forge.Domain maintains at least 90 percent line coverage and 85 percent branch coverage.
- Inner-layer unit tests complete in less than 60 seconds on the verified developer machine.
- Release candidates have a completed Android and iOS device matrix with zero unowned critical defects.
- Quarantined tests are fixed or removed within 14 days.
nonGoals:
- No attempt to automate every visual edge case in v1; brittle UI paths are covered by exploratory charters.
- No backend test environment, because Forge has no v1 backend.
- No vanity coverage target for XAML or generated platform code.
risks:
- risk: MAUI UI automation proves brittle and slows development.
  mitigation: Keep automated UI coverage to smoke journeys, rely on accessibility identifiers, and backfill with manual exploratory
    charters.
  severity: high
- risk: SQLite integration tests diverge from encrypted production database behaviour.
  mitigation: Use the real SQLite provider for repositories and add SQLCipher-specific smoke coverage when encryption lands.
  severity: medium
grounding:
- title: xUnit.net v3
  url: https://xunit.net/docs/getting-started/v3/getting-started
  note: Official xUnit v3 project and runner guidance.
- title: EF Core SQLite provider
  url: https://learn.microsoft.com/ef/core/providers/sqlite/
  note: Repository tests must use real SQLite semantics.
- title: Appium documentation
  url: https://appium.io/docs/en/latest/
  note: Candidate mobile UI automation framework for Android and iOS.
features:
- key: F29.01
  title: Make inner-layer tests fast and meaningful
  wave: 1
  summary: Build deterministic tests around Forge.Domain and Forge.Core so core rules can be changed without launching
    a device.
  outcome: Domain and application tests run on net10.0 in under 60 seconds and catch calculation, validation and boundary
    regressions.
  concerns:
  - quality
  - architecture
  stories:
  - key: S29.01.01
    title: Create xUnit v3 test projects for domain and application rules
    wave: 1
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer changing Forge business rules
      iWant: a fast test harness with clear fixtures and assertions
      soThat: I can refactor logic without waiting for a device build
    requirements:
    - Forge.Domain.Tests and Forge.Core.Tests target net10.0 only and use xUnit v3, FluentAssertions and NSubstitute
      from Directory.Packages.props.
    - The full inner-layer unit suite completes in less than 60 seconds on the verified developer machine.
    - Forge.Domain calculation and validation code has at least 90 percent line coverage and 85 percent branch coverage.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a clean clone with packages restored
      when: dotnet test runs for Forge.Domain.Tests and Forge.Core.Tests
      then: both projects pass with zero skipped tests in less than 60 seconds
    - id: AC2
      given: a pull request reduces Forge.Domain calculation coverage below 90 percent
      when: the coverage gate runs
      then: the build fails and names Forge.Domain as below threshold
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.01.01 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Create the test projects under tests/ and keep them independent of MAUI so they run on a plain net10.0 runner.
        Use FluentAssertions for readable value-object assertions and NSubstitute only at application boundaries, not inside
        Forge.Domain. Implementation should keep the primary code in tests/Forge.Domain.Tests/Forge.Domain.Tests.csproj, tests/Forge.Core.Tests/Forge.Core.Tests.csproj,
        tests/Forge.Testing/ and use xUnit v3, FluentAssertions, NSubstitute. The tricky part is preserving fast plain net10.0
        feedback while treating MAUI device automation as a small smoke suite, not a full web-style UI net. Use deterministic
        builders, seeded inputs and explicit failure messages. A careless implementation would assert localized visible text,
        overmock domain logic, ignore architecture leaks or let quarantined failures disappear from release evidence.
      touches:
      - tests/Forge.Domain.Tests/Forge.Domain.Tests.csproj
      - tests/Forge.Core.Tests/Forge.Core.Tests.csproj
      - tests/Forge.Testing/
      apis:
      - xUnit v3
      - FluentAssertions
      - NSubstitute
    testing:
    - Add a CI command that runs the net10.0 unit tests before any device build starts.
    grounding:
    - title: Fluent Assertions introduction
      url: https://fluentassertions.com/introduction
      note: Assertion style for readable tests.
  - key: S29.01.02
    title: Add architecture tests that block UI references in inner layers
    wave: 1
    size: s
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer protecting the clean architecture boundary
      iWant: tests that fail when MAUI or DevExpress leaks inward
      soThat: the dependency rule is enforced automatically on every pull request
    requirements:
    - Forge.Domain and Forge.Core reference no assembly whose name starts with Microsoft.Maui, DevExpress.Maui or DevExpress.Xamarin.
    - Public application contracts expose only primitive, domain or application DTO types, never MAUI or DevExpress types.
    - The architecture test fails in under 5 seconds when an illegal reference is introduced.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: Forge.Core references DevExpress.Maui.Controls
      when: the architecture tests run
      then: the test fails and the message contains DevExpress.Maui.Controls and Forge.Core
    - id: AC2
      given: an application contract returns a DevExpress type
      when: the public API scan runs
      then: the test fails and names the leaking member
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.01.02 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Add reflection-based tests that scan AssemblyName references and public signatures from Forge.Domain and Forge.Core.
        Keep failure messages explicit because this test teaches future contributors the architecture rule at build time.
        Implementation should keep the primary code in tests/Forge.Domain.Tests/Architecture/DependencyRuleTests.cs, tests/Forge.Core.Tests/Architecture/DependencyRuleTests.cs
        and use xUnit v3, FluentAssertions. The tricky part is preserving fast plain net10.0 feedback while treating MAUI
        device automation as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs and
        explicit failure messages. A careless implementation would assert localized visible text, overmock domain logic, ignore
        architecture leaks or let quarantined failures disappear from release evidence.
      touches:
      - tests/Forge.Domain.Tests/Architecture/DependencyRuleTests.cs
      - tests/Forge.Core.Tests/Architecture/DependencyRuleTests.cs
      apis:
      - xUnit v3
      - FluentAssertions
    testing:
    - Include a negative fixture or generated sample proving MAUI and DevExpress references fail the guard.
    grounding:
    - title: xUnit.net v3
      url: https://xunit.net/docs/getting-started/v3/getting-started
      note: Official guidance for xUnit v3 test projects and runners used by the automated test suite.
  - key: S29.01.03
    title: Cover calculations with snapshot and approval tests
    wave: 1
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer changing strength or nutrition formulas
      iWant: approved examples for calculations that users will notice
      soThat: formula changes are reviewed deliberately rather than drifting by accident
    requirements:
    - Snapshot files cover at least 20 representative 1RM, volume, unit conversion and nutrition calculations.
    - Snapshots store rounded display values and raw decimal values.
    - A changed snapshot requires explicit reviewer approval in the pull request.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: the 1RM output changes for a 100 kg by 5 reps example
      when: snapshot tests run
      then: the test fails with a diff showing previous and new raw values
    - id: AC2
      given: calculation tests run under en-US and de-DE cultures
      when: approved raw values are compared
      then: both culture runs produce identical raw values
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.01.03 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Store approval files under tests/Forge.Domain.Tests/Approvals with deterministic inputs and stable ordering.
        Snapshot only meaningful calculation outputs, never whole objects that include clocks, random identifiers or incidental
        formatting. Implementation should keep the primary code in tests/Forge.Domain.Tests/Approvals/, tests/Forge.Domain.Tests/Calculations/
        and use Verify.Xunit. The tricky part is preserving fast plain net10.0 feedback while treating MAUI device automation
        as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs and explicit failure
        messages. A careless implementation would assert localized visible text, overmock domain logic, ignore architecture
        leaks or let quarantined failures disappear from release evidence.
      touches:
      - tests/Forge.Domain.Tests/Approvals/
      - tests/Forge.Domain.Tests/Calculations/
      apis:
      - Verify.Xunit
    testing:
    - Run approval tests in CI and block uncommitted snapshot changes.
    grounding:
    - title: xUnit.net v3
      url: https://xunit.net/docs/getting-started/v3/getting-started
      note: Official guidance for xUnit v3 test projects and runners used by the automated test suite.
  - key: S29.01.04
    title: Add property-based tests for conversions and 1RM maths
    wave: 1
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer maintaining numerical fitness logic
      iWant: generated edge cases for units and formulas
      soThat: unexpected combinations are caught before users see impossible numbers
    requirements:
    - Round-tripping kg to lb to kg differs by less than 0.01 kg for 1,000 generated values between 0.1 kg and 500 kg.
    - One-rep max estimates are monotonic for valid load and rep ranges.
    - Zero load, negative reps and reps above 30 are rejected with domain validation errors.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: 1,000 generated weight values between 0.1 kg and 500 kg
      when: kg to lb to kg round-tripping completes
      then: every result is within 0.01 kg of the original
    - id: AC2
      given: a generated set increases load while keeping reps constant
      when: the 1RM property is evaluated
      then: the estimated 1RM is greater than or equal to the previous value
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.01.04 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Add FsCheck properties for mathematical invariants and constrain generators to plausible human input. Print the
        replay seed on failure so rare counterexamples reproduce locally and in GitHub Actions. Implementation should keep
        the primary code in tests/Forge.Domain.Tests/Properties/UnitConversionProperties.cs, tests/Forge.Domain.Tests/Properties/OneRepMaxProperties.cs
        and use FsCheck.Xunit. The tricky part is preserving fast plain net10.0 feedback while treating MAUI device automation
        as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs and explicit failure
        messages. A careless implementation would assert localized visible text, overmock domain logic, ignore architecture
        leaks or let quarantined failures disappear from release evidence.
      touches:
      - tests/Forge.Domain.Tests/Properties/UnitConversionProperties.cs
      - tests/Forge.Domain.Tests/Properties/OneRepMaxProperties.cs
      apis:
      - FsCheck.Xunit
    testing:
    - Run at least 1,000 generated cases per property in CI.
    grounding:
    - title: FsCheck documentation
      url: https://fscheck.github.io/FsCheck/
      note: Property-based testing framework for .NET.
- key: F29.02
  title: Exercise persistence and ViewModel behaviour
  wave: 1
  summary: 'Test the infrastructure and presentation seams where bugs usually hide: EF Core SQLite persistence, repository
    transactions and ViewModel command state.'
  outcome: Repository and ViewModel changes are verified without brittle UI tests and with realistic SQLite behaviour.
  concerns:
  - data
  - quality
  stories:
  - key: S29.02.01
    title: Test EF Core repositories against SQLite
    wave: 1
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer changing persistence code
      iWant: repository tests that use real SQLite semantics
      soThat: queries, constraints and migrations fail in tests before corrupting local user data
    requirements:
    - Repository tests use SQLite in-memory or file-backed databases with EF Core migrations applied.
    - Tests cover insert, update, delete, transaction rollback and unique constraint violations.
    - Each test cleans up its database files and leaves no files outside the repository workspace.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a repository saves two entities violating a unique index
      when: the SQLite integration test runs
      then: the expected constraint exception is observed and no partial aggregate is persisted
    - id: AC2
      given: a transaction throws after saving the first set
      when: the rollback test runs
      then: zero sets from that transaction remain in SQLite
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.02.01 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Use Microsoft.Data.Sqlite and EF Core SQLite rather than the EF Core in-memory provider, because relational constraints
        and query plans matter for Forge's local database. Put file-backed databases under the test output folder only when
        WAL or migration behaviour must be inspected. Implementation should keep the primary code in tests/Forge.Infrastructure.Tests/Repositories/,
        src/Forge.Infrastructure/Persistence/ and use Microsoft.Data.Sqlite, Microsoft.EntityFrameworkCore.Sqlite. The tricky
        part is preserving fast plain net10.0 feedback while treating MAUI device automation as a small smoke suite, not a
        full web-style UI net. Use deterministic builders, seeded inputs and explicit failure messages. A careless implementation
        would assert localized visible text, overmock domain logic, ignore architecture leaks or let quarantined failures
        disappear from release evidence.
      touches:
      - tests/Forge.Infrastructure.Tests/Repositories/
      - src/Forge.Infrastructure/Persistence/
      apis:
      - Microsoft.Data.Sqlite
      - Microsoft.EntityFrameworkCore.Sqlite
    testing:
    - Run repository tests after unit tests and before MAUI target builds.
    grounding:
    - title: EF Core testing
      url: https://learn.microsoft.com/ef/core/testing/
      note: Explains test strategies and why provider behaviour matters for persistence tests.
  - key: S29.02.02
    title: Add deterministic test data builders
    wave: 1
    size: s
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer writing tests for workouts and nutrition
      iWant: builders that create realistic but safe domain data
      soThat: tests stay readable and do not rely on copied object graphs
    requirements:
    - Builders live in tests/Forge.Testing and are not referenced by production projects.
    - Every builder has deterministic defaults and allows overriding IDs, timestamps and user-entered values.
    - A standard workout builder creates at least one exercise, three sets and rest intervals without personal data.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a test creates a default workout through the builder
      when: the object is inspected
      then: it contains one exercise, three sets and no free-text personal note
    - id: AC2
      given: two tests run in parallel using builders
      when: 10,000 IDs are generated
      then: no generated IDs collide
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.02.02 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Create small fluent builders for domain aggregates, not one global ObjectMother. Defaults should reflect plausible
        fitness data while keeping personally identifying text out of fixtures. Clock and ID generation must be overridable.
        Implementation should keep the primary code in tests/Forge.Testing/Builders/WorkoutBuilder.cs, tests/Forge.Testing/Builders/NutritionBuilder.cs
        and use xUnit v3, FluentAssertions. The tricky part is preserving fast plain net10.0 feedback while treating MAUI
        device automation as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs and
        explicit failure messages. A careless implementation would assert localized visible text, overmock domain logic, ignore
        architecture leaks or let quarantined failures disappear from release evidence.
      touches:
      - tests/Forge.Testing/Builders/WorkoutBuilder.cs
      - tests/Forge.Testing/Builders/NutritionBuilder.cs
      apis:
      - xUnit v3
      - FluentAssertions
    testing:
    - Add builder self-tests for determinism and uniqueness.
    grounding:
    - title: xUnit.net v3
      url: https://xunit.net/docs/getting-started/v3/getting-started
      note: Official guidance for xUnit v3 test projects and runners used by the automated test suite.
  - key: S29.02.03
    title: Verify ViewModel commands and validation without MAUI handlers
    wave: 1
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer changing screen behaviour
      iWant: ViewModel tests that exercise commands, validation and navigation
      soThat: presentation logic is tested without loading XAML or device handlers
    requirements:
    - ViewModel tests instantiate ViewModels through dependency injection with substituted application services.
    - Command tests assert busy state, validation messages and navigation calls for success, failure and cancellation paths.
    - No ViewModel test references Microsoft.Maui.Controls or DevExpress.Maui namespaces.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a set logging command is executed with an invalid weight
      when: the ViewModel test runs
      then: the save service is not called and exactly one validation message is exposed
    - id: AC2
      given: a save service throws a recoverable exception
      when: the command is executed
      then: IsBusy returns to false and the error state is visible
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.02.03 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Keep ViewModels as plain C# classes and move handler-specific logic into thin page code-behind. Tests should
        build app service registration where possible, substituting navigation, dialogs and clocks at application boundaries.
        Implementation should keep the primary code in tests/Forge.App.Tests/ViewModels/, src/Forge.App/Features/*/*ViewModel.cs
        and use CommunityToolkit.Mvvm, NSubstitute. The tricky part is preserving fast plain net10.0 feedback while treating
        MAUI device automation as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs
        and explicit failure messages. A careless implementation would assert localized visible text, overmock domain logic,
        ignore architecture leaks or let quarantined failures disappear from release evidence.
      touches:
      - tests/Forge.App.Tests/ViewModels/
      - src/Forge.App/Features/*/*ViewModel.cs
      apis:
      - CommunityToolkit.Mvvm
      - NSubstitute
    testing:
    - Add command tests for the workout and nutrition ViewModels as they are introduced.
    grounding:
    - title: xUnit.net v3
      url: https://xunit.net/docs/getting-started/v3/getting-started
      note: Official guidance for xUnit v3 test projects and runners used by the automated test suite.
  - key: S29.02.04
    title: Define coverage thresholds that reward valuable tests
    wave: 1
    size: s
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: technical lead reviewing quality signals
      iWant: coverage gates that focus on logic instead of generated UI
      soThat: the team improves risk coverage rather than chasing vanity percentages
    requirements:
    - Forge.Domain line coverage is at least 90 percent and branch coverage is at least 85 percent.
    - Forge.Core line coverage is at least 80 percent for use cases and validators.
    - Forge.App XAML and generated code are excluded from global coverage calculations.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a pull request adds untested domain validation branches
      when: coverage is calculated
      then: the domain branch coverage gate fails below 85 percent
    - id: AC2
      given: a pull request only changes XAML layout
      when: coverage is calculated
      then: the build does not fail solely because XAML has no line coverage
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.02.04 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Configure coverage at project level so the signal is stable across machines. Publish Cobertura or lcov output
        as a pull request artefact, but make thresholds explicit in CI rather than relying on a third-party dashboard. Implementation
        should keep the primary code in Directory.Build.props, tests/Directory.Build.props, .github/workflows/pr.yml and use
        coverlet.collector. The tricky part is preserving fast plain net10.0 feedback while treating MAUI device automation
        as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs and explicit failure
        messages. A careless implementation would assert localized visible text, overmock domain logic, ignore architecture
        leaks or let quarantined failures disappear from release evidence.
      touches:
      - Directory.Build.props
      - tests/Directory.Build.props
      - .github/workflows/pr.yml
      apis:
      - coverlet.collector
    testing:
    - Add a CI step that fails when configured domain or application thresholds are missed.
    grounding:
    - title: xUnit.net v3
      url: https://xunit.net/docs/getting-started/v3/getting-started
      note: Official guidance for xUnit v3 test projects and runners used by the automated test suite.
- key: F29.03
  title: Automate critical journeys on real devices
  wave: 1
  summary: Add a pragmatic UI automation lane for flows that must not regress, while recognising that .NET MAUI UI testing
    is less mature than web testing.
  outcome: Critical journeys are smoke-tested on Android and iOS devices, with a clear fallback to manual charters where automation
    is brittle.
  concerns:
  - quality
  - device
  stories:
  - key: S29.03.01
    title: Automate smoke journeys with Appium or MAUI test utilities
    wave: 1
    size: l
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer validating an app build
      iWant: a small automated device suite for the highest-value journeys
      soThat: regressions are caught without pretending every gesture can be tested reliably
    requirements:
    - Automated UI smoke tests cover first launch, start workout, log set, finish workout and add food entry.
    - The suite runs against one Android device lane and one iOS device lane in under 20 minutes.
    - Selectors use stable accessibility identifiers rather than visible text where possible.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a signed debug build is installed on the Android device lane
      when: the smoke suite runs
      then: first launch through finishing a workout passes in under 20 minutes
    - id: AC2
      given: a UI test fails twice for the same selector without product code changes
      when: the flaky-test policy is applied
      then: the test is moved to quarantine and a tracking issue is created within 24 hours
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.03.01 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Prefer Appium 2 if it proves stable for both platforms, but keep the suite intentionally small because MAUI automation
        can be fragile around handlers and virtualized controls. Assign AutomationId values in XAML for every element under
        test. Implementation should keep the primary code in tests/Forge.UiTests/, src/Forge.App/Features/*/*.xaml, .github/workflows/device-tests.yml
        and use Appium 2, Microsoft.Maui.TestUtils. The tricky part is preserving fast plain net10.0 feedback while treating
        MAUI device automation as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs
        and explicit failure messages. A careless implementation would assert localized visible text, overmock domain logic,
        ignore architecture leaks or let quarantined failures disappear from release evidence.
      touches:
      - tests/Forge.UiTests/
      - src/Forge.App/Features/*/*.xaml
      - .github/workflows/device-tests.yml
      apis:
      - Appium 2
      - Microsoft.Maui.TestUtils
    testing:
    - Run smoke UI tests nightly and before release candidates, not on every documentation pull request.
    grounding:
    - title: Appium documentation
      url: https://appium.io/docs/en/latest/
      note: Official Appium 2 documentation for cross-platform mobile UI automation.
  - key: S29.03.02
    title: Define Android and iOS device test matrix
    wave: 1
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: release owner preparing a candidate build
      iWant: a realistic device matrix covering oldest supported versions and constrained hardware
      soThat: mobile-only v1 quality is measured on devices like users own
    requirements:
    - The matrix includes Android API 26 or the oldest practical supported device, one mid-tier Android device and one low-end
      Android device with no more than 4 GB RAM.
    - The matrix includes iOS 15 and the latest supported iOS on physical or hosted devices.
    - Emulator setup uses physical devices first or WHPX-backed AVDs; it never requires disabling Hyper-V.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: the device matrix document is reviewed
      when: Android setup instructions are inspected
      then: they mention physical devices or WHPX-backed AVDs and contain no instruction to disable Hyper-V
    - id: AC2
      given: a release candidate is tested
      when: the matrix report is completed
      then: each required row has build number, OS version, tester and pass or fail recorded
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.03.02 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Create docs/quality/device-matrix.md and wire CI labels to automated lanes. The verified environment has Hyper-V
        in use, so Android emulator guidance must use WHPX-compatible AVDs or physical devices and never legacy acceleration
        that conflicts with virtualization. Implementation should keep the primary code in docs/quality/device-matrix.md,
        .github/workflows/device-tests.yml and use xUnit v3, FluentAssertions. The tricky part is preserving fast plain net10.0
        feedback while treating MAUI device automation as a small smoke suite, not a full web-style UI net. Use deterministic
        builders, seeded inputs and explicit failure messages. A careless implementation would assert localized visible text,
        overmock domain logic, ignore architecture leaks or let quarantined failures disappear from release evidence.
      touches:
      - docs/quality/device-matrix.md
      - .github/workflows/device-tests.yml
      apis:
      - xUnit v3
      - FluentAssertions
    testing:
    - Review matrix coverage before every release candidate.
    grounding:
    - title: Android Studio run apps on a hardware device
      url: https://developer.android.com/studio/run/device
