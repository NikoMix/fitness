      when: the checklist is inspected
      then: the risk has an owner, mitigation and expiry date no later than 14 days after release
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.04.03 failure message identifies the test area, owner and remediation evidence needed
