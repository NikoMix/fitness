  - key: S29.04.03
    title: Gate release candidates on completed quality evidence
    wave: 1
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: release owner promoting a build
      iWant: a release checklist backed by test artefacts
      soThat: I know the candidate met the agreed bar before store submission
    requirements:
    - A release candidate cannot be tagged unless unit, integration, architecture, coverage and device matrix checks are green
      for the same commit.
    - Manual exploratory charter evidence is linked for Android and iOS before promotion.
    - Any accepted risk includes owner, expiry date and mitigation.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
