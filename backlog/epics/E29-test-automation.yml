  - key: S29.03.03
    title: Capture a manual exploratory charter for workout flow
    wave: 1
    size: s
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: tester exploring Forge before release
      iWant: a time-boxed charter focused on the riskiest workout behaviours
      soThat: human judgement catches interruptions and edge cases automation misses
    requirements:
    - The charter covers a 45-minute session including start, pause, rest timer, set edits, app backgrounding, low battery
      and process death.
    - The charter includes at least 10 explicit probes and records notes, screenshots and build number.
    - At least one exploratory pass is completed on Android and one on iOS for every release candidate.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a tester follows the charter for 45 minutes
      when: completed notes are submitted
      then: they include build number, device, OS version and at least 10 probe outcomes
    - id: AC2
      given: the app is backgrounded mid-rest timer during the charter
      when: the tester resumes it
      then: notes record whether timer and workout state remained correct
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.03.03 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: 'Store the charter as a living checklist in docs/quality. It should deliberately include interruptions that automation
        rarely covers: app switch, low power mode, denied notification permission and force kill during a workout. Implementation
        should keep the primary code in docs/quality/workout-exploratory-charter.md and use xUnit v3, FluentAssertions. The
        tricky part is preserving fast plain net10.0 feedback while treating MAUI device automation as a small smoke suite,
        not a full web-style UI net. Use deterministic builders, seeded inputs and explicit failure messages. A careless implementation
        would assert localized visible text, overmock domain logic, ignore architecture leaks or let quarantined failures
        disappear from release evidence.'
      touches:
      - docs/quality/workout-exploratory-charter.md
      apis:
      - xUnit v3
      - FluentAssertions
    testing:
    - Require completed charter evidence before promoting a release candidate.
    grounding:
    - title: xUnit.net v3
      url: https://xunit.net/docs/getting-started/v3/getting-started
      note: Official guidance for xUnit v3 test projects and runners used by the automated test suite.
  - key: S29.03.04
    title: Track and quarantine flaky tests with ownership
    wave: 1
    size: s
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer affected by an intermittent failure
      iWant: a written policy for retries, quarantine and ownership
      soThat: CI failures remain trusted and do not become background noise
    requirements:
    - A test that fails intermittently on two separate commits within 7 days is labelled flaky and assigned an owner.
    - Blocking test retries are limited to one retry per run.
    - Quarantined tests are reported separately and must be fixed or deleted within 14 days.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a UI test fails intermittently on two commits in one week
      when: the policy is applied
      then: the test has an owner and a quarantine or fix issue within 24 hours
    - id: AC2
      given: a quarantined test remains unfixed after 14 days
      when: the quality report runs
      then: the report marks the test as overdue and blocks release candidate promotion
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.03.04 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Implement the policy in documentation and CI output. Retries should expose flakiness, not hide it. Quarantined
        tests should not block routine pull requests, but they must block release readiness if stale. Implementation should
        keep the primary code in docs/quality/flaky-test-policy.md, .github/workflows/pr.yml, .github/workflows/device-tests.yml
        and use xUnit v3, FluentAssertions. The tricky part is preserving fast plain net10.0 feedback while treating MAUI
        device automation as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs and
        explicit failure messages. A careless implementation would assert localized visible text, overmock domain logic, ignore
        architecture leaks or let quarantined failures disappear from release evidence.
      touches:
      - docs/quality/flaky-test-policy.md
      - .github/workflows/pr.yml
      - .github/workflows/device-tests.yml
      apis:
      - xUnit v3
      - FluentAssertions
    testing:
    - Add a sample quarantined test entry to prove reporting works.
    grounding:
    - title: xUnit.net v3
      url: https://xunit.net/docs/getting-started/v3/getting-started
      note: Official guidance for xUnit v3 test projects and runners used by the automated test suite.
- key: F29.04
  title: Make quality visible in pull requests and releases
  wave: 1
  summary: Publish the right test evidence at the right time so developers, testers and release owners can judge risk before
    merging or shipping.
  outcome: Every pull request and release candidate has a concise, inspectable quality signal tied to tests, devices and known
    risks.
  concerns:
  - quality
  - release
  stories:
  - key: S29.04.01
    title: Publish test reports and failure artefacts from CI
    wave: 1
    size: s
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer debugging a failed pull request
      iWant: structured test reports, logs and screenshots as build artefacts
      soThat: I can diagnose the failure without rerunning the pipeline locally
    requirements:
    - Unit and integration test results are published in JUnit or TRX format for every pull request.
    - Failed UI tests upload screenshots, device logs and Appium logs with retention of at least 14 days.
    - Artefacts contain no health values, food names, body metrics or free-text user notes.
    - Each automated check has deterministic seed data, a clear owner and a failure message that names the violated product
      or architecture rule.
    acceptanceCriteria:
    - id: AC1
      given: a unit test fails in CI
      when: the workflow completes
      then: the pull request shows the failing test name and an artefact containing the full report
    - id: AC2
      given: a UI test fails after logging a set
      when: artefacts are inspected
      then: no bodyweight, food name or health value appears in screenshots or logs
    - id: AC3
      given: the quality check fails in CI
      when: the result is reported
      then: the S29.04.01 failure message identifies the test area, owner and remediation evidence needed
    implementation:
      notes: Use GitHub Actions artefact upload for reports and screenshots, with retention set deliberately. Seed UI tests
        with synthetic non-personal content because screenshots can otherwise become privacy liabilities. Implementation should
        keep the primary code in .github/workflows/pr.yml, .github/workflows/device-tests.yml, tests/Forge.UiTests/ and use
        actions/upload-artifact. The tricky part is preserving fast plain net10.0 feedback while treating MAUI device automation
        as a small smoke suite, not a full web-style UI net. Use deterministic builders, seeded inputs and explicit failure
        messages. A careless implementation would assert localized visible text, overmock domain logic, ignore architecture
        leaks or let quarantined failures disappear from release evidence.
      touches:
      - .github/workflows/pr.yml
      - .github/workflows/device-tests.yml
      - tests/Forge.UiTests/
      apis:
      - actions/upload-artifact
    testing:
    - Introduce one controlled failing test in a throwaway branch to verify artefact contents before enabling the gate.
    grounding:
    - title: Store workflow data as artefacts
      url: https://docs.github.com/actions/using-workflows/storing-workflow-data-as-artifacts
      note: GitHub Actions artefact upload and retention.
