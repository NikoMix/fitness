        keep the primary code in tools/release/verify-quality-gate.ps1, docs/release/release-candidate-template.yml, .github/workflows/release.yml
        and use xUnit v3, FluentAssertions. The tricky part is preserving fast plain net10.0 feedback while treating MAUI
