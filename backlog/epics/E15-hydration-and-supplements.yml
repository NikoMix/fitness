    persona: newcomer
    concerns: [privacy]
    userStory:
      asA: "Forge user"
      iWant: "recover from health permission changes"
      soThat: "the feature works locally, clearly and safely"
    requirements:
    - Show separate water read and write permission states.
    - Stop sync within 1 foreground event after revocation.
    - Throttle permission prompts to once per 7 days after denial.
    - The flow must work fully offline from the local SQLite store and must not call a Forge backend.
    - Visible text and accessibility labels must use neutral, non-judgemental wording and expose the same redacted values.
    - Water sync must go only through IHealthDataService with Health Connect on Android and HealthKit dietaryWater on iOS.
    acceptanceCriteria:
    - id: AC1
      given: write permission is revoked
      when: Forge foregrounds
      then: status changes to write denied within 1 second and local logging still works
    - id: AC2
      given: permission was denied today
      when: dashboard opens
      then: no prompt appears for at least 7 days
    - id: AC3
      given: the device is in airplane mode
      when: the user completes recover from health permission changes
      then: the action succeeds using only local data or shows a recoverable local-only state
    - id: AC4
      given: a screen reader is enabled
      when: the main controls are focused
      then: labels include the visible units, state and actions without hidden or contradictory values
    implementation:
      notes: >-
        Implement RecoverFromHealthPermissionChangesPage and RecoverFromHealthPermissionChangesViewModel in src/Forge.App/Features/Nutrition, with use cases
        in src/Forge.Core/Nutrition and entities or policies in src/Forge.Domain/Nutrition. Use dx:DXCollectionView, dx:BottomSheet and IHealthDataService
        while keeping DevExpress types out of Application. Build HydrationSyncSettingsPage over IHealthDataService status. Keep prompt throttle in Application
        and process pending outbox items only after explicit Retry sync. The tricky part is preserving Forge's local-first, safety-conscious behavior under
        offline, interrupted and permission-denied paths. A careless implementation would hide validation in XAML, lose source metadata, leak private or
        hidden values through accessibility text, or call a backend that does not exist.
      touches:
      - src/Forge.Domain/Nutrition
      - src/Forge.Core/Nutrition
      - src/Forge.App/Features/Nutrition
      devexpress:
      - dx:DXCollectionView
      - dx:BottomSheet
      apis:
      - IHealthDataService
    testing:
    - Add unit and UI coverage for S15.05.03 acceptance criteria including offline and error paths.
    - Add boundary tests for S15.05.03 covering offline operation, interrupted state, accessibility labels and all numeric thresholds in the 
      acceptance criteria.
    grounding:
    - title: Forge architecture overview
      url: https://github.com/NikoMix/fitness/blob/main/docs/architecture/overview.md
      note: Confirms Forge is local-only, Android and iOS first, with SQLite and mobile performance budgets.
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Grounds virtualized collection rendering for local food, recipe, reminder and history lists.
    - title: DevExpress MAUI BottomSheet
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.BottomSheet
      note: Grounds compact edit, fallback and warning sheets.
    - title: Health Connect get started
      url: https://developer.android.com/health-and-fitness/guides/health-connect/develop/get-started
      note: Grounds Android water sync through the E12 Health Connect abstraction.
    - title: HealthKit dietaryWater quantity type
      url: https://developer.apple.com/documentation/healthkit/hkquantitytypeidentifierdietarywater
      note: Grounds iOS water quantity mapping through HealthKit.
