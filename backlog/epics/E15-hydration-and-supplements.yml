  wave: 3
  summary: >-
    Use local notifications that respect quiet hours, sleep and snooze boundaries.
  outcome: >-
    The feature can be used offline on Android and iOS with deterministic local data and measurable performance.
  concerns: [privacy, perf, safety]
  stories:
  - key: S15.02.01
    title: Schedule hydration reminders with quiet hours
    wave: 3
    size: m
    platforms: [android, ios]
    persona: returner
    userStory:
      asA: "Forge user"
      iWant: "schedule hydration reminders with quiet hours"
      soThat: "the feature works locally, clearly and safely"
    requirements:
    - Use local notifications only.
    - Let users set reminder window, quiet hours and 0 to 12 reminders daily.
    - Cancel remaining reminders once the daily goal is reached.
    - The flow must work fully offline from the local SQLite store and must not call a Forge backend.
    - Visible text and accessibility labels must use neutral, non-judgemental wording and expose the same redacted values.
    - Local reminders must use Plugin.LocalNotification and platform notification APIs, never remote push.
    - Quiet hours and declared sleep hours must override scheduled, snoozed and catch-up reminders.
    acceptanceCriteria:
    - id: AC1
      given: quiet hours are 22:00 to 07:00
      when: 24 hours are scheduled
      then: zero reminders fall inside quiet hours
    - id: AC2
      given: goal is reached at 15:00
      when: scheduler refreshes
      then: all later hydration reminders for today are cancelled
    - id: AC3
      given: the device is in airplane mode
      when: the user completes schedule hydration reminders with quiet hours
      then: the action succeeds using only local data or shows a recoverable local-only state
    - id: AC4
      given: a screen reader is enabled
      when: the main controls are focused
      then: labels include the visible units, state and actions without hidden or contradictory values
    - id: AC5
      given: a reminder would fire during quiet hours or declared sleep hours
      when: the scheduler refreshes
      then: zero notifications are scheduled inside that blocked window
    implementation:
      notes: >-
        Implement ScheduleHydrationRemindersWithQuietHoursPage and ScheduleHydrationRemindersWithQuietHoursViewModel in src/Forge.App/Features/Nutrition,
        with use cases in src/Forge.Core/Nutrition and entities or policies in src/Forge.Domain/Nutrition. Use dx:NumericEdit, dx:DXCollectionView
        and Plugin.LocalNotification while keeping DevExpress types out of Application. Implement a local reminder scheduler adapter using Plugin.LocalNotification
        and store rules locally. Permission denial must leave local logging active. The tricky part is preserving Forge's local-first, safety-conscious
        behavior under offline, interrupted and permission-denied paths. A careless implementation would hide validation in XAML, lose source metadata,
        leak private or hidden values through accessibility text, or call a backend that does not exist.
