- key: F10.02
  title: Run rest timers and device wake behaviour
  wave: 3
  summary: Rest timing must continue when attention is elsewhere. Android and iOS constrain background work differently, so
    Forge combines visible timers, notifications and resume reconciliation.
  outcome: Rest countdowns start automatically, alert reliably, keep the screen awake when appropriate and reconcile after
    lock, background or pocket use.
  stories:
  - key: S10.02.01
    title: Auto-start rest timer after set completion
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: newcomer
    userStory:
      asA: newcomer Forge user
      iWant: the rest timer to start without extra input
      soThat: I can focus on breathing and setup
    requirements:
    - Completing a set starts prescribed rest within 100 ms unless rest is 0 seconds.
    - A radial countdown shows remaining seconds with at least 4.5:1 contrast.
    - The user can add or subtract 15, 30 or 60 seconds with one tap.
    - Primary workout actions are reachable in the lower third of the screen with touch targets at least 48 by 48 dp.
    - Any set, timer or session state commit reports success only after durable local persistence completes within 100 ms.
    - If the app is backgrounded, suspended or killed, relaunch restores all previously committed sets with no duplicates.
    acceptanceCriteria:
    - id: AC1
      given: a set has 120 s rest
      when: the set is completed
      then: a 120 s timer starts within 100 ms
    - id: AC2
      given: a rest timer is running
      when: +30 is tapped
      then: remaining rest increases by exactly 30 s
    - id: AC3
      given: the user has logged 6 sets in an active workout
      when: the process is killed abruptly and the app is relaunched
      then: all 6 sets are present, no duplicate set ids exist and the current exercise is restored
    - id: AC4
      given: the control is shown on a 360 dp wide phone
      when: the user reaches for the primary action
      then: the action is in the lower third and its hit target is at least 48 by 48 dp
    - id: AC5
      given: TalkBack or VoiceOver is enabled
      when: the user navigates the workflow
      then: each actionable control announces a name, current value and action hint
    implementation:
      notes: Code lives in src/Forge.Core/Training/Workout/RestTimerService.cs, src/Forge.App/Features/Workout/RestTimerView.xaml.
        Use dx:RadialGauge, dx:BottomSheet, dx:DXCollectionView only in Forge.App while domain and application stay plain
        DTOs. RestTimerService stores startedAtUtc, targetEndUtc and durationSeconds using TimeProvider. dx:RadialGauge displays
        max(0, targetEndUtc - now). Schedule notification updates when the user adds rest. Naive countdown decrementing fails
        because callbacks stop during iOS suspension, Android process death and lock-screen throttling.
      touches:
      - src/Forge.Core/Training/Workout/RestTimerService.cs
      - src/Forge.App/Features/Workout/RestTimerView.xaml
      devexpress:
      - dx:RadialGauge
      - dx:BottomSheet
      - dx:DXCollectionView
      apis:
      - SQLite EF Core
      - TimeProvider
      - Plugin.LocalNotification
      - Android foreground service
      - UserNotifications
    grounding:
    - title: Android foreground services
      url: https://developer.android.com/develop/background-work/services/foreground-services
      note: Documents foreground service requirements and type declarations for visible ongoing timers.
    - title: Schedule alarms on Android
      url: https://developer.android.com/develop/background-work/services/alarms/schedule
      note: Documents Android exact alarm behavior and Android 14 scheduling restrictions.
    - title: Preparing your UI to run in the background
      url: https://developer.apple.com/documentation/uikit/app_and_environment/scenes/preparing_your_ui_to_run_in_the_background
      note: Documents iOS background transitions where suspended apps do not receive normal timer callbacks.
    - title: .NET MAUI app lifecycle
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/app-lifecycle
      note: Documents lifecycle events used to reconcile local state after sleep, resume and interruptions.
    - title: DevExpress MAUI RadialGauge
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Gauges.RadialGauge
      note: Documents the gauge used for visible rest and interval countdowns.
    - title: DevExpress MAUI NumericEdit
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.NumericEdit
      note: Documents numeric input used for reps, load, RPE, rest and plan targets.
    - title: DevExpress MAUI BottomSheet
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.BottomSheet
      note: Documents the bottom sheet control used for quick actions and previews.
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Documents the virtualized list and swipe action control used for long local lists.
    - title: Build accessible apps with semantic properties in .NET MAUI
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/accessibility
      note: Documents semantic names, hints and screen reader behavior for mobile controls.
    testing:
    - Unit test persistence and boundary rules with an abrupt process-death style reload from SQLite.
    - UI test that the primary action path uses no more than two taps and hit targets are at least 48 by 48 dp.
    - Accessibility test TalkBack and VoiceOver names, values and hints for all actionable controls.
  - key: S10.02.02
    title: Alert when rest expires in foreground and background
    wave: 3
    size: l
    platforms:
    - android
    - ios
    persona: enthusiast
    userStory:
      asA: enthusiast Forge user
      iWant: a reliable cue when rest ends
      soThat: I do not miss the next set
    requirements:
    - Foreground expiry triggers visible, haptic and optional audio cues within 500 ms.
    - Background or locked expiry schedules a local notification for target end time.
    - Android uses a foreground service only while an active workout timer must remain user-visible; iOS uses notifications
      and resume reconciliation.
    - Primary workout actions are reachable in the lower third of the screen with touch targets at least 48 by 48 dp.
    - Any set, timer or session state commit reports success only after durable local persistence completes within 100 ms.
    - If the app is backgrounded, suspended or killed, relaunch restores all previously committed sets with no duplicates.
    acceptanceCriteria:
    - id: AC1
      given: a 5 s foreground timer runs
      when: it expires
      then: visual, haptic and audio-enabled cues fire within 500 ms
    - id: AC2
      given: the screen is locked during 60 s rest
      when: 60 s elapse
      then: a local notification is delivered and reopening shows the timer expired
    - id: AC3
      given: Android timer service is active
      when: the app backgrounds
      then: a user-visible foreground service notification is present
    - id: AC4
      given: the control is shown on a 360 dp wide phone
      when: the user reaches for the primary action
      then: the action is in the lower third and its hit target is at least 48 by 48 dp
    - id: AC5
      given: TalkBack or VoiceOver is enabled
      when: the user navigates the workflow
      then: each actionable control announces a name, current value and action hint
    implementation:
      notes: Code lives in src/Forge.Core/Training/Workout/IWorkoutTimerPlatformService.cs, src/Forge.App/Platforms/Android/WorkoutTimerForegroundService.cs,
        src/Forge.App/Platforms/iOS/WorkoutTimerNotificationScheduler.cs. Use dx:RadialGauge, dx:DXCollectionView only in
        Forge.App while domain and application stay plain DTOs. IWorkoutTimerPlatformService handles alerts. Android declares
        a foreground service with the right foregroundServiceType and notification only while a visible ongoing timer is active;
        Android 14 exact alarm limits mean notifications cannot assume exact alarm permission. iOS schedules a local notification
        and reconciles targetEndUtc on resume because suspended apps do not tick.
      touches:
      - src/Forge.Core/Training/Workout/IWorkoutTimerPlatformService.cs
      - src/Forge.App/Platforms/Android/WorkoutTimerForegroundService.cs
      - src/Forge.App/Platforms/iOS/WorkoutTimerNotificationScheduler.cs
      devexpress:
      - dx:RadialGauge
      - dx:DXCollectionView
      apis:
      - Android foreground service
      - UserNotifications
      - Haptics
      - Plugin.LocalNotification
      - SQLite EF Core
      - TimeProvider
    concerns:
    - store-blocker
    - long-lead
    grounding:
    - title: Android foreground services
      url: https://developer.android.com/develop/background-work/services/foreground-services
      note: Documents foreground service requirements and type declarations for visible ongoing timers.
    - title: Schedule alarms on Android
      url: https://developer.android.com/develop/background-work/services/alarms/schedule
      note: Documents Android exact alarm behavior and Android 14 scheduling restrictions.
    - title: Preparing your UI to run in the background
      url: https://developer.apple.com/documentation/uikit/app_and_environment/scenes/preparing_your_ui_to_run_in_the_background
      note: Documents iOS background transitions where suspended apps do not receive normal timer callbacks.
    - title: .NET MAUI app lifecycle
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/app-lifecycle
      note: Documents lifecycle events used to reconcile local state after sleep, resume and interruptions.
    - title: DevExpress MAUI RadialGauge
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Gauges.RadialGauge
      note: Documents the gauge used for visible rest and interval countdowns.
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Documents the virtualized list and swipe action control used for long local lists.
    - title: Build accessible apps with semantic properties in .NET MAUI
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/accessibility
      note: Documents semantic names, hints and screen reader behavior for mobile controls.
    testing:
    - Unit test persistence and boundary rules with an abrupt process-death style reload from SQLite.
    - UI test that the primary action path uses no more than two taps and hit targets are at least 48 by 48 dp.
    - Accessibility test TalkBack and VoiceOver names, values and hints for all actionable controls.
