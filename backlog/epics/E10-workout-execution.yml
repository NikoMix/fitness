key: E10
title: Workout Execution and Exercise Mode
domain: training
wave: 3
summary: 'Workout execution is Forge''s moment of truth: a user must follow targets, log sets, recover from interruptions
  and finish with useful feedback while tired, sweaty and offline. The active workout flow turns plans into durable training
  history.'
problem: A fitness app can be beautiful everywhere else and still fail if logging a set takes too many taps between heavy
  efforts. Losing an in-progress workout after a crash, phone call or background kill destroys trust.
outcome: A user can start a planned or ad hoc workout, log every set with minimal interaction, run rest and timed formats
  reliably, recover after process death, and complete the session with a satisfying summary.
successMetrics:
- Logging a completed planned set requires no more than 2 taps and commits within 100 ms.
- An in-progress workout with 40 logged sets survives background, process death and relaunch with zero lost sets.
- A screen reader user can log, edit and complete a set with all controls named and reachable.
nonGoals:
- No live camera pose estimation or automatic rep counting in v1.
- No Wear OS or watchOS companion workout mode in v1.
- No cloud sync or multi-device workout continuity in v1.
risks:
- risk: Background rest timers are assumed to run indefinitely on iOS and fail under suspension.
  mitigation: Use local notifications and state reconciliation on resume; treat iOS background time as limited.
  severity: critical
- risk: Set writes are batched and a crash loses recent work.
  mitigation: Persist each committed set immediately to SQLite within the 100 ms budget.
  severity: critical
dependsOn:
- E01
- E09
grounding:
- &id001
  title: DevExpress MAUI DXCollectionView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
  note: Virtualized list control for exercises, templates, sets and swipe actions.
- &id002
  title: DevExpress MAUI NumericEdit
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.NumericEdit
  note: Numeric entry control for sets, reps, load, RPE and rest durations.
- &id003
  title: DevExpress MAUI BottomSheet
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.BottomSheet
  note: Bottom sheet control for quick actions without leaving the main flow.
- &id005
  title: DevExpress MAUI RadialGauge
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Gauges.RadialGauge
  note: Radial countdown control for rest and interval timers.
- title: DevExpress MAUI TabView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Controls.TabView
  note: Tab control used for builder sections and workout subviews.
- &id004
  title: Build accessible apps with semantic properties in .NET MAUI
  url: https://learn.microsoft.com/dotnet/maui/fundamentals/accessibility
  note: Documents SemanticProperties used by TalkBack and VoiceOver.
- title: Android foreground services
  url: https://developer.android.com/develop/background-work/services/foreground-services
  note: Documents foreground service requirements and type declarations for visible ongoing timers.
- title: Schedule alarms on Android
  url: https://developer.android.com/develop/background-work/services/alarms/schedule
  note: Documents Android exact alarm behavior and Android 14 scheduling restrictions.
- title: Preparing your UI to run in the background
  url: https://developer.apple.com/documentation/uikit/app_and_environment/scenes/preparing_your_ui_to_run_in_the_background
  note: Documents iOS background transitions where suspended apps do not receive normal timer callbacks.
features:
- key: F10.01
  title: Run the active workout screen for fast logging
  wave: 3
  summary: The core screen prioritizes the current exercise, target versus actual, and one-handed logging for sweaty hands,
    tired attention and no network.
  outcome: A planned set can be logged, adjusted or corrected with large reachable controls and a durable write under budget.
  stories:
  - key: S10.01.01
    title: Show current exercise with target versus actual
    wave: 3
    size: m
    platforms:
    - android
    - ios
    persona: newcomer
    userStory:
      asA: newcomer Forge user
      iWant: clear instructions for the current exercise
      soThat: I know what to do next without interpreting a spreadsheet
    requirements:
    - Show current exercise name, set number, target reps, load or bodyweight cue, target RPE and rest target above the fold.
    - Previous actuals are visible within one vertical scroll.
    - The next exercise preview does not hide the current set action.
    - Primary workout actions are reachable in the lower third of the screen with touch targets at least 48 by 48 dp.
    - Any set, timer or session state commit reports success only after durable local persistence completes within 100 ms.
    - If the app is backgrounded, suspended or killed, relaunch restores all previously committed sets with no duplicates.
    acceptanceCriteria:
    - id: AC1
      given: a workout starts with squat 3x5 at 60 kg
      when: the active screen renders
      then: Squat, Set 1 of 3, 5 reps, 60 kg and rest target appear before scrolling
    - id: AC2
      given: set 1 is logged
      when: the card updates
      then: set 1 actuals appear and Set 2 becomes primary within 100 ms
    - id: AC3
      given: the user has logged 6 sets in an active workout
      when: the process is killed abruptly and the app is relaunched
      then: all 6 sets are present, no duplicate set ids exist and the current exercise is restored
    - id: AC4
      given: the control is shown on a 360 dp wide phone
      when: the user reaches for the primary action
      then: the action is in the lower third and its hit target is at least 48 by 48 dp
    - id: AC5
      given: TalkBack or VoiceOver is enabled
      when: the user navigates the workflow
      then: each actionable control announces a name, current value and action hint
    implementation:
      notes: Code lives in src/Forge.App/Features/Workout/ActiveWorkoutPage.xaml, src/Forge.Core/Training/Workout/WorkoutSessionQueries.cs.
        Use dx:DXCollectionView, dx:TabView only in Forge.App while domain and application stay plain DTOs. ActiveWorkoutPage
        in Forge.App renders WorkoutSessionDto from Forge.Core with dx:DXCollectionView. Show target, actuals and next
        preview while keeping Complete set in the lower third with at least 48 by 48 dp. Do not expose DevExpress types from
        ViewModels or let secondary navigation hide the commit action.
      touches:
      - src/Forge.App/Features/Workout/ActiveWorkoutPage.xaml
      - src/Forge.Core/Training/Workout/WorkoutSessionQueries.cs
      devexpress:
      - dx:DXCollectionView
      - dx:TabView
      apis:
      - SQLite EF Core
      - Microsoft.Maui.Controls.SemanticProperties
    concerns:
    - a11y
    - perf
    grounding:
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Documents the virtualized list and swipe action control used for long local lists.
    - title: Build accessible apps with semantic properties in .NET MAUI
      url: https://learn.microsoft.com/dotnet/maui/fundamentals/accessibility
      note: Documents semantic names, hints and screen reader behavior for mobile controls.
    testing:
    - Unit test persistence and boundary rules with an abrupt process-death style reload from SQLite.
    - UI test that the primary action path uses no more than two taps and hit targets are at least 48 by 48 dp.
    - Accessibility test TalkBack and VoiceOver names, values and hints for all actionable controls.
  - key: S10.01.02
    title: Log a completed set with no more than two taps
    wave: 3
    size: l
    platforms:
    - android
    - ios
    persona: enthusiast
    userStory:
      asA: enthusiast Forge user
      iWant: to commit the planned set almost instantly
      soThat: tracking does not interrupt training
    requirements:
    - A planned set completes with one primary tap when actuals equal targets.
    - Common plus or minus changes require no more than one adjustment tap plus one commit tap.
    - Every committed set is durable in SQLite within 100 ms and survives immediate process kill.
    - Primary workout actions are reachable in the lower third of the screen with touch targets at least 48 by 48 dp.
