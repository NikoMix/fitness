key: E07
title: Exercise Library and Content Catalogue
domain: training
wave: 2
summary: Forge needs a trustworthy local exercise catalogue that users can browse, search and adapt to the equipment and bodies
  they actually have. This epic covers the data model, original or licensed seed content, discovery, search, filters, detail
  guidance, substitutions, favourites and custom exercises.
problem: Users who do not already know exercise names, target muscles and safe variations cannot turn a goal into action.
  A flat list would force them back to generic web search exactly when Forge should be building trust.
outcome: A mobile-only, offline-first catalogue of several hundred exercises is searchable within one keystroke cycle, browsable
  by muscle, equipment, pattern and goal, and able to explain each movement, recommend substitutes and preserve local user
  additions.
successMetrics:
- Search across 800 seeded and custom exercises returns ranked results within 150 ms of the last keystroke on a Pixel 6a class
  Android device.
- First-run import of 800 compressed JSON exercises completes in under 2.0 s and adds no more than 8 MB to the app package.
- At least 95 percent of seeded exercises include muscles, equipment, pattern, difficulty, steps, mistakes, cues, breathing,
  tempo and safety notes before release candidate cut.
- A user with declared equipment and one limitation can narrow the catalogue to compatible exercises in 3 taps or fewer.
nonGoals:
- No exercise demonstration video or timed media playback, owned by E08.
- No workout plan generation or exercise ordering inside a programme.
- No cloud catalogue, crowdsourced content or remote moderation in v1.
- No medical diagnosis or rehabilitation prescription.
risks:
- risk: Seed content copies a competitor database and creates legal or store-review risk.
  mitigation: Store provenance per exercise, fail packaging without approved original copy or compatible licence, and review
    the final asset before release.
  severity: critical
- risk: Injury-aware filtering is mistaken for medical advice.
  mitigation: Make limitation filtering user-controlled, conservative and clearly labelled as not medical advice.
  severity: high
dependsOn:
- E01
grounding:
- title: Forge architecture overview
  url: https://github.com/NikoMix/fitness/blob/main/docs/architecture/overview.md
  note: Establishes local-only storage, compressed JSON seed assets, SQLite import and Android/iOS-only v1 scope.
- title: DevExpress MAUI DXCollectionView
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
  note: Virtualized list control for large exercise lists.
- title: DevExpress MAUI AutoCompleteEdit
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.AutoCompleteEdit
  note: Search entry with suggestions for names, aliases and slang.
- title: DevExpress MAUI TokenEdit
  url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.TokenEdit
  note: Multi-select filter chips for equipment, muscles, patterns and goals.
features:
- key: F07.01
  title: Model exercise metadata and seed provenance
  wave: 2
  summary: Define the local exercise model, controlled taxonomy, seed import and provenance rules that make every later library
    surface consistent and legally safe.
  outcome: Seeded and custom exercises share one validated model with versioned import and auditable source provenance.
  concerns:
  - offline
  - privacy
  - store-blocker
  stories:
  - key: S07.01.01
    title: Define exercise taxonomy and required metadata
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: team
    userStory:
      asA: developer building training features
      iWant: stable exercise metadata and enums
      soThat: search, filters, workouts and media agree on exercise meaning
    requirements:
    - Exercise includes primary muscles, secondary muscles, equipment, movement pattern, force type, mechanic, difficulty,
      laterality, plane of motion, goal tags and contraindication tags.
    - Movement patterns include hinge, squat, push, pull, carry and rotate; planes include sagittal, frontal and transverse.
    - Forge.Domain owns the model and references no MAUI or DevExpress assemblies.
    - All catalogue browsing, filtering and detail data works offline against the local SQLite store with no backend or remote
      catalogue dependency.
    - Search and filter operations are measured against at least 800 seeded plus custom exercises and return visible results
      within 150 ms of the last keystroke.
    acceptanceCriteria:
    - id: AC1
      given: a seed exercise without primary muscles
      when: catalogue validation runs
      then: validation fails before SQLite writes and reports the exercise key plus field primaryMuscles
    - id: AC2
      given: the Forge.Domain assembly after compilation
      when: referenced assemblies are inspected
      then: zero assembly names start with Microsoft.Maui or DevExpress
    - id: AC3
      given: the 800-exercise catalogue is imported and the user types a search term
      when: 150 ms elapse after the last keystroke
      then: ranked results or a zero-result state are visible and no network request is made
    - id: AC4
      given: the full catalogue is shown in a dx:DXCollectionView
      when: the user scrolls from top to bottom on a Pixel 6a class device
      then: scrolling remains at 60 fps with no measured frame longer than 16.6 ms
    implementation:
      notes: >-
        Implement this around src/Forge.Domain/Training/Exercises/Exercise.cs, keeping domain records in Forge.Domain and
        query services in Forge.Core while Forge.App binds only plain ViewModel state. Use dx:DXCollectionView for
        result and rail surfaces because virtualization is needed for 800 or more cards at the 16.6 ms frame budget. Use dx:AutoCompleteEdit
        for names, aliases and slang, and dx:TokenEdit for equipment, muscle and goal filters. Back search with a SQLite FTS5
        table containing normalized names, aliases, synonyms, muscles, equipment and gym slang. The hard part is ranking seed,
        custom and archived rows consistently offline; a careless build would filter in XAML or scan every row per keystroke.
      touches:
      - src/Forge.Domain/Training/Exercises/Exercise.cs
      - src/Forge.Domain/Training/Exercises/ExerciseTaxonomy.cs
      apis:
      - System.Text.Json
      - SQLite FTS5
      - Microsoft.Data.Sqlite
      devexpress:
      - DXCollectionView
      - AutoCompleteEdit
      - TokenEdit
    testing:
    - Unit tests for required metadata and enum deserialization failures.
    - Performance test using an 800-exercise fixture verifies search completes within 150 ms after the last keystroke.
    - UI performance test verifies dx:DXCollectionView catalogue scrolling stays at 60 fps with no frame above 16.6 ms.
    - Empty-state test verifies zero-result filters show active tokens and Clear Filters restores results.
    grounding:
    - title: DevExpress MAUI DXCollectionView
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.CollectionView.DXCollectionView
      note: Documents the virtualized collection control used for large exercise catalogue lists.
    - title: DevExpress MAUI AutoCompleteEdit
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.AutoCompleteEdit
      note: Documents the suggestion editor used for exercise names, aliases and slang search.
    - title: DevExpress MAUI TokenEdit
      url: https://docs.devexpress.com/MAUI/DevExpress.Maui.Editors.TokenEdit
      note: Documents token selection used for multi-value muscle, equipment and goal filters.
    - title: Microsoft.Data.Sqlite custom SQLite versions
      url: https://learn.microsoft.com/en-us/dotnet/standard/data/sqlite/custom-versions
      note: Documents SQLite bundle choices for local full-text search support in Microsoft.Data.Sqlite.
