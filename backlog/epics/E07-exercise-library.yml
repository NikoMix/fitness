    - Users can create custom exercises with name, muscles, equipment, pattern, difficulty, instructions and optional notes.
    - Custom names are unique case-insensitively within custom records and cannot overwrite seeded records.
    - Deleting a custom exercise with workout history is blocked and Archive is offered instead.
    - All catalogue browsing, filtering and detail data works offline against the local SQLite store with no backend or remote
