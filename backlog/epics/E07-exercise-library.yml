  - key: S07.01.03
    title: Gate seed content through licensing provenance
    wave: 2
    size: m
    platforms:
    - android
    - ios
    persona: team
    concerns:
    - store-blocker
    userStory:
      asA: product owner releasing Forge
      iWant: every exercise to record source and licence
      soThat: the app does not ship copied competitor content
    requirements:
    - Every seed exercise stores provenance type, source name, source URL when applicable, licence identifier and reviewer
      status.
    - Names and descriptions are original Forge copy or derived only from explicitly compatible licences.
    - Packaging fails if provenance is missing, licence is disallowed or copiedSource is true.
    - All catalogue browsing, filtering and detail data works offline against the local SQLite store with no backend or remote
      catalogue dependency.
    - Search and filter operations are measured against at least 800 seeded plus custom exercises and return visible results
      within 150 ms of the last keystroke.
    acceptanceCriteria:
    - id: AC1
      given: a seed exercise with licence unknown
      when: the catalogue lint command runs
      then: the command exits non-zero and names exactly that exercise key
    - id: AC2
      given: the release candidate 800-exercise catalogue
      when: the provenance report is generated
      then: 800 of 800 records show approved status and copiedSource false
    - id: AC3
      given: the 800-exercise catalogue is imported and the user types a search term
      when: 150 ms elapse after the last keystroke
      then: ranked results or a zero-result state are visible and no network request is made
    - id: AC4
      given: the full catalogue is shown in a dx:DXCollectionView
      when: the user scrolls from top to bottom on a Pixel 6a class device
      then: scrolling remains at 60 fps with no measured frame longer than 16.6 ms
    implementation:
      notes: >-
        Implement this around tools/catalogue-lint/Program.cs, keeping domain records in Forge.Domain and query services in
        Forge.Core while Forge.App binds only plain ViewModel state. Use dx:DXCollectionView for result and rail surfaces
        because virtualization is needed for 800 or more cards at the 16.6 ms frame budget. Use dx:AutoCompleteEdit for names,
        aliases and slang, and dx:TokenEdit for equipment, muscle and goal filters. Back search with a SQLite FTS5 table containing
        normalized names, aliases, synonyms, muscles, equipment and gym slang. The hard part is ranking seed, custom and archived
        rows consistently offline; a careless build would filter in XAML or scan every row per keystroke.
      touches:
      - tools/catalogue-lint/Program.cs
      - docs/content/exercise-licensing.md
      apis:
      - SPDX licence identifiers
      - SQLite FTS5
      - Microsoft.Data.Sqlite
      devexpress:
      - DXCollectionView
      - AutoCompleteEdit
      - TokenEdit
    testing:
    - Unit tests for allowed, disallowed and missing licence cases.
    - Performance test using an 800-exercise fixture verifies search completes within 150 ms after the last keystroke.
    - UI performance test verifies dx:DXCollectionView catalogue scrolling stays at 60 fps with no frame above 16.6 ms.
    - Empty-state test verifies zero-result filters show active tokens and Clear Filters restores results.
    grounding:
