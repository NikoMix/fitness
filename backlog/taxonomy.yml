  l: 4
  xl: 8

# ---------------------------------------------------------------------------------------
# Personas - referenced by user stories so the audience stays concrete.
# ---------------------------------------------------------------------------------------
personas:
  - key: newcomer
    name: Maya, the newcomer
    summary: >-
      32, has never followed a structured programme. Intimidated by gyms and by jargon.
      Needs guidance, unambiguous form cues and small early wins. Churns if the first
      session feels complicated.
  - key: returner
    name: Sam, the returner
    summary: >-
      41, trained seriously years ago, coming back after a long gap and an injury. Knows the
      movements but must not reload old volumes. Values autoregulation and warm-ups.
  - key: enthusiast
    name: Alex, the enthusiast
    summary: >-
      27, trains 5x per week, already tracks everything in a spreadsheet. Will judge the app
      on data fidelity, export, PR tracking and how fast logging a set is mid-workout.
  - key: cutter
    name: Priya, the body-composition focused user
    summary: >-
      35, primary goal is fat loss while retaining muscle. Lives in the nutrition and
      hydration surfaces. Needs macro accuracy and fast repeat-meal logging.
  - key: masters
    name: Tom, the masters athlete
    summary: >-
      58, trains for longevity and mobility. Cares about joint-friendly variations, recovery,
      sleep and readiness. Needs large type and high-contrast surfaces.
